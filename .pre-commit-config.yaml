repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.11.4"
    hooks:
      - id: ruff
        args: ["--fix", "--show-fixes", "--output-format=full"]
        # workflows/aidlc_v4{,_eval}/reward/rubric is vendored byte-identical from the offline scorer; see its __init__.py.
        exclude: ^.*\.(ipynb)$|^verl/.*$|^recipe/grpo/qwen3_5/workflows/aidlc_v4(_eval)?/reward/rubric/.*$
      - id: ruff-format
        exclude: ^.*\.(ipynb)$|^verl/.*$|^recipe/grpo/qwen3_5/workflows/aidlc_v4(_eval)?/reward/rubric/.*$