# @package _global_
#
# rLLM-side defaults for native SWE GRPO on verl.
# verl-side knobs (actor/rollout/FSDP) live in train_verl.sh, next to the
# hardware assumptions they encode.

rllm:
  data:
    # In AgentFlow training a batch row is one *merged trajectory*: the
    # prompt is the first turn's prompt and the response accumulates every
    # later turn's observation + action deltas. Response length therefore
    # has to cover a whole multi-turn episode, not a single completion.
    train_batch_size: 4
    val_batch_size: -1
    max_prompt_length: 8192
    max_response_length: 40960

  algorithm:
    adv_estimator: grpo
    norm_adv_by_std_in_grpo: true

  rollout:
    n: 8        # GRPO group size
    n_val: 1
    train:
      temperature: 1.0
      top_p: 1.0
      top_k: 20
      max_tokens: 4096   # per mini-swe-agent turn, not per episode
    val:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      max_tokens: 4096

  gateway:
    # Drift-free multi-turn: turn N+1's prompt is built by extending the raw
    # token IDs of turn N (prompt + sampled completion) instead of
    # re-tokenizing the chat history, so what the policy sampled is exactly
    # what training sees.
    cumulative_token_mode: true
    renderer_family: qwen3.6
    # Without preserve_thinking the Qwen3.5/3.6 bridge refuses to extend
    # across a new *user* message — and every mini-swe-agent turn feeds the
    # shell output back as a user message. Each turn would then fall back to
    # a full re-render (historical <think> blocks dropped, prompt growing
    # O(T^2), prefix-extension chain broken into one batch row per turn).
    renderer_kwargs:
      preserve_thinking: true

  # Zero out the loss on trajectories that were cut off rather than finished,
  # so truncation/timeouts don't get learned as if they were policy choices.
  compact_filtering:
    enable: true
    mask_max_prompt_length_exceeded: true
    mask_max_response_length_exceeded: true
    mask_max_turns_exceeded: true
    mask_timeout: true
    mask_error: true

  workflow:
    # One Docker sandbox per in-flight rollout. Each SWE image is 1-15 GB and
    # the verifier is CPU-heavy, so this is a host-resource knob, not a GPU one.
    n_parallel_tasks: 16
    retry_limit: 2
    raise_on_error: false

  remote_runtime:
    enabled: false   # explicitly not Harbor

  trainer:
    project_name: qwen3_5-swe-grpo
    experiment_name: qwen3_5-4b-mini-swe-native-verl
    logger: ['console']
    val_before_train: true
    test_freq: 5
    save_freq: -1
    total_epochs: 1

  episode_logging:
    log_episodes: true
