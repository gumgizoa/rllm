# Native openhands-sdk harness kwargs -- rllm eval --agent openhands-sdk --agent-kwargs @recipe/eval/config/openhands-sdk.yaml
#
# Unset keys keep the SDK defaults (500 iterations; FinishTool + ThinkTool).
# Model request params (reasoning_effort, chat_template_kwargs) go in --sampling-params.
max_iterations: 150                  # cap on agent steps per rollout
include_default_tools: [FinishTool]  # drop ThinkTool: models with reasoning on already think every turn
# true: no SDK repair of wrong tool calls (str_replace -> file_editor, ...); the model gets
# the error instead. false keeps the SDK default, under which earlier results were measured.
strict_tool_calls: false
