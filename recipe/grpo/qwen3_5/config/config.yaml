# Hydra entry point for the Qwen3.5-4B native SWE GRPO recipe.
#
# `hydra.searchpath` is what lets a config living outside the rllm package
# reference rLLM's and verl's config groups. It also has to live here, in the
# *primary* config, which is why `unified.yaml` is not pulled in as a default:
# it declares a searchpath of its own and Hydra rejects that from a non-primary
# config. So this file inlines what `unified` composes -- rllm/base plus the
# verl backend (which itself pulls in verl's ppo_trainer) -- and then layers
# this recipe's overrides from `rllm_grpo.yaml`.
defaults:
  - rllm: base
  - rllm/backend: verl
  - rllm_grpo      # the `rllm.*` tree: data, rollout sampling, gateway, GRPO, filtering
  - verl_trainer   # verl-native: model, FSDP2 actor/ref, vLLM rollout engine
  - _self_
  # An optional preset layered *after* this file, so its values win over the
  # defaults below: `variant=openhands_9b` / `variant=openhands_9b_aidlc`
  # (see config/variant/). Unset = the 4B + mini-swe-agent run as before.
  - variant: null

# Recipe-level knobs read by train.py (not part of rLLM's schema).
recipe:
  # Which harness runs inside the task sandbox. Both honour agent_step_limit.
  #   mini-swe-agent  StepLimitedMiniSweAgent (train.py); takes no workflow
  #   openhands-sdk   workflow_harness.OpenHandsSdkWorkflow
  agent: mini-swe-agent
  # Workflow layered on the harness (openhands-sdk only). name is a key of
  # workflows.WORKFLOWS, whose entry holds the documents, the instruction and the
  # system prompt together -- they name each other by absolute container path.
  # null = the plain harness, so the baseline run is unchanged;
  # `variant=openhands_9b_aidlc` sets aidlc_v4.
  workflow:
    name: null
    # A list mixes workflows: each task runs under one of them, uniform i.i.d. over
    # the list and fixed per task by a hash of (seed, task id), so all rollouts of a
    # task -- one GRPO group -- share it. `none` in the list is the plain harness:
    #   recipe.workflow.name=[none,aidlc_v4,speckit_bug]
    # A mix logs workflow/<name>/resolved per episode, and mounts one agent image
    # carrying every listed workflow's agent_image_extra.
    seed: 0
    # Pins every validation task to one workflow (it need not be in `name`);
    # null = the validation set is split like the training set.
    val_name: null
    # Where the workflow instruction goes in the user message. prefix = before
    # the task text, suffix = after it (the Harbor arrangement, and the code default).
    # Run 2 (2026-09-29, suffix) put the task prompt's six-step procedure
    # (OpenHands' SWE-bench prompt, reused by SkyRL-v0) between the
    # issue and the AI-DLC pointer and 86% of rollouts never read the workflow
    # (reports/2026-09-30_aidlc_swegym_compliance.md), so the recipe uses prefix.
    instruction_position: prefix
    # Compliance reward. With a workflow whose scorer covers the harness, its
    # signals are always scored and logged (aidlc: order_v6 + stage bands s1..s5,
    # each in [0, 1], as aidlc/* episode metrics). With compliance_reward.enable the
    # workflow's reward_signal (aidlc: their equal-weight mean, aidlc/compliance)
    # enters the reward, then budget_reward_scale applies:
    #   mode: mul   reward = verifier * compliance        (unsolved stays 0)
    #   mode: add   reward = verifier + lam * compliance  (bonus of at most lam)
    # `variant=openhands_9b_aidlc_reward` turns it on.
    compliance_reward:
      enable: false
      mode: mul
      lam: 0.2          # mode=add only
  train_dataset: rllm_swesmith_fn50   # single-function mutations; see scripts/prepare_datasets.py KIND_RE
  train_split: train
  train_limit: -1          # <=0 keeps the whole registered split
  val_dataset: swebench_verified_balanced   # difficulty-balanced; see val_tasks.txt
  val_split: test
  val_limit: -1
  sandbox_backend: docker  # SANDBOX_BACKEND env var wins
  sandbox_concurrency: 16     # caps live sandboxes AND the warm-queue prefetch depth
  # Turn budget per rollout: mini-swe-agent's agent.step_limit, or the SDK's
  # OPENHANDS_MAX_ITERATIONS. The engine reads the same number to stamp
  # MAX_TURNS_EXCEEDED.
  # Not cross-checked against the context window: nothing bounds tokens-per-turn
  # tightly enough for the arithmetic to mean much (measured median 542, worst
  # 1151), so a turn that overruns max_model_len is handled at rollout time
  # rather than predicted here.
  agent_step_limit: 150
  agent_image: auto        # auto | skip | repo:tag  (RLLM_AGENT_IMAGE env var wins)
  # Keep each task workdir's .git out of the sandbox while the agent runs and
  # put it back for the verifier (rllm/sandbox/git_history.py). SWE task images
  # ship commits past the base commit, fix included (SWE-smith: `git show HEAD`
  # prints the answer), so a policy can learn to copy the fix from history.
  # Docker backend only.
  hide_git_history: false
  # SWE-Master reward shaping (arXiv 2602.03411, sec. 3.4.2, eq. 4): a rollout
  # that ran out of budget -- turns, context window, or agent wall clock -- is
  # still graded, and its reward is multiplied by this. The paper's code uses
  # 0.5. 1.0 disables the shaping; 0.0 is the DeepSWE "zero it" variant that
  # sec. 6.3 reports collapsed training. Which reasons count is
  # BUDGET_EXHAUSTED in train.py; which reasons are dropped outright is
  # rllm.compact_filtering in rllm_grpo.yaml.
  budget_reward_scale: 0.5

hydra:
  run:
    dir: ${oc.env:RLLM_RUN_DIR,outputs}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  searchpath:
    - pkg://rllm.trainer.config
    - pkg://verl.trainer.config
