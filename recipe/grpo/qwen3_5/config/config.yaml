# Hydra entry point for the native SWE GRPO recipe: Qwen3.5-9B on swe_feat with
# openhands-sdk, 8 x H200.
#
# `hydra.searchpath` is what lets a config living outside the rllm package
# reference rLLM's and verl's config groups. It also has to live here, in the
# *primary* config, which is why `unified.yaml` is not pulled in as a default:
# it declares a searchpath of its own and Hydra rejects that from a non-primary
# config. So this file inlines what `unified` composes -- rllm/base plus the
# verl backend (which itself pulls in verl's ppo_trainer) -- and then layers
# this recipe's overrides from `rllm_grpo.yaml`.
defaults:
  - rllm: base
  - rllm/backend: verl
  - rllm_grpo      # the `rllm.*` tree: data, rollout sampling, gateway, GRPO, filtering
  - verl_trainer   # verl-native: model, FSDP2 actor/ref, vLLM rollout engine
  - _self_

# Recipe-level knobs read by train.py (not part of rLLM's schema).
recipe:
  # 171 swe_feat tasks Qwen3.5-9B solved at least once but not 4/4 (scripts/prepare_swefeat.py)
  train_dataset: swefeat_9b_train
  train_split: train
  train_limit: -1          # <=0 keeps the whole registered split
  # 50 SWE-bench Pro V2 Python tasks, stratified by repo (scripts/select_swebenchpro_v2_val.py)
  val_dataset: swebenchpro_v2_py50
  val_split: test
  val_limit: -1
  sandbox_backend: docker  # SANDBOX_BACKEND env var wins
  sandbox_concurrency: 16     # caps live sandboxes AND the warm-queue prefetch depth
  # Which agent runs inside the task sandbox: mini-swe-agent | openhands-sdk
  # (rllm/harnesses/mini_swe_agent.py, rllm/harnesses/openhands_sdk.py). Both
  # call the model through the gateway and are graded by the task's tests/test.sh,
  # so the trajectory and reward path is the same; the system prompt, tools and
  # observation format differ. openhands-sdk's system prompt + tool specs alone
  # are ~7.2K tokens (see rllm_grpo.yaml max_prompt_length).
  harness: openhands-sdk
  # Turn budget per rollout: mini-swe-agent agent.step_limit, openhands-sdk
  # max_iteration_per_run. Either way one LLM call per turn, and the engine
  # stamps MAX_TURNS_EXCEEDED when the trace count reaches it.
  # Not cross-checked against the context window: nothing bounds tokens-per-turn
  # tightly enough for the arithmetic to mean much (measured median 542, worst
  # 1151), so a turn that overruns max_model_len is handled at rollout time
  # rather than predicted here.
  # 250, up from 150: at 150 about 9% of this policy's swe_feat rollouts ran out of turns.
  agent_step_limit: 250
  # openhands-sdk only. SDK built-in tools to include, same as `rllm eval
  # --agent-kwargs` include_default_tools (recipe/eval/config/openhands-sdk.yaml):
  # FinishTool lets the agent end the run; ThinkTool is left out because a model
  # with reasoning on already thinks every turn and it would only spend steps.
  openhands_default_tools: [FinishTool]
  agent_image: auto        # auto | skip | repo:tag  (RLLM_AGENT_IMAGE env var wins)
  # Keep each task workdir's .git out of the sandbox while the agent runs and
  # put it back for the verifier (rllm/sandbox/git_history.py). SWE task images
  # ship commits past the base commit, fix included (SWE-smith: `git show HEAD`
  # prints the answer), so a policy can learn to copy the fix from history.
  # Docker backend only.
  # On: the pass counts that picked the training tasks were measured with the history
  # hidden (rllm eval --hide-git-history); train the same way.
  hide_git_history: true
  # Docker sandboxes are kept off the internet: with it, agents fetched the
  # task's own upstream release or repository and copied the fix.
  # agent_network: internet while the agent runs (and so for the verifier too).
  # verify_network: internet for the verifier only, for tests that download
  # datasets, models or build backends. Docker backend only.
  agent_network: false
  verify_network: true
  # SWE-Master reward shaping (arXiv 2602.03411, sec. 3.4.2, eq. 4): a rollout
  # that ran out of budget -- turns, context window, or agent wall clock -- is
  # still graded, and its reward is multiplied by this. The paper's code uses
  # 0.5. 1.0 disables the shaping; 0.0 is the DeepSWE "zero it" variant that
  # sec. 6.3 reports collapsed training. Which reasons count is
  # BUDGET_EXHAUSTED in train.py; which reasons are dropped outright is
  # rllm.compact_filtering in rllm_grpo.yaml.
  budget_reward_scale: 0.5

hydra:
  run:
    dir: ${oc.env:RLLM_RUN_DIR,outputs}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  searchpath:
    - pkg://rllm.trainer.config
    - pkg://verl.trainer.config
