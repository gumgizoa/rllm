# @package _global_
#
# Everything verl reads natively -- `model`, `actor_rollout_ref`, `trainer` --
# for this recipe: FSDP2 actor/ref and the vLLM rollout engine. The `rllm.*`
# half is the sibling file `rllm_grpo.yaml`.
#
# Kept in YAML rather than as CLI flags in train_verl.sh so that a single
# decision lives in a single place: the length budget spans rllm.data.* and
# actor_rollout_ref.rollout.*, and when those sat in different files they
# drifted.
#
# Hardware: 8 x H200 (141 GB), single node.

model:
  # Also consumed by the gateway to load the tokenizer for cumulative token mode.
  name: ${oc.env:MODEL_PATH,Qwen/Qwen3.5-9B}

actor_rollout_ref:
  hybrid_engine: true      # colocate vLLM and the FSDP actor, time-sliced

  model:
    path: ${model.name}
    trust_remote_code: true
    enable_gradient_checkpointing: true

    # Qwen3.5's vocab is 248320 tokens, so a sequence's fp32 logits take ~1 MB
    # per token: ~260 GB for one 256K-token row, a single allocation no card
    # holds. The fused linear+log-prob kernel computes log_probs/entropy in
    # chunks off the hidden states and never materializes logits. It consumes
    # the packed (remove-padding) layout, so these two go together.
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch
    use_remove_padding: true

  actor:
    # fsdp2 (per-parameter DTensor sharding) beat fsdp1 on peak memory, speed,
    # actor update time and rollout/actor log-prob agreement, without FSDP1's
    # state_dict deprecation warnings. verl also patches this model's vision tower specifically for the
    # fsdp2 cpu_offload path, so it is the path upstream expects.
    strategy: fsdp2

    # Sequence parallelism works only with the backported verl patch (see
    # scripts/apply_verl_patches.sh). It costs actor-update time, but 9B rows of
    # up to 256K tokens are where activation memory binds, so it is on: each
    # sequence is split over 2 GPUs (8 GPUs -> 4 data-parallel ranks).
    ulysses_sequence_parallel_size: 2

    # One sequence per micro-batch. >1 is numerically correct once the backport
    # is applied, but measured ~2x slower per token and doubles activation
    # memory, which at a 256K context is what runs out first.
    use_dynamic_bsz: false
    ppo_micro_batch_size_per_gpu: 1

    # Counted in prompts: 8 prompts x rollout.n (8) = 64 trajectories per
    # optimizer update. rllm.data.train_batch_size (32) x 8 = 256 trajectories
    # per step, so each step makes 4 updates; only the first is strictly on-policy.
    ppo_mini_batch_size: 8

    optim:
      lr: 1e-6
    entropy_coeff: 0.0
    fsdp_config:
      param_offload: true
      optimizer_offload: true

  ref:
    strategy: fsdp2
    ulysses_sequence_parallel_size: 2   # same split as the actor
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
    # NB: with rllm.algorithm.kl_beta=0 the reference worker is never created.

  rollout:
    name: vllm
    mode: async                      # required by the AgentFlow/gateway path
    tensor_model_parallel_size: 1    # -> one vLLM server per GPU
    # Fraction of each 141 GB H200 vLLM reserves at startup: ~99 GB, i.e. ~80 GB
    # of KV after the 18.8 GB bf16 weights, ~10 sequences at 256K per GPU (6 are
    # in flight at n_parallel_tasks=48). Safe to take above 0.5 because the FSDP
    # actor is CPU-offloaded while vLLM is awake and vLLM sleeps (weights + KV
    # freed) during old_log_prob and the actor update.
    gpu_memory_utilization: 0.70
    enforce_eager: false             # keep torch.compile + CUDA graphs
    free_cache_engine: true
    log_prob_micro_batch_size_per_gpu: 1
    val_kwargs:
      do_sample: true

    # = rllm.data.max_prompt_length + max_response_length. Overrunning this is
    # not a truncation: vLLM answers 400 mid-rollout, litellm's retries hit the
    # same wall, and the episode is discarded whole. One run at 32768 lost 28%
    # of its rollouts that way.
    max_model_len: 262144

    engine_kwargs:
      vllm:
        reasoning_parser: qwen3
        # mini-swe-agent v2 requires the model to answer with a 'bash' TOOL CALL,
        # and its litellm client always sends tool_choice="auto", which vLLM
        # rejects unless auto tool choice is on. qwen3_xml matches Qwen3.5's
        # <tool_call><function=..><parameter=..> template markup.
        enable_auto_tool_choice: true
        tool_call_parser: qwen3_xml

trainer:
  n_gpus_per_node: 8
  # rllm/trainer/verl/utils.py:240 forwards this as save_checkpoint's
  # max_ckpt_to_keep. An FSDP checkpoint here is bf16 weights plus fp32 Adam
  # state and master copy over 9.41B params -- on the order of 130 GB each -- so
  # an unbounded run fills a volume quickly.
  max_actor_ckpt_to_keep: 5
  # verl's default is relative to the cwd, i.e. inside the repo (network storage
  # on some nodes). RLLM_CKPT_DIR (.env) points it at local disk.
  default_local_dir: ${oc.env:RLLM_CKPT_DIR,${oc.env:RLLM_HOME}/checkpoints}/${rllm.trainer.project_name}/${rllm.trainer.experiment_name}
  nnodes: 1
  default_hdfs_dir: null
  resume_mode: disable
