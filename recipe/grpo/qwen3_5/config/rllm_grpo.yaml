# @package _global_
#
# Everything under the `rllm.*` config tree: the data budget, rollout
# sampling, the model gateway, GRPO, and episode filtering/logging.
#
# The verl-native half of the run -- model, actor/ref FSDP, the vLLM rollout
# engine -- is the sibling file `verl_trainer.yaml`. The split is by config
# tree, not by topic, so any key here starts with `rllm.` and no key there
# does.

rllm:
  data:
    # In AgentFlow training a batch row is one *merged trajectory*: the
    # prompt is the first turn's prompt and the response accumulates every
    # later turn's observation + action deltas. Response length therefore
    # has to cover a whole multi-turn episode, not a single completion.
    # 32 tasks x rollout.n=8 = 256 trajectories per step. verl requires
    # train_batch_size * rollout.n to be divisible by n_gpus (256 % 8 = 0).
    train_batch_size: 32
    val_batch_size: 32
    # Only max_prompt_length is a real choice here: it is the padded width of
    # the initial prompt (system + tool spec + issue statement). mini-swe-agent's
    # is 1.1-1.3K; openhands-sdk's system prompt and tool specs alone measure
    # ~7.2K tokens before the issue statement, so 8K left no room for it. An
    # overrun is not an error: transform.py:38 cuts the prompt from the LEFT,
    # dropping the head of the system prompt the policy actually sampled with.
    # max_response_length is whatever is left of the context window, and is
    # derived rather than restated -- the same truncation drops the tail of
    # every long episode when it is stale. 256K window: 16384 + 245760 =
    # verl_trainer.yaml max_model_len (262144, Qwen3.5-9B's max_position_embeddings).
    max_prompt_length: 16384
    max_response_length: 245760

  algorithm:
    # SWE-Master leave-one-out estimator: rllm/trainer/algorithms/rl_algo.py:26
    adv_estimator: rloo
    # Inert while adv_estimator=rloo -- calculate_rloo_advantages_per_group
    # takes no such argument -- but it is also the value the paper argues for:
    # dividing by the group std biases the update by task-difficulty variance.
    # Stated explicitly so a revert to `grpo` does not silently bring it back.
    norm_adv_by_std_in_grpo: false
    eps_clip_high: 0.28
    # kl_beta=0 is the real switch, and it does more than zero a loss term:
    # verl's need_reference_policy() is (use_kl_in_reward or use_kl_loss), and
    # use_kl_loss is *derived* from kl_beta by sync_config. At 0 the reference
    # policy worker is never created, so each batch skips a full 9B forward
    # pass and its memory. Do not set actor.use_kl_loss directly -- that
    # suppresses the derivation and hides where the knob lives.
    kl_beta: 0.0
    loss_agg_mode: seq-mean-token-sum

  rollout:
    n: 8        # GRPO group size
    n_val: 2
    train:
      temperature: 1.0
      top_p: 0.95
      max_tokens: 16384  # per agent turn, not per episode
    val:
      temperature: 1.0
      top_p: 0.95
      max_tokens: 16384

  gateway:
    # Drift-free multi-turn: turn N+1's prompt is built by extending the raw
    # token IDs of turn N (prompt + sampled completion) instead of
    # re-tokenizing the chat history, so what the policy sampled is exactly
    # what training sees.
    cumulative_token_mode: true
    renderer_family: qwen3.6
    # Without preserve_thinking the Qwen3.5/3.6 bridge refuses to extend
    # across a new *user* message — and every mini-swe-agent turn feeds the
    # shell output back as a user message. Each turn would then fall back to
    # a full re-render (historical <think> blocks dropped, prompt growing
    # O(T^2), prefix-extension chain broken into one batch row per turn).
    renderer_kwargs:
      preserve_thinking: true

  # Despite the `mask_*` names these DROP the episode (transform.py:120 does a
  # `continue`), before TrajectoryGroups are built -- so a filtered rollout also
  # stops contributing to its GRPO group's mean/std, not just to the loss.
  # Token-level masking of observation tokens is a separate, always-on thing.
  #
  # Which reasons to drop follows SWE-Master (arXiv 2602.03411, sec. 3.4.2 and
  # 6.3). The paper splits terminations into two kinds and treats them
  # differently:
  #   * budget exhaustion (turns, tokens, agent wall clock): the rollout is
  #     *kept*, graded on whatever the repo looks like, and its reward is
  #     scaled by 0.5. Dropping these -- the DeepSWE recipe -- collapsed
  #     their training (sec. 6.3), and it also removes the hardest tasks
  #     from the curriculum, since those are the ones that run out of budget.
  #   * infrastructure failure (container, verifier): the rollout says
  #     nothing about the policy, so it is removed.
  # So only the infrastructure reasons are masked here; the 0.5 scaling for
  # the budget reasons lives in train.py.
  compact_filtering:
    enable: true
    mask_max_prompt_length_exceeded: false   # budget: context window (paper's MAX_TOKENS)
    mask_max_response_length_exceeded: false # no producer on the native path; see README
    mask_max_turns_exceeded: false           # budget: turn limit (paper's MAX_STEPS)
    mask_timeout: true                       # infrastructure: verifier ran out of clock
    mask_error: true                         # infrastructure: no reward file, upstream 5xx, sandbox

  workflow:
    # One Docker sandbox per in-flight rollout, and -- since the agent makes one
    # LLM call at a time -- also the cap on concurrent requests to the 8 vLLM
    # servers (48 -> 6 sequences per GPU). Keep equal to recipe.sandbox_concurrency.
    # Host side: 48 x (4 CPU quota, 16 GB) on 192 cores / 2 TB. GPU side: at
    # gpu_memory_utilization 0.70 a GPU's KV cache holds ~10 sequences at the full
    # 256K context (Qwen3.5-9B: 8 full-attention layers, 32 KB/token).
    n_parallel_tasks: 48
    retry_limit: 3
    raise_on_error: false

  # Per-rollout wall clock, seconds. Set here, these win over task.toml's
  # [agent]/[verifier] timeout_sec (rllm/timeouts.py). The verifier's 1000 s is
  # reserved out of the 4800 s budget first, so the agent gets
  # min(3600, 4800 - 1000) = 3600 s.
  timeouts:
    rollout: 4800
    agent: 3600
    verifier: 1000

  remote_runtime:
    enabled: false   # explicitly not Harbor

  trainer:
    project_name: qwen3_5-swe-grpo
    experiment_name: qwen3_5_9b-openhands_sdk-swefeat-aws
    logger: ['console', 'wandb']
    val_before_train: true
    test_freq: 3
    save_freq: 3
    total_epochs: 3

  episode_logging:
    log_episodes: true
    # Default is `logs/<project>/<experiment>` relative to cwd, i.e. inside the
    # repo. Episodes carry the full chat history, so they run ~2.5 MB each --
    # 32 per step adds up to gigabytes on whatever filesystem the repo lives on,
    # which in a container is usually the small one. Put them under RLLM_HOME
    # instead, next to the datasets they came from. The fallback is rLLM's own
    # (rllm/paths.py:23), so an unset RLLM_HOME lands them beside the datasets
    # either way; train_verl.sh is what refuses to launch without one.
    # RLLM_RUN_ID is stamped by train.py (and pinned by train_verl.sh) so two
    # runs of the same experiment cannot merge or overwrite each other's episodes.
    episode_log_dir: ${oc.env:RLLM_HOME,${oc.env:HOME}/.rllm}/episodes/${rllm.trainer.project_name}/${rllm.trainer.experiment_name}/${oc.env:RLLM_RUN_ID}
