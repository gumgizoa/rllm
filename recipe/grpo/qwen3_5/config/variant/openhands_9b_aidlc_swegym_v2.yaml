# @package _global_
#
# Qwen3.5-9B + openhands-sdk + AI-DLC on SWE-Gym, prompt arrangement v2.
# Everything from openhands_9b_aidlc_swegym (no-think, 131K context, 100
# turns, hide_git_history, FSDP1, checkpoint every step) with the two prompt
# changes that fixed workflow entry (reports/2026-09-30_aidlc_swegym_compliance.md):
#
#   1. the task prompt without SkyRL-v0's six-step procedure
#      (swegym293_aidlc / swegym_val23_aidlc, built by
#      prepare_swegym.py --instruction aidlc);
#   2. the AI-DLC instruction placed *before* the task text
#      (recipe.aidlc.instruction_position=prefix).
#
# Measured on the base model, run 2's 32 step-1 tasks x 4, 40-turn budget:
# core-workflow.md read 13% -> 91%, artifact 1 written 1.6% -> 45%.
# The workflow documents (aidlc/core-workflow.md, rule-details/) are unchanged.
#
# Compliance is scored and logged (aidlc/*) but not rewarded here; the
# rewarded arm is openhands_9b_aidlc_swegym_v2_reward.
#
#   python recipe/grpo/qwen3_5/scripts/prepare_swegym.py --parquet-dir /path/to/SkyRL-v0-293-data --instruction aidlc
#   bash recipe/grpo/qwen3_5/train_verl.sh variant=openhands_9b_aidlc_swegym_v2

defaults:
  - openhands_9b_aidlc_swegym

recipe:
  train_dataset: swegym293_aidlc
  val_dataset: swegym_val23_aidlc
  aidlc:
    instruction_position: prefix

rllm:
  trainer:
    experiment_name: qwen3_5-9b-openhands-sdk-aidlc-swegym293-v2
