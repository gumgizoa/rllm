# @package _global_
#
# openhands_9b_speckit_openspec_agentos_swegym_reward with a compliance floor of 0.7:
#
#   reward = verifier * (0.7 + 0.3 * <workflow>/compliance)      (unsolved stays 0)
#
# Everything else -- the speckit_bug / openspec_ff / agentos_v2 mix (fixed per task by the hash
# of (seed 0, task id)), validation pinned to AI-DLC, 250 turns in 262144 (16384 + 245760),
# thinking on, FSDP1 + Ulysses sp 2, one update per step -- is inherited unchanged.
#
# Why a floor: with floor 0 (the plain product) a solved rollout that complied poorly can earn
# less than its group mean, so the group advantage pushes *against* solving. README "Compliance
# reward" measured on wf-tcx rollouts: floor 0.7 gives +0.30 mean advantage to solves in mixed
# groups, no solve below any failure, and a 12% compliance-only share of the signal.
#
# Matched to the no-workflow control it is compared against (openhands_9b_swegym_think, run
# 20261106_073256): same rollout gpu_memory_utilization below; pass the same launcher overrides
# as that run (rllm.workflow.n_parallel_tasks=64 recipe.sandbox_concurrency=64
# trainer.max_actor_ckpt_to_keep=5) so the two arms differ only in the workflow and the reward.
#
#   bash recipe/grpo/qwen3_5/train_verl.sh variant=openhands_9b_speckit_openspec_agentos_swegym_reward_floor \
#       rllm.workflow.n_parallel_tasks=64 recipe.sandbox_concurrency=64 trainer.max_actor_ckpt_to_keep=5

defaults:
  - openhands_9b_speckit_openspec_agentos_swegym_reward

recipe:
  workflow:
    compliance_reward:
      enable: true
      mode: mul
      floor: 0.7

rllm:
  trainer:
    experiment_name: qwen3_5-9b-openhands-sdk-think-swegym293-speckit-openspec-agentos-floor07-topp1

actor_rollout_ref:
  rollout:
    # Same as the control arm (openhands_9b_swegym_think); base is 0.50 (verl_trainer.yaml).
    gpu_memory_utilization: 0.7
