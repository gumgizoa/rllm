# @package _global_
#
# Qwen3.5-9B + openhands-sdk + AI-DLC, trained on SWE-Gym (SkyRL-v0-293-data).
# Everything from openhands_9b_aidlc, plus three things:
#
#   1. the datasets scripts/prepare_swegym.py builds and registers:
#      swegym293/train (293 SWE-Gym instances) and swegym_val23/test (SkyRL-v0's
#      23 validation instances), graded by swegym's own eval_script;
#   2. host sizing for an 8 x H200 (141 GB) node with 224 cores;
#   3. the 9B-specific verl choices openhands_9b only leaves as notes (FSDP1,
#      one on-policy update per step) -- see the bottom of this file.
#
#   python recipe/grpo/qwen3_5/scripts/prepare_swegym.py --parquet-dir /path/to/SkyRL-v0-293-data
#   bash recipe/grpo/qwen3_5/train_verl.sh variant=openhands_9b_aidlc_swegym
#
# Control arm on the same data (SDK's own workflow, no documents):
#   bash recipe/grpo/qwen3_5/train_verl.sh variant=openhands_9b_swegym
#
# The turn budget (agent_step_limit=80) and the context window
# (8192 + 122880 = 131072) are inherited from openhands_9b unchanged: the 4B
# ran 131072 at 36 GB peak on an 80 GB card, the 9B's hidden size is 1.6x, so
# ~60-70 GB of activations fit a 141 GB H200. If the first update_actor OOMs,
# shrink the three knobs together (README, "Picking agent_step_limit and
# max_model_len together"), e.g.
#   recipe.agent_step_limit=40 rllm.data.max_response_length=57344 actor_rollout_ref.rollout.max_model_len=65536

defaults:
  - openhands_9b_aidlc

recipe:
  train_dataset: swegym293
  train_split: train
  val_dataset: swegym_val23
  val_split: test
  # Each task.toml caps its sandbox at 4 cpus / 16 GB (prepare_swegym.py
  # RESOURCES), so 32 live sandboxes are 128 cores and 512 GB beside the
  # eight vLLM servers and eight FSDP workers. n_parallel_tasks below must
  # not exceed this, or rollouts queue on the warm-sandbox pool.
  sandbox_concurrency: 32
  # The xingyaoww SWE-Gym images keep the upstream history past base_commit:
  # in run 1 (2026-09-23, this flag off) 12.6% of training rollouts read the
  # fix commit via `git log --all` + `git show`, and 3 of the 8 validation
  # tasks the base model "solved" came from it (reports/2026-09-23_*.md,
  # "Reward hacking 감사"). On: .git is moved to the host while the agent runs
  # and restored before the verifier (rllm/sandbox/git_history.py). Costs one
  # .git transfer each way per rollout (time/git_hide_s); put TMPDIR on a
  # large local disk (.env), not the container's writable layer. Note the
  # instruction still quotes the base commit sha, which the agent can no
  # longer `git diff` against; harmless.
  hide_git_history: true

rllm:
  data:
    # The first turn of an openhands-sdk episode is ~7.4K tokens before the
    # task text (SDK system prompt, three tool schemas, repository/environment
    # info; measured 8716 on a 1396-token instruction), and SWE-Gym
    # instruction.md runs 623-5344 tokens (median 1040), so first prompts
    # reach ~12.8K. The base 8192 is *silently* left-truncated by
    # transform._pad_sequence_batch -- the smoke run trained every row on a
    # prompt missing its first ~500 tokens (prompt_length/clip_ratio 1.0) and
    # rollout/actor log-prob agreement fell to 0.99. Same window as before:
    # 16384 + 114688 = 131072 = max_model_len.
    max_prompt_length: 16384
    max_response_length: 114688
  workflow:
    n_parallel_tasks: 32
  gateway:
    renderer_kwargs:
      preserve_thinking: true
      # No-think mode (decided 2026-09-23). This one key drives both halves of
      # the episode: train.py hands it to the harness, which sends it to the
      # SDK as a chat_template_kwarg so vLLM renders turn 1 with the empty
      # ``<think>\n\n</think>\n\n`` block, and the qwen3.6 renderer emits the
      # same block on turns 2+. The model's own default is thinking ON (the
      # first smoke run sampled 100-350 chars of reasoning per turn), so this
      # must be explicit; do not leave it to the renderer's HF-id table, which
      # a local MODEL_PATH misses anyway. Set to true to train with thinking;
      # the wiring keeps the two halves consistent either way.
      enable_thinking: false
  trainer:
    experiment_name: qwen3_5-9b-openhands-sdk-aidlc-swegym293
    # 293 tasks / 32 per step = 9 steps per epoch; 3 epochs = 27 steps.
    # test_freq stays at 3 (rllm_grpo.yaml).
    total_epochs: 3
    # Every step is checkpointed and none is deleted (max_actor_ckpt_to_keep
    # below), so the whole 27-step trajectory can be evaluated afterwards.
    # A full FSDP checkpoint of the 9B (bf16 weights + fp32 Adam moments and
    # master copy) is ~110 GB: 27 of them are ~3 TB under RLLM_ARTIFACT_DIR.
    # Weights-only (~18 GB each, no exact optimizer resume) is
    #   actor_rollout_ref.actor.checkpoint.save_contents=[model]
    save_freq: 1
  episode_logging:
    # Same layout as rllm_grpo.yaml, rooted at RLLM_ARTIFACT_DIR when set: the
    # episode JSONs (one per rollout per step, full observations / model
    # responses / reward / termination reason) are what post-hoc analysis
    # reads, so they belong on the storage that outlives the node -- RLLM_HOME
    # is node-local on the H200 hosts. Unset -> RLLM_HOME as before.
    episode_log_dir: ${oc.env:RLLM_ARTIFACT_DIR,${oc.env:RLLM_HOME,${oc.env:HOME}/.rllm}}/episodes/${rllm.trainer.project_name}/${rllm.trainer.experiment_name}/${oc.env:RLLM_RUN_ID}

trainer:
  # verl's default is `checkpoints/<project>/<experiment>` relative to the cwd
  # (the repo root: Hydra 1.3 does not chdir). Rooted at RLLM_ARTIFACT_DIR for
  # the same reason as the episodes, and stamped with the run id so a second
  # launch of the same experiment cannot overwrite the first one's
  # global_step_N / latest_checkpointed_iteration.txt. One FSDP checkpoint of
  # the 9B (bf16 weights + fp32 Adam moments and master copy) is ~110 GB;
  # max_actor_ckpt_to_keep (verl_trainer.yaml) bounds the total.
  default_local_dir: ${oc.env:RLLM_ARTIFACT_DIR,${oc.env:RLLM_HOME,checkpoints}}/checkpoints/${trainer.project_name}/${trainer.experiment_name}/${oc.env:RLLM_RUN_ID}
  # null = keep every checkpoint (verl passes it to save_checkpoint as
  # max_ckpt_to_keep; the base recipe's 5 would delete all but the last five).
  max_actor_ckpt_to_keep: null

actor_rollout_ref:
  actor:
    # FSDP1, not the fsdp2 the 4B recipe measured as faster (update_actor
    # 46.9 vs 62.8 s). Qwen3.5-9B has an *untied* lm_head, and verl #7520
    # (open) crashes FSDP2 + use_fused_kernels in the backward of any
    # non-final micro-batch of an optimizer step. With 128 trajectories per
    # step over 8 GPUs and one sequence per micro-batch, every optimizer step
    # here accumulates 16 micro-batches per GPU, so the crash path is always
    # taken; fused kernels cannot be turned off at a 248K vocabulary; FSDP1
    # has no such path. Re-measure fsdp2 once #7520 is closed.
    strategy: fsdp
    # rLLM multiplies this by rollout.n: 32 x 4 = 128 = train_batch_size x n,
    # i.e. exactly one optimizer update per step (strictly on-policy GRPO, the
    # SWE-Master setting). The base value 8 would make four updates per step.
    ppo_mini_batch_size: 32
  ref:
    strategy: fsdp
