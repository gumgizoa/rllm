# Generator config for speckit_bug: what the generator cannot read off the bug workflow's documents.
#
# The agent sees docs/ at /speckit -- core-workflow.md (the package author's hand-written definition of the
# workflow: stages, rounds, report rules) and stages/01-assess.md, 02-fix.md, 03-test.md (spec-kit's bug
# extension commands as build.py renders them) -- plus instruction.md and the system prompt. porting/ is the
# author's decision log, never shown to the agent and never a source. Every decision below cites the line it
# rests on; paths are relative to this package or to docs/.
workflow: speckit_bug
prefix: speckit_bug

ids:
  docs/core-workflow.md: CW
  docs/stages/01-assess.md: AS
  docs/stages/02-fix.md: FX
  docs/stages/03-test.md: TS
  instruction.md: INS
  system-prompt.j2: SP

roles:
  - docs/core-workflow.md: core
  - docs/stages/*.md: stage_rule

system_prompt:
  sections:
    PROBLEM_SOLVING_WORKFLOW: workflow
    "*": harness_generic

# core-workflow.md is the workflow's own definition (it has no upstream counterpart to adapt), and the stage
# documents are the workflow's text: like AI-DLC, no item is adapter-derived.
adapter_roles: [adapter]

precedence:
  - order: [stage_rule, core, "system_prompt:workflow", instruction, "system_prompt:harness_generic"]
    applies_to: all
    authority:
      path: docs/core-workflow.md
      lines: [15, 15]
      quote: "Read a stage's document as the first step of that stage, and carry out the stage from it."

classify:
  bug:
    # The skeletons' placeholders are <angle> spans (`<short title>`, `<ISO 8601 date>`), the sample paths
    # `path/to/...`, the bracketed [NEEDS CLARIFICATION: …] marks (AS:30 "mark unknowns as [NEEDS
    # CLARIFICATION]": the mark to write where an unknown remains), and the value choices the report picks one
    # of: `valid | likely valid, needs reproduction`, `1 | 2 | 3`, `pass / fail / skipped / not-run` (the stage
    # documents name each value: AS:37-40, TS:42-45, TS:38-39). [UNVERIFIED — not fetched] is literal output
    # (AS:19-20). The regexes are tried in order, the first span wins: an <angle> span that holds a bracket
    # (`<Mark unknowns as [NEEDS CLARIFICATION: …].>`, AS:75) is one placeholder.
    brackets: false
    placeholder:
      - '<!--.*?-->'
      - '`checks/<name>\.py`'
      - '`<command>` → <[^<>\n]*>'
      - '`<command>`'
      - '<[A-Za-z][^<>\n]*>'
      - '`path/to/[^`\n]*`'
      - '\[NEEDS CLARIFICATION[^\[\]\n]*\]'
      - '(?:(?<=\*\*: )|^(?![-*+]\s))[^\s|`<][^|\n]*(?: \| [^|\n]+)+$'
      - 'pass / fail(?: / skipped)?(?: / not-run)?'
    legit:
      - '\[UNVERIFIED — not fetched\]'
    # the field lines whose value is fixed (CW:50-51 keep the `- **Field**:` lines exactly): the slug, the source,
    # the report links; the two table headers
    literal:
      - '^\s*- \*\*(?:Slug|Source|Assessment)\*\*: \S'
      - '^\s*\| (?:File|Check) \|'
    # the Recommendation section lists three example phrasings (TS:85 "<One paragraph. Examples:>")
    exemplar:
      - '^\s*- "(?:Close|Hold|Reopen) —'
    markers:
      mandatory: []
      optional: ['\(optional\)']
      conditional: []
    none_tokens: [none, "n/a", "not applicable"]

templates:
  - id: assessment
    path: docs/stages/01-assess.md
    block: {fence: markdown, index: 0}
    artifact: assessment
    stage: assess
    rules: bug
    literals: patterns
    binding: &keep
      path: docs/core-workflow.md
      lines: [50, 51]
      quote: "**Keep each report's structure** exactly as its stage document gives it: the `#`/`##` headings and the `- **Field**:` lines."
    binding_requirement: must
    sections:
      # its labels open lists (AS:93-97) that an honest report may separate from the label by a blank line, which a
      # label's value never crosses: the section's items are manual (heading, labels, Preferred, the two lists)
      Proposed Remediation:
        requirement: skip
        authority: {path: docs/stages/01-assess.md, lines: [93, 97], quote: "**Files likely to change**: - `path/to/file.py` **Checks to run**: - <reproduction script under BUG_DIR/checks/, or an existing repository test to run>"}
      # its entries are [NEEDS CLARIFICATION: ...] marks (AS:30), which a field reading takes for a bracketed
      # placeholder: the section's items are manual (heading, not left empty)
      Open Questions:
        requirement: skip
        authority: {path: docs/stages/01-assess.md, lines: [30, 30], quote: "mark unknowns as `[NEEDS CLARIFICATION]` rather than guessing."}
  - id: fix
    path: docs/stages/02-fix.md
    block: {fence: markdown, index: 0}
    artifact: fix
    stage: fix
    rules: bug
    literals: patterns
    binding: *keep
    binding_requirement: must
    sections: &fix_sections
      # CW:50-51 binds the `#`/`##` headings and the `- **Field**:` lines; the Changes table's rows are the template's
      # example (should; its heading is a manual must item)
      Changes:
        requirement: should
        authority: {path: docs/core-workflow.md, lines: [50, 51], quote: "the `#`/`##` headings and the `- **Field**:` lines"}
      # "<Empty if none. ...>": the section may be left empty (its heading is a manual must item)
      Deviations from Assessment:
        requirement: skip
        authority: {path: docs/stages/02-fix.md, lines: [90, 90], quote: "<Empty if none. Otherwise, list any places where the actual fix departed from the proposed remediation and why.>"}
      # `- Commands run:` / `- Manual checks:` are not the bold `- **Field**:` lines CW:50-51 binds, and "Manual checks:
      # <what was verified by hand, if anything>" may have nothing to say: should (a recorded command is checked
      # against the trace by a manual must item)
      Local Verification:
        requirement: should
        authority: {path: docs/core-workflow.md, lines: [50, 51], quote: "the `#`/`##` headings and the `- **Field**:` lines"}
      # the Checks Added table (FX:74-76) and the baseline's plain `- Test files:` / `- `<command>` before the change:`
      # lines (FX:80-81) are neither `#`/`##` headings nor bold `- **Field**:` lines: should, as Changes / Local
      # Verification. Both headings are manual must items, and what the rows and the baseline claim (a check seen
      # failing before the change, the baseline run before it) is checked against the trace by manual must items.
      Checks Added:
        requirement: should
        authority: {path: docs/core-workflow.md, lines: [50, 51], quote: "the `#`/`##` headings and the `- **Field**:` lines"}
      "Baseline: Existing Tests":
        requirement: should
        authority: {path: docs/core-workflow.md, lines: [50, 51], quote: "the `#`/`##` headings and the `- **Field**:` lines"}
  - id: test
    path: docs/stages/03-test.md
    block: {fence: markdown, index: 0}
    artifact: test
    stage: test
    rules: bug
    literals: patterns
    binding: *keep
    binding_requirement: must
    sections: &test_sections
      # the table's rows are the template's example checks (TS:34 lint "if the project uses them"); its heading is a
      # manual must item
      Checks Performed:
        requirement: should
        authority: {path: docs/core-workflow.md, lines: [50, 51], quote: "the `#`/`##` headings and the `- **Field**:` lines"}
  - id: fix_2
    path: docs/stages/02-fix.md
    block: {fence: markdown, index: 0}
    artifact: fix_2
    stage: fix_2
    rules: bug
    literals: patterns
    binding: *keep
    binding_requirement: must
    sections: *fix_sections
  - id: test_2
    path: docs/stages/03-test.md
    block: {fence: markdown, index: 0}
    artifact: test_2
    stage: test_2
    rules: bug
    literals: patterns
    binding: *keep
    binding_requirement: must
    sections: *test_sections
  - id: fix_3
    path: docs/stages/02-fix.md
    block: {fence: markdown, index: 0}
    artifact: fix_3
    stage: fix_3
    rules: bug
    literals: patterns
    binding: *keep
    binding_requirement: must
    sections: *fix_sections
  - id: test_3
    path: docs/stages/03-test.md
    block: {fence: markdown, index: 0}
    artifact: test_3
    stage: test_3
    rules: bug
    literals: patterns
    binding: *keep
    binding_requirement: must
    sections: *test_sections

stage_model:
  fixed:
    roots:
      artifact: /tmp/speckit/bugs/issue
      code: "{WORKDIR}"
    # CW:17-28: assess once, then fix / test rounds, at most three; a round after the first runs only when the
    # previous verification report's Result is partial or failed (CW:26-27). The later rounds' reports are
    # optional artifacts: their template items apply when they exist, their existence is required by the
    # manual items conditional on the previous Result.
    stages:
      - id: assess
        doc: docs/stages/01-assess.md
        artifacts: [assessment]
        order_artifact: assessment
      - id: fix
        doc: docs/stages/02-fix.md
        artifacts: [fix]
        order_artifact: fix
        requires: [assessment]
      - id: test
        doc: docs/stages/03-test.md
        artifacts: [test]
        order_artifact: test
        requires: [assessment, fix]
      - id: fix_2
        doc: docs/stages/02-fix.md
        artifacts: [fix_2]
        order_artifact: fix_2
        requires: [assessment, fix, test]
      - id: test_2
        doc: docs/stages/03-test.md
        artifacts: [test_2]
        order_artifact: test_2
        requires: [assessment, fix_2]
      - id: fix_3
        doc: docs/stages/02-fix.md
        artifacts: [fix_3]
        order_artifact: fix_3
        requires: [assessment, fix_2, test_2]
      - id: test_3
        doc: docs/stages/03-test.md
        artifacts: [test_3]
        order_artifact: test_3
        requires: [assessment, fix_3]
    artifacts:
      assessment:
        locations: ["{artifact}/assessment.md"]
        template: docs/stages/01-assess.md
        source:
          - {path: docs/core-workflow.md, lines: [11, 11], quote: "| 1. Assess | `/speckit/stages/01-assess.md` | `assessment.md` |"}
          - {path: docs/stages/01-assess.md, lines: [50, 50], quote: "Write to `BUG_DIR/assessment.md` using this structure:"}
          - {path: docs/stages/01-assess.md, lines: [3, 3], quote: "The output is a single assessment file at `/tmp/speckit/bugs/issue/assessment.md` that the later stages"}
      fix:
        locations: ["{artifact}/fix.md"]
        template: docs/stages/02-fix.md
        source:
          - {path: docs/core-workflow.md, lines: [21, 21], quote: "Round 1: `fix.md`, then `test.md`."}
          - {path: docs/stages/02-fix.md, lines: [46, 46], quote: "Write to `BUG_DIR/` + `FIX_REPORT` (round 1: `fix.md`) using this structure:"}
      test:
        locations: ["{artifact}/test.md"]
        template: docs/stages/03-test.md
        source:
          - {path: docs/core-workflow.md, lines: [21, 21], quote: "Round 1: `fix.md`, then `test.md`."}
          - {path: docs/stages/03-test.md, lines: [50, 50], quote: "Write to `BUG_DIR/` + `TEST_REPORT` (round 1: `test.md`) using this structure:"}
      fix_2:
        locations: ["{artifact}/fix-2.md"]
        template: docs/stages/02-fix.md
        optional: true
      test_2:
        locations: ["{artifact}/test-2.md"]
        template: docs/stages/03-test.md
        optional: true
      fix_3:
        locations: ["{artifact}/fix-3.md"]
        template: docs/stages/02-fix.md
        optional: true
      test_3:
        locations: ["{artifact}/test-3.md"]
        template: docs/stages/03-test.md
        optional: true

# Stage windows by report writes (a stage runs from the previous report's write to its own): the fix and test
# documents govern three rounds each, so a window by the first read of the document would put every round in
# round 1. The reads are still judged per stage, in each window (CW:15).
scoring:
  item_weight: {must: 1.0, should: 0.25}
  stage: {formula: sigma_kappa}
  substantive_threshold: 0.5
  windows: writes
  signals: [order, process, "stage:*"]
  # the global items are prohibitions and write rules a run doing nothing satisfies: scaled by the mean stage
  # score they govern the work instead of crediting inaction (as aidlc_v4_gen; G9 frontmatter_stub)
  process_scale: stage_mean
  compliance: mean
  selftest:
    template_copy_stage_max: 0.10
    frontmatter_stub_compliance_max: 0.05
    x_fill_no_real_test_compliance_max: 0.50
    honest_golden_min: 0.95
    # A record the bug workflow never asks for: a failing run followed by a clean re-run of the same tests. The test
    # stage records the checks it ran and their result (TS:37), not every attempt; AI-DLC's "never left as none to look
    # clean" (BT:98) has no counterpart here.
    hidden_failure_min_drop: 0.0

gates:
  "speckit_bug.*.artifact_exists": {zero_stage: true}
  # an artifact still holding its template's placeholders (or values that are only fill-in marks) is the template,
  # not the stage's result (CW:50-51 keep the structure, the <...> spans are what the report fills); DESIGN §9
  # template_copy_stage_max 0.10
  "speckit_bug.*.no_template_residue": {cap_stage: 0.1}
  "speckit_bug.*.no_template_residue.fill_marks": {cap_stage: 0.1}

llm:
  backend: claude-cli
  model: claude-opus-5-5
  samples: 2
  batch: 16
  chunk_lines: 80
  max_rounds: 2
  max_budget_usd: 3.0
  max_total_usd: 11.0  # the run's cap (20 USD) less what the calls in flight (parallel x max per call) can add
  parallel: 3
  timeout: 900



# Extracted (G5) items dropped on review. Each names the G4 statement it came from (gen-work/statements.jsonl).
exclude:
  # -- the same requirement as a reviewed (manual) or stage-model item, in another kind or with other parameters
  - {statement: "*", kind: artifact_exists, reason: "every report's existence is the stage model's item (zero_stage gate) or, for the later rounds, a manual item conditional on the previous Result; a second copy double-counts it, and an extracted 'fix-2.md exists when test-2.md does' is implied by the round's own gate"}
  - {statement: as-026, kind: prohibited_action, reason: "duplicates the manual assess repo_write prohibition (AS:116, CW:54), which covers new files too"}
  - {statement: as-036, kind: prohibited_action, reason: "duplicates the manual assess repo_write prohibition (AS:116)"}
  - {statement: as-037, kind: prohibited_action, reason: "duplicates the manual assess repo_write prohibition (AS:116-117)"}
  - {statement: as-007, kind: speckit_bug.no_fetch, reason: "duplicates the global no_fetch item (CW:33-34, AS:18), which covers every stage"}
  - {statement: "cw-02[56]", kind: speckit_bug.no_fetch, reason: "duplicates the manual global no_fetch item"}
  - {statement: as-011, kind: speckit_bug.links, reason: "duplicates the manual links item (AS:19-20)"}
  - {statement: fx-011, kind: write_discipline, reason: "an earlier round's report not rewritten in the next round (FX:19, FX:107): the report's own write_discipline once fails any rewrite; scored in a later round's stage it would also make that stage a signal of a run that never reached it"}
  - {statement: fx-052, kind: write_discipline, reason: "an earlier round's report not rewritten in the next round (FX:19, FX:107): the report's own write_discipline once fails any rewrite; scored in a later round's stage it would also make that stage a signal of a run that never reached it"}
  - {statement: ts-008, kind: write_discipline, reason: "an earlier round's verification report not rewritten (TS:20): the report's own write_discipline once fails any rewrite"}
  - {statement: fx-049, kind: write_discipline, reason: "'Never edit assessment.md' (FX:105) is the assessment's write_discipline once (AS:14, AS:118), which fails any later edit"}
  - {statement: cw-034, kind: write_discipline, reason: "'never rewrite an earlier report' (CW:47-48) is each report's write_discipline once (one write over the report's life)"}
  - {statement: "fx-01[25]", kind: speckit_bug.read, reason: "duplicates the manual per-round report reads (FX:20-21), which are conditional on the round; these also applied to rounds that never ran"}
  - {statement: cw-022, kind: speckit_bug.read, reason: "duplicates the manual round-2/3 reads of the previous verification report (FX:21), which are conditional on the round"}
  - {statement: ts-032, kind: speckit_bug.read, reason: "duplicates the manual round-2/3 reads of the previous verification report (FX:21)"}
  - {statement: fx-046, kind: doc_read, reason: "duplicates the manual doc_read of 03-test.md (FX:99-100), judged in each round's test window"}
  - {statement: "ts-01[159]", kind: speckit_bug.checks_table, reason: "duplicates the manual Checks Performed items (TS:30-39), whose claim windows run from the round's last repository edit to the report"}
  - {statement: ts-021, kind: speckit_bug.checks_table, reason: "duplicates the manual test_run item (TS:38, TS:72)"}
  - {statement: ts-010, kind: speckit_bug.checks_table, reason: "duplicates the manual unrun items (TS:44, TS:106), one per round with the round's conditions"}
  - {statement: ts-022, kind: speckit_bug.checks_table, reason: "duplicates the manual unrun items (TS:44, TS:106), one per round with the round's conditions"}
  - {statement: ts-038, kind: speckit_bug.checks_table, reason: "duplicates the manual unrun items (TS:44, TS:106), one per round with the round's conditions"}
  - {statement: ts-011, kind: speckit_bug.check_scripts, reason: "duplicates the manual run items (TS:30), whose checks are the ones written up to the round's fix report"}
  - {statement: fx-021, kind: speckit_bug.check_scripts, reason: "duplicates the manual round-1 written item (FX:31)"}
  - {statement: "fx-02[568]", kind: speckit_bug.checks_added, reason: "duplicates the manual before_run / baseline_run items (FX:32-34, FX:74-81), one per round (optional in rounds 2 and 3)"}
  - {statement: fx-028, kind: speckit_bug.check_scripts, reason: "duplicates the manual before_change / unchanged items (FX:32-36), whose windows reach the round's first repository edit and its verification report"}
  - {statement: fx-032, kind: speckit_bug.check_scripts, reason: "duplicates the manual before_change / unchanged items (FX:32-36), whose windows reach the round's first repository edit and its verification report"}
  - {statement: cw-020, kind: field_enum, reason: "Result is a header field under the title, not in Summary: the item reads a section that never holds it; the manual Result enum (TS:60) reads the header"}
  - {statement: cw-019, kind: speckit_bug.holds, reason: "duplicates the manual no_round_after_verified item (CW:25); its condition reads Result from Summary, where it never is"}
  - {statement: cw-021, kind: speckit_bug.holds, reason: "duplicates the manual round-2/3 existence gates (CW:26-27); its condition reads Result from Summary, where it never is"}
  - {statement: cw-027, kind: speckit_bug.holds, reason: "all three round-1 reports exist: the stage model's existence gates"}
  - {statement: cw-032, kind: speckit_bug.created_files, reason: "without a pattern it fails any new file in the repository, a new source module of the fix included; the manual scratch / test-file items carry CW:45-46"}
  - {statement: cw-032, kind: cross_ref, reason: "'no untracked path' fails any new file in the repository, a new source module of the fix included; the manual scratch / test-file items carry CW:45-46"}
  # -- misreadings
  - {statement: fx-036, kind: prohibited_action, reason: "'do not introduce dependencies that the assessment did not call for' (FX:37) is about the change (a new import or requirement), not installing a package into the environment to run the tests"}
  - {statement: as-039, kind: cross_ref, reason: "the template's own entry format is `path/to/file.py:42` (AS:79): a path with its line suffix is never a base path, so the honest run fails it"}

# Contradictions and gaps the documents leave, and how the rubric reads them (P3: both readings where expressible;
# a value set the template fixes is not relaxed; the workflow over the system prompt's generic sections, CW:4 /
# SP:61-63).
conflicts:
  - description: "Rounds: the stage documents describe one fix and one test stage, core-workflow repeats them up to three times, the later rounds only when the previous verification report's Result is partial or failed (CW:20-28)"
    sources:
      - {path: docs/core-workflow.md, lines: [20, 23], quote: "2. **Fix** and **test** then alternate in rounds, at most three: - Round 1: `fix.md`, then `test.md`. - Round 2: `fix-2.md`, then `test-2.md`. - Round 3: `fix-3.md`, then `test-3.md`."}
      - {path: docs/core-workflow.md, lines: [24, 28], quote: "After each verification report, its **Result** decides:"}
    resolution: "seven stages (assess, fix, test, fix_2, test_2, fix_3, test_3); the round-2/3 reports are optional artifacts whose template items apply when they exist; their existence (zero_stage) and the round's run items apply when the previous Result is partial or failed (or the round was run); a stage with no applicable item is no signal, so a round-1 verified run is scored on assess, fix, test, order and process; a next round after a verified Result fails a global item"
  - description: "The stage table says when to read each document (CW:9 'Read when the stage begins', CW:15) but no line forbids reading a later stage's document early"
    sources:
      - {path: docs/core-workflow.md, lines: [9, 9], quote: "| Stage | Read when the stage begins | Writes |"}
      - {path: docs/core-workflow.md, lines: [15, 15], quote: "Read a stage's document as the first step of that stage, and carry out the stage from it."}
    resolution: "each stage's read is judged in its own window (a read at the start does not count for a later stage); the round-1 order item also voids a document first seen before the previous report (read ahead, e.g. all three at once) -- a reading of 'when the stage begins' as 'not before'"
  - description: "CW:50-51 binds the `#`/`##` headings and the `- **Field**:` lines; the tables, the plain `- Commands run:` / `- Manual checks:` lines and the example rows are the template's but not named"
    sources:
      - {path: docs/core-workflow.md, lines: [50, 51], quote: "**Keep each report's structure** exactly as its stage document gives it: the `#`/`##` headings and the `- **Field**:` lines."}
      - {path: docs/stages/03-test.md, lines: [34, 34], quote: "- Lint / type-check if the project uses them."}
    resolution: "headings and bold field lines must; the Changes / Checks Added / Checks Performed table rows and the Local Verification / Baseline lines should; what a recorded command or a table row claims is checked against the trace (must) whenever it is written"
  - description: "FX:32 'It must fail' and TS:43 'passes now after failing before the change': the trace shows that a check ran and what it printed, not whether it failed (the openhands-sdk observations carry no exit-code line, and a check may print the error and exit 0); TS:43 'every example from the issue behaves as the issue expects' and FX:31 'verbatim' need the issue text, which the engine does not have"
    sources:
      - {path: docs/stages/02-fix.md, lines: [32, 32], quote: "Run each check now. It must fail: a check that already passes does not detect the bug, so rewrite it until it fails for the reported reason."}
      - {path: docs/stages/03-test.md, lines: [43, 43], quote: "every check in the fix report passes now after failing before the change; every example from the issue behaves as the issue expects"}
    resolution: "the rubric judges the steps and the record: each check run on the code before the round's first repository edit, the checks left as they were after it, the baseline tests run before it, the fix report's Before column recording fail for a check the trace ran before the edit, its baseline command a valid test run before the edit. Whether a check really fails before and passes after the change is not scored (it needs the checks re-run on the base commit and the patch in the sandbox). The verdict is judged one way only: a verified Result its own Checks Performed table contradicts (a failed row; a skipped / not-run reproduction or fix-check row, TS:44, TS:106) fails; no item rewards or penalizes partial or failed"
  - description: "Deviations from Assessment may be left empty (FX:90 'Empty if none'), while every other section of the skeleton holds a placeholder to fill"
    sources:
      - {path: docs/stages/02-fix.md, lines: [90, 90], quote: "<Empty if none. Otherwise, list any places where the actual fix departed from the proposed remediation and why.>"}
    resolution: "the heading is required, its body is not"
  - description: "[NEEDS CLARIFICATION: ...] is both the skeleton's placeholder in Open Questions (AS:106) and the mark the report writes for an unknown (AS:30)"
    sources:
      - {path: docs/stages/01-assess.md, lines: [30, 30], quote: "mark unknowns as `[NEEDS CLARIFICATION]` rather than guessing."}
      - {path: docs/stages/01-assess.md, lines: [106, 106], quote: "- [NEEDS CLARIFICATION: …]"}
    resolution: "a mark with a question is content (Open Questions not empty); only the template's literal '[NEEDS CLARIFICATION: …]' is residue"
  - description: "The issue's links are recorded verbatim under Report and marked (AS:19-20); the Report also quotes the issue text, which names them unmarked"
    sources:
      - {path: docs/stages/01-assess.md, lines: [19, 20], quote: "Record each link verbatim in `assessment.md` under **Report**, marked `[UNVERIFIED — not fetched]`."}
      - {path: docs/stages/01-assess.md, lines: [63, 63], quote: "<Quoted/condensed issue text. List its links verbatim, each marked [UNVERIFIED — not fetched].>"}
    resolution: "every link the section names (outside code; local addresses aside) appears on some marked line; the quoted text may repeat it unmarked"
  - description: "The generic system prompt asks to keep AGENTS.md in the repository (SP:11) and to delete a temporary test file once done (SP:28); the workflow forbids writing reports, checks or scratch files into the repository at all (CW:45-46)"
    sources:
      - {path: system-prompt.j2, lines: [11, 11], quote: "* Use `AGENTS.md` under the repository root as your persistent memory for repository-specific knowledge and context."}
      - {path: system-prompt.j2, lines: [28, 28], quote: "- If you need to create a temporary file for testing, delete it once you've confirmed your solution works"}
      - {path: docs/core-workflow.md, lines: [45, 46], quote: "Never write reports, checks, or scratch files into the repository."}
    resolution: "the workflow wins (SP:63 'where the two disagree, the workflow wins'): a scratch / reproduction / test file created in the repository fails its item even when removed again; AGENTS.md is not itemized"
  - description: "The generic system prompt asks to ask the user for clarification (SP:48); the workflow forbids stopping to ask (CW:38-40)"
    sources:
      - {path: system-prompt.j2, lines: [48, 48], quote: "ask the user for clarification."}
      - {path: docs/core-workflow.md, lines: [38, 40], quote: "Never stop to ask or to report: when something is unclear, take the most plausible reading, record it in the current report, and continue."}
    resolution: "the workflow wins: no item rewards asking; a run that stops before a stage's report fails that stage's existence gate"
  - description: "The test stage reads the fix report it just followed (TS:21) and the fix stage the assessment it just wrote (FX:20): both reports are in the agent's own context"
    sources:
      - {path: docs/stages/02-fix.md, lines: [20, 20], quote: "- Read `BUG_DIR/assessment.md` in full."}
      - {path: docs/stages/03-test.md, lines: [21, 21], quote: "- Read both `assessment.md` and this round's fix report in full so you know:"}
    resolution: "the reads are required as written (must, in the stage's window); a check of the file right after writing it, inside the next stage's window, counts"

# Items the templates do not yield (or yield too weakly): the header fields under each report's title (a title that
# names the run's own subject, so no section addresses them), the round fields, and every rule about the run --
# reads, writes, the repository, the test evidence. Each replaces compiled items on the same subject.
manual:
  # ============================================================== global
  - id: speckit_bug.global.run.doc_read_first.cw
    stage: global
    class: evidence
    requirement: must
    check: {kind: doc_read_first, params: {doc: CW}}
    availability: [trace]
    modality_evidence: "imperative (INS:3 'Begin by opening'; SP:65 'Before acting on the task')"
    sources:
      - {path: instruction.md, lines: [3, 3], quote: "Begin by opening /speckit/core-workflow.md"}
      - {path: system-prompt.j2, lines: [65, 65], quote: "* Before acting on the task, open /speckit/core-workflow.md."}
  - id: speckit_bug.global.run.order.round_1
    stage: global
    class: evidence
    requirement: must
    check: {kind: order, params: {chain: ["read:AS", "write:assessment", "read:FX", "write:fix", "read:TS", "write:test"], invalidate: [read_ahead, multi_read, rewrite]}}
    availability: [trace]
    modality_evidence: "CW:9 'Read when the stage begins'; CW:15; CW:19-21 the order; CW:47 one write per report"
    sources:
      - {path: docs/core-workflow.md, lines: [9, 9], quote: "| Stage | Read when the stage begins | Writes |"}
      - {path: docs/core-workflow.md, lines: [15, 15], quote: "Read a stage's document as the first step of that stage, and carry out the stage from it."}
      - {path: docs/core-workflow.md, lines: [19, 21], quote: "1. **Assess** once. 2. **Fix** and **test** then alternate in rounds, at most three: - Round 1: `fix.md`, then `test.md`."}
      - {path: docs/core-workflow.md, lines: [47, 47], quote: "- **One write per report**, complete, at the end of its stage. Never rewrite an earlier report:"}
    note: "each stage document read when its stage begins (after the previous report), then its report written once, assess -> fix -> test; a document first seen before the previous report (read ahead, e.g. all three in one command at the start), a multi-document read and a rewritten report void their pair"
  - id: speckit_bug.global.run.order.round_2
    stage: global
    class: evidence
    requirement: must
    check: {kind: order, params: {chain: ["write:test", "write:fix_2", "write:test_2"], invalidate: [rewrite]}}
    applies_when: {any: [{field_matches: {artifact: test, section: '*', label: Result, pattern: '^\W*(?:partial|failed)\b'}}, {artifact_exists: fix_2}]}
    availability: [trace]
    modality_evidence: "CW:26-27 'start the next round with the fix stage'; CW:22 the round's order"
    sources:
      - {path: docs/core-workflow.md, lines: [22, 22], quote: "Round 2: `fix-2.md`, then `test-2.md`."}
      - {path: docs/core-workflow.md, lines: [26, 27], quote: "`partial` or `failed`, in round 1 or 2 — start the next round with the fix stage, using that report as new evidence."}
    note: "round 2 (when the previous verification report's Result is partial or failed, or round 2 was run): the previous report, then fix-2.md, then test-2.md, each written once"
  - id: speckit_bug.global.run.order.round_3
    stage: global
    class: evidence
    requirement: must
    check: {kind: order, params: {chain: ["write:test_2", "write:fix_3", "write:test_3"], invalidate: [rewrite]}}
    applies_when: {any: [{field_matches: {artifact: test_2, section: '*', label: Result, pattern: '^\W*(?:partial|failed)\b'}}, {artifact_exists: fix_3}]}
    availability: [trace]
    modality_evidence: "CW:26-27 'start the next round with the fix stage'; CW:23 the round's order"
    sources:
      - {path: docs/core-workflow.md, lines: [23, 23], quote: "Round 3: `fix-3.md`, then `test-3.md`."}
      - {path: docs/core-workflow.md, lines: [26, 27], quote: "`partial` or `failed`, in round 1 or 2 — start the next round with the fix stage, using that report as new evidence."}
    note: "round 3 (when the previous verification report's Result is partial or failed, or round 3 was run): the previous report, then fix-3.md, then test-3.md, each written once"
  - id: speckit_bug.global.run.speckit_bug_holds.no_round_after_verified
    stage: global
    class: evidence
    requirement: must
    check: {kind: speckit_bug.holds, params: {predicate: {not: {any: [{all: [{field_matches: {artifact: test, section: '*', label: Result, pattern: '^\W*verified\b'}}, {artifact_exists: fix_2}]}, {all: [{field_matches: {artifact: test_2, section: '*', label: Result, pattern: '^\W*verified\b'}}, {artifact_exists: fix_3}]}]}}}}
    availability: [sandbox_file]
    modality_evidence: "imperative (CW:25 'the workflow is complete. Finish the task.')"
    sources:
      - {path: docs/core-workflow.md, lines: [25, 25], quote: "`verified` — the workflow is complete. Finish the task."}
      - {path: docs/stages/03-test.md, lines: [96, 96], quote: "- `verified` — the workflow is complete; finish the task."}
    note: "no next round's fix report after a verification report whose Result is verified"
  - id: speckit_bug.global.run.speckit_bug_no_fetch.issue_links
    stage: global
    class: evidence
    requirement: must
    check: {kind: speckit_bug.no_fetch, params: {}}
    availability: [trace]
    modality_evidence: "prohibition (CW:33 'Do not fetch'; AS:18 'Do not fetch')"
    sources:
      - {path: docs/core-workflow.md, lines: [33, 34], quote: "Do not fetch links in it and do not look it up online."}
      - {path: docs/stages/01-assess.md, lines: [18, 18], quote: "Do not fetch URLs found in the issue, and do not look the issue up online."}
    note: "no command fetching a URL: curl / wget / a text browser on a URL, a Python urlopen / requests / httpx call on a URL literal, a git clone of a URL"
  - id: speckit_bug.global.run.prohibited_action.test_file_write
    stage: global
    class: evidence
    requirement: must
    check: {kind: prohibited_action, params: {action: test_file_write}}
    availability: [trace]
    modality_evidence: "prohibition (CW:53 'Do not add or edit test files')"
    sources:
      - {path: docs/core-workflow.md, lines: [53, 53], quote: "Do not add or edit test files in the repository."}
      - {path: docs/stages/02-fix.md, lines: [36, 36], quote: "Do not add or edit test files in the repository."}
    note: "no edit of a test file that existed at BASE_SHA"
  - id: speckit_bug.global.run.speckit_bug_created_files.tests
    stage: global
    class: evidence
    requirement: must
    check: {kind: speckit_bug.created_files, params: {test_paths: true}}
    availability: [trace]
    modality_evidence: "prohibition (CW:53 'Do not add')"
    sources:
      - {path: docs/core-workflow.md, lines: [53, 53], quote: "Do not add or edit test files in the repository."}
      - {path: docs/stages/01-assess.md, lines: [45, 45], quote: "Do not plan to add or edit test files in the repository: the task's tests are already in place."}
    note: "no test file created in the repository (a test_*.py / tests/ path absent at BASE_SHA), kept or removed again: checks go in BUG_DIR/checks/"
  - id: speckit_bug.global.run.speckit_bug_created_files.scratch
    stage: global
    class: evidence
    requirement: must
    check: {kind: speckit_bug.created_files, params: {pattern: '(?i)(?:^|/)(?:repro|reproduce|reproduction|debug|scratch|tmp|temp)[^/]*\.(?:py|sh|txt|md|log)$|(?:^|/)(?:assessment|fix(?:-[23])?|test(?:-[23])?)\.md$|(?:^|/)[^/]*(?:SUMMARY|NOTES)[^/]*\.(?:md|txt)$'}}
    availability: [trace]
    modality_evidence: "prohibition (CW:45-46 'Never write reports, checks, or scratch files into the repository')"
    sources:
      - {path: docs/core-workflow.md, lines: [45, 46], quote: "Never write reports, checks, or scratch files into the repository."}
      - {path: docs/core-workflow.md, lines: [52, 52], quote: "- **Checks you write** (reproduction scripts and the like) go in `/tmp/speckit/bugs/issue/checks/`."}
    note: "no report, reproduction / debug / scratch script or summary note created in the repository (a file absent at BASE_SHA named like one), kept or removed again"
