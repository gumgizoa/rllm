- type: documented
  description: CW:50-51 binds the `#`/`##` headings and the `- **Field**:` lines; the tables, the plain `- Commands run:`
    / `- Manual checks:` lines and the example rows are the template's but not named
  resolution: headings and bold field lines must; the Changes / Checks Added / Checks Performed table rows and the Local Verification
    / Baseline lines should; what a recorded command or a table row claims is checked against the trace (must) whenever it
    is written
  items: []
  sources:
  - path: docs/core-workflow.md
    lines:
