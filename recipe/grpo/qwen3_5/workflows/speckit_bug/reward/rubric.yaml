    quote: '- Lint / type-check if the project uses them.'
- type: documented
  description: 'FX:32 ''It must fail'' and TS:43 ''passes now after failing before the change'': the trace shows that a check
    ran and what it printed, not whether it failed (the openhands-sdk observations carry no exit-code line, and a check may
    print the error and exit 0); TS:43 ''every example from the issue behaves as the issue expects'' and FX:31 ''verbatim''
    need the issue text, which the engine does not have'
  resolution: 'the rubric judges the steps and the record: each check run on the code before the round''s first repository
    edit, the checks left as they were after it, the baseline tests run before it, the fix report''s Before column recording
    fail for a check the trace ran before the edit, its baseline command a valid test run before the edit. Whether a check
    really fails before and passes after the change is not scored (it needs the checks re-run on the base commit and the patch
    in the sandbox). The verdict is judged one way only: a verified Result its own Checks Performed table contradicts (a failed
    row; a skipped / not-run reproduction or fix-check row, TS:44, TS:106) fails; no item rewards or penalizes partial or
    failed'
  items: []
  sources:
