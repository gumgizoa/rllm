conflicts:
- type: documented
  description: 'Rounds: the stage documents describe one fix and one test stage, core-workflow repeats them up to three times,
    the later rounds only when the previous verification report''s Result is partial or failed (CW:20-28)'
  resolution: seven stages (assess, fix, test, fix_2, test_2, fix_3, test_3); the round-2/3 reports are optional artifacts
    whose template items apply when they exist; their existence (zero_stage) and the round's run items apply when the previous
    Result is partial or failed (or the round was run); a stage with no applicable item is no signal, so a round-1 verified
    run is scored on assess, fix, test, order and process; a next round after a verified Result fails a global item
  items: []
  sources:
  - path: docs/core-workflow.md
    lines:
    - 20
    - 23
    quote: '2. **Fix** and **test** then alternate in rounds, at most three: - Round 1: `fix.md`, then `test.md`. - Round
      2: `fix-2.md`, then `test-2.md`. - Round 3: `fix-3.md`, then `test-3.md`.'
  - path: docs/core-workflow.md
    lines:
    - 24
    - 28
    quote: 'After each verification report, its **Result** decides:'
- type: documented
  description: The stage table says when to read each document (CW:9 'Read when the stage begins', CW:15) but no line forbids
    reading a later stage's document early
  resolution: each stage's read is judged in its own window (a read at the start does not count for a later stage); the round-1
    order item also voids a document first seen before the previous report (read ahead, e.g. all three at once) -- a reading
    of 'when the stage begins' as 'not before'
  items: []
  sources:
  - path: docs/core-workflow.md
    lines:
