# Constraints of openspec_ff: one per rubric item (same id), with the template that judges it.
# Maintained by hand; the rubric implements them, workflow_rubric checks the two stay in step
# (sdlc_if/constraints.py, which also documents the fields).
schema: sdlc_if.constraints/1
workflow: openspec_ff
role: train
templates: ../../sdlc_if/templates.yaml
rubric: reward/rubric.yaml
constraints:
- id: openspec_ff.explore.proposal.field_filled.why
  template: T-FM2
  status: implemented
  requirement: must
  rule: ff writes the proposal's Why from explore's summary (CW:63-65; EX:209)
  source:
    doc: CW
    lines: [63, 65]
    quote: 'ff then writes the proposal and the design from that summary: the proposal''s Why and the design''s Context and
      **Decisions** (choice, rationale, alternatives) rest on it, and its assumptions go into the proposal.'
  fidelity: narrower
  fidelity_note: checks only that the proposal's Why section is filled at the end (the same check as openspec_ff.ff.proposal.field_filled.why);
    that the Why rests on the explore summary is unchecked
- id: openspec_ff.explore.run.doc_read.ex
  template: T-RD2
  status: implemented
  requirement: must
  rule: open 00-explore.md first for the explore action (CW:20; SP:69-70)
  source:
    doc: CW
    lines: [20, 20]
    quote: '| explore | `/opsx/stages/00-explore.md` | `openspec list --json` |'
  fidelity: broader
  fidelity_note: single_doc voids a read of this document made in the same step as another stage document; the docs have no
    explicit one-at-a-time rule (CW:18 'Open this first', SP:69-70 'On entering one'). Mild; consistent with the documented
    'not before' reading (rubric conflict on read-ahead). Carries a T-RD3 element
- id: openspec_ff.explore.run.doc_read.config
  template: T-RD5
  status: implemented
  requirement: should
  rule: read the project's /openspec/config.yaml (context, rules) while exploring (EX:131-133)
  source:
    doc: EX
    lines: [131, 133]
    quote: 'Then read the project''s own context from the resolved root - `<root.path>/openspec/config.yaml` (or `config.yml`).
      Use the `root.path` returned above, and skip this if neither file exists: - `context`: project background - tech stack,
      conventions, constraints'
  fidelity: faithful
- id: openspec_ff.explore.run.prohibited_action.composed_code
  template: T-PR6
  status: implemented
  requirement: should
  rule: 'explore composes no code of its own: no `python -c`, no heredoc or snippet piped to python (CW:75-77; EX:5; EX:215)'
  source:
    doc: CW
    lines: [75, 77]
    quote: 'Explore reads it too, but runs only what is already there: existing code, existing tests, and the issue''s own
      example exactly as given. It composes no code of its own: not a one-line `python -c`, not a heredoc piped to `python3`,
      not a script in `/tmp`.'
  fidelity: narrower
  fidelity_note: python only (node -e, perl -e, bash -c with composed code not caught); a script in /tmp is left to the no-file
    item; conversely the issue's own example run as `python -c` fails (documented)
- id: openspec_ff.explore.run.openspec_ff_cli.no_new_change
  template: T-AW5
  status: implemented
  requirement: must
  rule: 'explore does not create the change: `openspec new change` is ff''s first command (EX:219; EX:5; CW:21)'
  source:
    doc: EX
    lines: [219, 219]
    quote: nothing is captured during explore, and `openspec new change` is ff's first command.
  fidelity: faithful
- id: openspec_ff.explore.run.openspec_ff_paths_written.any
