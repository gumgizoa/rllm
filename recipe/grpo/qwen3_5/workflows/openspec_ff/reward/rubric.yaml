conflicts:
- type: documented
  description: 'Verify once: the report keeps upstream''s CRITICAL label ''Must fix before archive'' and the assessment ''Fix before archiving'' (VF:163, VF:181); core-workflow.md says verify runs once and the run moves on to archive whatever it finds (CW:86-87), and 03-verify.md''s next step is the archive (VF:188)'
  resolution: 'procedure precedence (core first): a CRITICAL issue is recorded in verify.md, not fixed; no item asks for a fix or a second report after a CRITICAL count, and the prescribed ''N critical issue(s) found. Fix before archiving.'' passes the Final Assessment item; going back to apply after verify.md (a repository edit or a task-list write once verify.md is written) fails the archive stage''s no-return items (CW:74, CW:86-87, CW:105-106)'
  items: []
  sources:
  - path: docs/core-workflow.md
    lines:
    - 86
    - 87
    quote: Verify runs once and writes `/openspec/changes/issue/verify.md`. Whatever it finds, move on to archive; the report records what is still open.
  - path: docs/stages/03-verify.md
    lines:
    - 181
    - 181
    quote: '- If CRITICAL issues: "X critical issue(s) found. Fix before archiving."'
  - path: docs/stages/03-verify.md
    lines:
    - 188
    - 188
    quote: '**Next step**: go to the archive step in `/opsx/core-workflow.md`. What is left stays recorded in this report.'
- type: documented
  description: 'Every stage document opens with the upstream Project check (''confirm the project has a root: run `openspec list --json`''); core-workflow.md says the planning root is already set up'
  resolution: 'one global should item: `openspec list --json` before the first write (`openspec new change`); the check''s answer is fixed in this sandbox, so it is not must. The no-root branches (EX:11-18: stop and show the error, stop using OpenSpec, ask how to proceed) cannot arise here and have no item. Explore''s start from the same call (CW:20) is a separate must item of the explore stage'
  items: []
  sources:
  - path: docs/stages/01-ff.md
    lines:
    - 3
    - 3
    quote: 'confirm the project has a root: run `openspec list --json`'
  - path: docs/stages/00-explore.md
    lines:
    - 9
    - 9
    quote: 'confirm the project has a root: run `openspec list --json`'
  - path: docs/core-workflow.md
    lines:
    - 33
    - 33
    quote: '- Planning root: `/openspec`, already set up with `openspec init`'
- type: documented
  description: The proposal instruction says to research existing specs with `openspec list --specs` / `openspec show` (SCHEMA:21-33); core-workflow.md and the project context say specs/ starts empty
  resolution: 'no item for the research calls (the proposal''s, and explore''s `openspec list --specs` / `openspec show`, EX:123-129): their answer is fixed (no capability), the proposal''s Modified Capabilities item carries the consequence'
  items: []
  sources:
  - path: sandbox/schemas/spec-driven-sandbox/schema.yaml
    lines:
    - 21
    - 22
    quote: 'Research existing specs before filling this in: run `openspec list --specs` for the project''s capability inventory'
  - path: docs/stages/00-explore.md
    lines:
    - 123
    - 126
    quote: 'That is the *change* list - work in flight. It does not include the project''s durable capabilities, so list those too: ```bash openspec list --specs ```'
  - path: docs/core-workflow.md
    lines:
    - 69
    - 69
    quote: '`/openspec/specs/` starts out empty, so this project has no capability yet for a change to modify.'
- type: documented
  description: 'Open tasks: 02-apply.md lets a task stay unchecked with a one-line reason (AP:105, AP:109); the openspec port''s all_checked rule demands every box ticked'
  resolution: openspec_ff.tasks done_or_reasoned (a ticked box or a plain line under it) instead of openspec.tasks all_checked; verify must then list the open task as CRITICAL (VF:70-71)
  items: []
  sources:
  - path: docs/stages/02-apply.md
    lines:
