    - 109
    quote: 'Completion: every task is checked, or the only unchecked ones carry their one-line reason.'
- type: documented
  description: The action table names the document to open first for each action (CW:18-24) but no line forbids reading a later stage's document early
  resolution: each stage's read is judged in its own window; the order item also voids a document first seen before the previous artifact (read ahead, e.g. all four at once) -- a reading of 'Open this first' / 'On entering one' as 'not before'
  items: []
  sources:
  - path: docs/core-workflow.md
    lines:
    - 18
    - 18
    quote: '| Action | Open this first | Starts from | Leaves |'
  - path: system-prompt.j2
    lines:
    - 68
    - 69
    quote: On entering one, read its stage document in /opsx/stages/
- type: documented
  description: Explore calls itself 'a stance, not a workflow' with 'no fixed steps and no required sequence' (EX:7); core-workflow.md gives it a starting command, a required summary before 01-ff.md and no file (CW:20, CW:60-63)
  resolution: 'procedure precedence (core first): the explore stage''s items are what core-workflow.md and the document''s own required parts fix -- its document read, `openspec list --json`, the summary in a tool call, no file, no composed code, no `openspec new change`; the stance''s suggestions (diagrams, comparison tables, `list --specs` / `show`, how long to explore) have no item, and reading the project config is should'
  items: []
  sources:
  - path: docs/stages/00-explore.md
    lines:
    - 7
    - 7
    quote: '**This is a stance, not a workflow.** There are no fixed steps and no required sequence. The one required output is the summary under **Ending Discovery**, written when exploration is done.'
  - path: docs/core-workflow.md
    lines:
    - 20
    - 20
    quote: '| explore | `/opsx/stages/00-explore.md` | `openspec list --json` | no file: only the "What We Figured Out" summary, in a tool call before the ff document is opened |'
- type: documented
  description: The stance asks questions and lets 'the user' follow what resonates (EX:24-25, EX:40); core-workflow.md says nobody answers and never to ask (CW:48-51)
  resolution: a question is put to the issue, the code and the tests and settled there or recorded as an assumption in the summary (EX:35, CW:54-55); no item reads the questions or the assumptions (prose judgment), and a text-only turn ends the session by itself
  items: []
  sources:
  - path: docs/stages/00-explore.md
    lines:
    - 35
    - 35
    quote: 'A question only the person could answer (intent, priorities, scope the issue leaves open) gets no reply: take the most plausible reading of the issue, mark it as an **assumption** (not as confirmed intent) in your summary, and continue'
  - path: docs/core-workflow.md
    lines:
    - 51
    - 51
    quote: '- never ask a question and never stop to report;'
- type: documented
  description: Explore may run 'the issue's own example exactly as given' but no code it composes (EX:5, CW:75-77); a Python example from an issue can only be run as `python -c` / a heredoc, which is also what composed code looks like
  resolution: 'the composed-code item (`python -c`, a heredoc or stdin piped to python in the explore window) is should: the trace does not hold the issue text to tell its example from the agent''s own code. The no-file item stays must: running an example needs no file'
  items: []
  sources:
  - path: docs/stages/00-explore.md
    lines:
    - 5
    - 5
    quote: 'Here a read-only command is one that runs only what already exists and writes no file: reading, searching, running existing code and existing tests, and running the issue''s own example exactly as given.'
  - path: docs/core-workflow.md
    lines:
    - 75
    - 77
    quote: 'runs only what is already there: existing code, existing tests, and the issue''s own example exactly as given. It composes no code of its own: not a one-line `python -c`, not a heredoc piped to `python3`'
- type: documented
  description: 'Where explore ends: the documents end it by opening 01-ff.md after the summary (EX:189-191, CW:62-63); a run that never opens 01-ff.md, or reads it ahead, has no other boundary between explore and ff'
  resolution: 'explore''s window runs from the start to the first read of 01-ff.md, ff''s from that read to tasks.md (windows: writes; explore has no artifact). A run that writes the change without opening 01-ff.md keeps every write inside explore (its no-file / no-new-change items fail) and has no ff window (ff''s document read fails, ff''s repository-write item finds nothing to judge); 01-ff.md read ahead (with 00-explore.md at the start) closes explore there, and the order item voids the pair'
  items: []
  sources:
  - path: docs/stages/00-explore.md
    lines:
    - 189
    - 189
    quote: 'Then open `/opsx/stages/01-ff.md` and continue: ff turns what you found into a change.'
  - path: docs/core-workflow.md
    lines:
    - 62
    - 63
    quote: written inside a tool call (the `think` tool, for example) before you open `/opsx/stages/01-ff.md`.
- type: documented
  description: The summary goes 'inside a tool call ... before the tool call that opens 01-ff.md' (EX:191); a turn may hold the summary call and the call that opens 01-ff.md together
  resolution: 'the summary item looks in every tool call (a `think` thought, a command as typed, a write''s text) of the explore window and of the step that opens 01-ff.md; it needs the ''What We Figured Out'' heading with ''The problem'' and ''Where the change goes'' (EX:189: the two entries that must be stated); the evidence behind each entry and the other entries are prose and have no item'
  items: []
  sources:
  - path: docs/stages/00-explore.md
    lines:
    - 191
    - 191
    quote: write this summary inside a tool call (the `think` tool, for example) before the tool call that opens `/opsx/stages/01-ff.md`
- type: documented
  description: 'The archive: core-workflow.md says to run `openspec archive issue --yes`, which validates, merges the delta specs and moves the change; nothing forbids doing those steps by hand in words, but the step is the command'
  resolution: 'the archive stage needs a successful `openspec archive` call (zero_stage gate) and no archive directory / main spec the trace itself wrote or moved (zero_stage gate): a hand-made archive scores 0 on the stage even when its files look right'
  items: []
  sources:
  - path: docs/core-workflow.md
    lines:
    - 93
    - 100
    quote: 'Then run once: ```bash openspec archive issue --yes ``` It validates the change, merges its delta specs into `/openspec/specs/` and moves the change to `/openspec/changes/archive/<date>-issue/`.'
- type: documented
  description: 'The CLI''s file operations (`new change`''s scaffold, the archive move, the merged main specs) and its exit codes: the trace shows only the command and what it printed; harbor''s openhands-sdk observations carry no exit-code line'
  resolution: 'a call''s outcome is read off its observation: the CLI''s failure text (Error / Aborted / Validation failed) fails it, the archive''s ''archived as'' passes it, else the terminal''s exit-code line when present; the planning artifacts are found at either location (exclusive) and their trace writes count at the active one'
  items: []
  sources:
  - path: docs/core-workflow.md
    lines:
    - 102
    - 103
    quote: '- Exit code 0: call `finish`. - Exit code 1: correct only what the error message names in the delta spec'
