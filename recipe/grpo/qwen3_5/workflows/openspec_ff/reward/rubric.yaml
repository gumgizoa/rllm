      - 'openspec_ff.ff.run.openspec_ff_cli.final_status: 1.00->0.00 (window empty)'
      - 'openspec_ff.ff.run.prohibited_action.repo_write: 1.00->0.00 (1 in window: step 18: edit tinyconf/values.py)'
      - 'openspec_ff.global.run.order.actions: 1.00->0.83 (5/6: read:FF=9, write:proposal=17, write:tasks=31, read:AP=33, first_repo_write=18, read:V)'
