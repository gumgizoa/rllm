roots:
  artifact: /openspec
  code: '{WORKDIR}'
vars:
  DATE:
    under: '{artifact}/changes/archive'
    regex: \d{4}-\d{2}-\d{2}
    bind: single
  CAP:
    under: '{artifact}/specs'
    regex: '[^./][^/]*'
    bind: single
stages:
- id: explore
  doc: EX
- id: ff
  doc: FF
  artifacts:
  - change
  - proposal
  - spec
  - design
  - tasks
  order_artifact: tasks
- id: apply
  doc: AP
  requires:
  - tasks
- id: verify
  doc: VF
  artifacts:
  - verify
  order_artifact: verify
  requires:
  - tasks
- id: archive
  artifacts:
  - main_spec
  requires:
  - spec
  - verify
artifacts:
  change:
    locations:
    - '{artifact}/changes/issue'
    - '{artifact}/changes/archive/{DATE}-issue'
    exclusive: true
    write_event: last_in_window
    optional: false
    kind: dir
  proposal:
    locations:
    - '{artifact}/changes/issue/proposal.md'
    - '{artifact}/changes/archive/{DATE}-issue/proposal.md'
    exclusive: true
    template: TPL_PROPOSAL
    write_event: last_in_window
    optional: false
    kind: markdown
  spec:
    locations:
    - '{artifact}/changes/issue/specs/{CAP}/spec.md'
    - '{artifact}/changes/archive/{DATE}-issue/specs/{CAP}/spec.md'
    exclusive: true
    template: TPL_SPEC
    write_event: last_in_window
    optional: false
    kind: markdown
  design:
    locations:
    - '{artifact}/changes/issue/design.md'
    - '{artifact}/changes/archive/{DATE}-issue/design.md'
    exclusive: true
    template: TPL_DESIGN
    write_event: last_in_window
    optional: true
    kind: markdown
  tasks:
    locations:
    - '{artifact}/changes/issue/tasks.md'
    - '{artifact}/changes/archive/{DATE}-issue/tasks.md'
    exclusive: true
    template: TPL_TASKS
    write_event: last_in_window
    optional: false
    kind: markdown
  verify:
    locations:
    - '{artifact}/changes/issue/verify.md'
    - '{artifact}/changes/archive/{DATE}-issue/verify.md'
    exclusive: true
    template: VF
    write_event: last_in_window
    optional: false
    kind: markdown
  main_spec:
    locations:
    - '{artifact}/specs/{CAP}/spec.md'
    exclusive: false
    write_event: last_in_window
    optional: false
    kind: markdown
items:
- id: openspec_ff.explore.proposal.field_filled.why
  scope: common
  class: content
  stage: explore
  target:
    type: artifact
    ref: proposal
    state: final
  check:
    kind: field_filled
    params:
      section: Why
  requirement: must
  modality_evidence: 'explore leaves no file; what it finds reaches the change only through ff, which ''writes the proposal and the design from that summary: the proposal''s Why ... rest[s] on it'' (CW:63-65; EX:209 ''ff builds the proposal''s Why ... on it''): an explore that feeds no proposal Why left nothing -- the stage''s gate, as apply''s is the task list it works from'
  none_allowed: 'no'
  applies_when: null
  weight: 1.0
  gate:
    zero_stage: true
  availability:
  - sandbox_file
  sources:
  - doc: CW
    lines:
    - 63
    - 65
    quote: 'ff then writes the proposal and the design from that summary: the proposal''s Why and the design''s Context and **Decisions** (choice, rationale, alternatives) rest on it, and its assumptions go into the proposal.'
  - doc: EX
    lines:
    - 209
    - 209
    quote: 'Here the summary is required: ff builds the proposal''s Why and the design''s Context and Decisions (choice, rationale, alternatives) on it, and writes your assumptions into the proposal.'
  - doc: EX
    lines:
    - 189
    - 189
    quote: ff turns what you found into a change.
  impl_refs: []
  derived_by: manual
  template: C-F6
  log_only: false
  note: 'gate: the proposal''s Why is filled at the end (the explore stage scores 0 when no proposal carries its findings)'
- id: openspec_ff.explore.run.doc_read.ex
  scope: common
  class: evidence
  stage: explore
  target:
    type: action
    ref: run
    state: final
  check:
    kind: doc_read
    params:
      doc: EX
      single_doc: true
      min_coverage: 0.5
  requirement: must
  modality_evidence: imperative (CW:20 'Open this first'; SP:69-70 'explore before ff. On entering one, read its stage document'; INS:1-2 'Explore the issue first')
  none_allowed: '-'
  applies_when: null
  weight: 1.0
  gate: null
  availability:
  - trace
  sources:
  - doc: CW
    lines:
    - 20
    - 20
    quote: '| explore | `/opsx/stages/00-explore.md` | `openspec list --json` |'
  - doc: SP
    lines:
    - 68
    - 69
    quote: explore before ff. On entering one, read its stage document in /opsx/stages/
  - doc: INS
    lines:
    - 1
    - 2
    quote: Explore the issue first, reading and running what exists without writing anything
  impl_refs: []
  derived_by: manual
  template: C-A2
  log_only: false
  note: 00-explore.md read (alone in its call, at least half of it seen) in the explore window
- id: openspec_ff.explore.run.doc_read.config
  scope: common
  class: evidence
  stage: explore
  target:
    type: action
    ref: run
    state: final
  check:
    kind: doc_read
    params:
      doc: CONFIG
  requirement: should
  modality_evidence: 'imperative (EX:131 ''Then read the project''s own context from the resolved root - `<root.path>/openspec/config.yaml`'') in a document that calls itself ''a stance, not a workflow'' with ''no fixed steps'' (EX:7) and asks to use OpenSpec ''naturally, don''t force it'' (EX:109): should'
  none_allowed: '-'
  applies_when: null
  weight: 1.0
  gate: null
  availability:
  - trace
  sources:
  - doc: EX
    lines:
    - 131
    - 133
    quote: 'Then read the project''s own context from the resolved root - `<root.path>/openspec/config.yaml` (or `config.yml`). Use the `root.path` returned above, and skip this if neither file exists: - `context`: project background - tech stack, conventions, constraints'
  impl_refs: []
  derived_by: manual
  template: C-A2
  log_only: false
  note: /openspec/config.yaml (the project's context and rules) read in the explore window
- id: openspec_ff.explore.run.prohibited_action.composed_code
  scope: common
  class: evidence
  stage: explore
  target:
    type: action
    ref: run
    state: final
  check:
    kind: prohibited_action
    params:
      action: command
      pattern: (?m)\bpython[0-9.]*(?:\s+-[A-Za-z]+)*\s+-c\b|\bpython[0-9.]*\s*(?:-\s*)?<<|\|\s*python[0-9.]*(?:\s+-)?\s*(?:$|[;&|)])
  requirement: should
  modality_evidence: 'prohibition (EX:5 ''you must NEVER write code ... Code you compose yourself is writing code, a one-line `python -c` or a snippet piped to stdin included''; EX:215; CW:75-77 ''It composes no code of its own: not a one-line `python -c`, not a heredoc piped to `python3`''); the same EX:5 lets explore run ''the issue''s own example exactly as given'', which a rule cannot tell from composed code by the command alone (conflict below): should'
  none_allowed: '-'
  applies_when: null
  weight: 1.0
  gate: null
  availability:
  - trace
  sources:
  - doc: CW
    lines:
    - 75
    - 77
    quote: 'Explore reads it too, but runs only what is already there: existing code, existing tests, and the issue''s own example exactly as given. It composes no code of its own: not a one-line `python -c`, not a heredoc piped to `python3`, not a script in `/tmp`.'
  - doc: EX
    lines:
    - 5
    - 5
    quote: Code you compose yourself is writing code, a one-line `python -c` or a snippet piped to stdin included
  - doc: EX
    lines:
    - 215
    - 215
    quote: 'Running code you composed is writing code too, whether as `python -c "..."` or as a heredoc piped to `python3`: when you want to try a variant of the issue''s example, record it as an open question for ff instead.'
  impl_refs: []
  derived_by: manual
  template: C-A6
  log_only: false
  note: no `python -c`, heredoc or stdin snippet piped to python in the explore window
- id: openspec_ff.explore.run.openspec_ff_cli.no_new_change
  scope: specific
  class: evidence
  stage: explore
  target:
    type: action
    ref: run
    state: final
  check:
    kind: openspec_ff.cli
    params:
      rule: absent
      sub: ^new\b
  requirement: must
  modality_evidence: 'prohibition (EX:219 ''nothing is captured during explore, and `openspec new change` is ff''s first command''; EX:5 ''explore writes nothing, change artifacts included: the ff action creates the change''; CW:21 ff starts from `openspec new change "issue"`)'
  none_allowed: '-'
  applies_when: null
  weight: 1.0
  gate: null
  availability:
  - trace
  sources:
  - doc: EX
    lines:
    - 219
    - 219
    quote: nothing is captured during explore, and `openspec new change` is ff's first command.
  - doc: EX
    lines:
    - 5
    - 5
    quote: 'In this session explore writes nothing, change artifacts included: the ff action creates the change and writes its artifacts from what you found here.'
  - doc: CW
    lines:
    - 21
    - 21
    quote: '| ff | `/opsx/stages/01-ff.md` | `openspec new change "issue"` | the change and every planning artifact |'
  impl_refs: []
  derived_by: manual
  template: ''
  log_only: false
  note: no `openspec new change` in the explore window (before 01-ff.md is opened)
- id: openspec_ff.explore.run.openspec_ff_paths_written.any
  scope: specific
  class: evidence
  stage: explore
  target:
    type: action
    ref: run
    state: final
  check:
    kind: openspec_ff.paths_written
    params:
      pattern: .
  requirement: must
  modality_evidence: prohibition (CW:77-78 'It writes no file anywhere, inside the repository or outside it'; EX:5 'so is any file write (in the repository, in `/tmp`, under `/openspec/changes/issue/checks/`, by shell redirection or heredoc)'; EX:219 'Do not save insights to files')
  none_allowed: '-'
  applies_when: null
  weight: 1.0
  gate: null
  availability:
  - trace
  sources:
  - doc: CW
    lines:
    - 77
    - 78
    quote: It writes no file anywhere, inside the repository or outside it.
  - doc: CW
    lines:
    - 62
    - 62
    quote: It leaves no file.
  - doc: EX
    lines:
    - 5
    - 5
    quote: Code you compose yourself is writing code, a one-line `python -c` or a snippet piped to stdin included, and so is any file write (in the repository, in `/tmp`, under `/openspec/changes/issue/checks/`, by shell redirection or heredoc).
  - doc: EX
    lines:
    - 219
    - 219
    quote: '- **Don''t auto-capture** - Do not save insights to files: nothing is captured during explore'
  impl_refs: []
  derived_by: manual
  template: ''
