        key: precheck_tasks_min_drop
      worst_items:
      - 'openspec_ff.ff.tasks.tasks.unchecked_at_plan: 1.00->0.00 (4/4 tasks already ticked when planning ended)'
      - 'openspec_ff.apply.tasks.tasks.verified: 1.00->0.00 (0/1 ticked tasks verified by a valid run of their command after their last code change; fa)'
      note: Checkbox artifacts (task lists) are written with every box already ticked, before any work.
    - mutation: archive_cp
