# Generator config for openspec_ff: what the generator cannot read off the workflow's documents.
#
# The agent sees docs/ at /opsx -- core-workflow.md (the package author's hand-written definition of the workflow:
# actions, fixed names, explore before ff, verify once, the archive step) and stages/00-explore.md, 01-ff.md,
# 02-apply.md, 03-verify.md (OpenSpec's explore / ff / apply / verify skills as build.py renders them; explore writes
# nothing, its one output is a summary in a tool call) -- plus instruction.md and the system prompt. Unlike the other
# ports the real `openspec` CLI runs in the sandbox, and what it serves is agent-visible text too: `openspec
# instructions <artifact> --json` returns each artifact's `instruction` and `template` from the forked schema
# (sandbox/schemas/spec-driven-sandbox/, installed at /openspec/schemas/spec-driven-sandbox/) and the project
# `context` / `rules` of sandbox/openspec-config.yaml (installed as /openspec/config.yaml). Those files are sources
# (extra_sources) with the container paths the agent can also `cat` them at. porting/, README.md and build.py are
# the author's notes and tooling, never shown to the agent and never a source. Every decision below cites the line
# it rests on; paths are relative to this package.
workflow: openspec_ff
prefix: openspec_ff

extra_sources:
  - {path: sandbox/schemas/spec-driven-sandbox, container: /openspec/schemas/spec-driven-sandbox}
  - {path: sandbox/openspec-config.yaml, container: /openspec/config.yaml}

ids:
  docs/core-workflow.md: CW
  docs/stages/00-explore.md: EX
  docs/stages/01-ff.md: FF
  docs/stages/02-apply.md: AP
  docs/stages/03-verify.md: VF
  instruction.md: INS
  system-prompt.j2: SP
  sandbox/schemas/spec-driven-sandbox/schema.yaml: SCHEMA
  sandbox/schemas/spec-driven-sandbox/templates/proposal.md: TPL_PROPOSAL
  sandbox/schemas/spec-driven-sandbox/templates/spec.md: TPL_SPEC
  sandbox/schemas/spec-driven-sandbox/templates/design.md: TPL_DESIGN
  sandbox/schemas/spec-driven-sandbox/templates/tasks.md: TPL_TASKS
  sandbox/openspec-config.yaml: CONFIG

roles:
  - docs/core-workflow.md: core
  - docs/stages/*.md: stage_rule
  - sandbox/schemas/spec-driven-sandbox/schema.yaml: schema
  - sandbox/schemas/spec-driven-sandbox/templates/*.md: template
  - sandbox/openspec-config.yaml: reference

system_prompt:
  sections:
    PROBLEM_SOLVING_WORKFLOW: workflow
    "*": harness_generic

# core-workflow.md is the workflow's own definition (written for this package, no upstream counterpart it adapts),
# the stage documents and the schema are the workflow's text: like AI-DLC and speckit_bug, no item is adapter-derived.
adapter_roles: [adapter]

# The templates' normative text sits in HTML comments ("Leave empty if no requirement changes", "Delete this section
# for an existing capability"): statement candidates for G4 / G7 coverage.
parse:
  template_comments: true

# What an artifact contains: the `instruction` field `openspec instructions` serves (the schema) -- "the authoritative
# guidance" (FF:96) -- then its template, the project config, the stage documents, core-workflow.md. Procedure and
# order: core-workflow.md's action table and its Verify Once / Archive sections, then the stage documents (each "says where to go next", CW:26-27).
precedence:
  - order: [schema, template, reference, stage_rule, core, "system_prompt:workflow", instruction, "system_prompt:harness_generic"]
    applies_to: content
    authority:
      path: docs/stages/01-ff.md
      lines: [96, 96]
      quote: "Follow the `instruction` field from `openspec instructions` for each artifact type - it is the authoritative guidance, even for familiar artifact names"
  - order: [core, stage_rule, schema, template, reference, "system_prompt:workflow", instruction, "system_prompt:harness_generic"]
    applies_to: procedure
    authority:
      path: docs/core-workflow.md
      lines: [10, 12]
      quote: "Here no one types them: you take every action yourself, in this order, within this one session, and explore always comes first."

classify:
  openspec:
    brackets: true
  verify:
    # the scorecard's Status cells are values to report (VF:159 "In each Status cell, report the results of checks
    # that ran"), not literal output; the title names the fixed change `issue`
    brackets: false
    placeholder:
      - '<!--.*?-->'
      - '<[A-Za-z][^<>\n]*>'
      - 'X/Y tasks, N reqs'
      - 'M/N reqs covered'
      - 'Followed/Issues'
    literal:
      - '^#{2,3} '
      - '^\|\s*(?:Dimension|Completeness|Correctness|Coherence)\s*\|'

# Skeletons compiled by G2. The spec template is not one of them: the binding delta format is the schema's specs
# instruction (SCHEMA:96-108), which the openspec.delta rules check over every delta file (manual items below), as
# in the openspec port.
templates:
  - id: proposal
    path: sandbox/schemas/spec-driven-sandbox/templates/proposal.md
    artifact: proposal
    stage: ff
    rules: openspec
    binding: &use_template
      path: docs/stages/01-ff.md
      lines: [100, 100]
      quote: "Use `template` as the structure for your output file - fill in its sections"
    sections:
      # the project rule: "leave Modified Capabilities empty" (CONFIG:19); the heading is a manual item
      "Modified Capabilities":
        requirement: skip
        authority: {path: sandbox/openspec-config.yaml, lines: [19, 19], quote: "leave Modified Capabilities empty."}
  - id: design
    path: sandbox/schemas/spec-driven-sandbox/templates/design.md
    artifact: design
    stage: ff
    rules: openspec
    labels: false
    binding: *use_template
  - id: tasks
    path: sandbox/schemas/spec-driven-sandbox/templates/tasks.md
    artifact: tasks
    stage: ff
    rules: openspec
    binding:
      path: sandbox/schemas/spec-driven-sandbox/schema.yaml
      lines: [211, 211]
      quote: "**IMPORTANT: Follow the template below for tracked tasks.**"
  - id: verify
    path: docs/stages/03-verify.md
    block: {fence: markdown, index: 0}
    artifact: verify
    stage: verify
    rules: verify
    literals: patterns
    binding: &scorecard
      path: docs/stages/03-verify.md
      lines: [200, 201]
      quote: "Use clear markdown with: - Table for summary scorecard"
    binding_requirement: must

# CW:16-24: explore -> ff -> apply -> verify -> archive, each action once, "and explore always comes first" (CW:11-12).
# Explore writes nothing (CW:62, CW:77-78, EX:5): it has no artifact, and its one output, the "What We Figured Out"
# summary, is written inside a tool call before 01-ff.md is opened (CW:62-63, EX:191), so explore is the stage from the
# start of the run to the first read of 01-ff.md, and ff (no earlier artifact to start from) begins at that read.
# "Verify runs once and writes
# /openspec/changes/issue/verify.md. Whatever it finds, move on to archive" (CW:84-87), so verify.md is the one report
# and there is no second verify stage. Only apply may send the run back (to ff, for a missing artifact: CW:26).
# The change is `issue` (CW:35) until `openspec archive` moves it to changes/archive/<date>-issue/ (CW:99-100): every
# change artifact has both locations, exclusive. The archive merges the delta specs into specs/<cap>/spec.md (CW:99).
# The CLI's own file operations (the scaffold of `new change`, the archive move, the merged main specs) are not in the
# trace; the archive stage is judged on the command and its outcome, and on what the CLI left.
stage_model:
  fixed:
    roots:
      artifact: /openspec
      code: "{WORKDIR}"
    vars:
      DATE: {under: "{artifact}/changes/archive", regex: '\d{4}-\d{2}-\d{2}', bind: single}
      CAP: {under: "{artifact}/specs", regex: '[^./][^/]*', bind: single}
    stages:
      - id: explore
        doc: docs/stages/00-explore.md
        artifacts: []
      - id: ff
        doc: docs/stages/01-ff.md
        artifacts: [change, proposal, spec, design, tasks]
        order_artifact: tasks
      - id: apply
        doc: docs/stages/02-apply.md
        artifacts: []
        requires: [tasks]
      - id: verify
        doc: docs/stages/03-verify.md
        artifacts: [verify]
        order_artifact: verify
        requires: [tasks]
      - id: archive
        artifacts: [main_spec]
        requires: [spec, verify]
    artifacts:
      change:
        locations: ["{artifact}/changes/issue", "{artifact}/changes/archive/{DATE}-issue"]
        exclusive: true
        kind: dir
      proposal:
        locations: ["{artifact}/changes/issue/proposal.md", "{artifact}/changes/archive/{DATE}-issue/proposal.md"]
        exclusive: true
        template: sandbox/schemas/spec-driven-sandbox/templates/proposal.md
      spec:
        locations: ["{artifact}/changes/issue/specs/{CAP}/spec.md", "{artifact}/changes/archive/{DATE}-issue/specs/{CAP}/spec.md"]
        exclusive: true
        template: sandbox/schemas/spec-driven-sandbox/templates/spec.md
      design:
        locations: ["{artifact}/changes/issue/design.md", "{artifact}/changes/archive/{DATE}-issue/design.md"]
        exclusive: true
        optional: true
        template: sandbox/schemas/spec-driven-sandbox/templates/design.md
      tasks:
        locations: ["{artifact}/changes/issue/tasks.md", "{artifact}/changes/archive/{DATE}-issue/tasks.md"]
        exclusive: true
        template: sandbox/schemas/spec-driven-sandbox/templates/tasks.md
      verify:
        locations: ["{artifact}/changes/issue/verify.md", "{artifact}/changes/archive/{DATE}-issue/verify.md"]
        exclusive: true
        template: docs/stages/03-verify.md
      main_spec:
        locations: ["{artifact}/specs/{CAP}/spec.md"]

scoring:
  item_weight: {must: 1.0, should: 0.25}
  stage: {formula: sigma_kappa}
  substantive_threshold: 0.5
  # Stage windows by artifact writes: explore (no artifact, CW:20) runs from the start to the first read of 01-ff.md,
  # ff from that read to tasks.md's first write, verify ends with verify.md's; apply (no artifact of its own) runs
  # from tasks.md to the first read of 03-verify.md, archive (no document of its own, CW:24) from verify.md to the
  # end. A stage document read ahead (conflict below) does not move a window an artifact bounds; 01-ff.md read ahead
  # (with 00-explore.md, say) does end explore there -- explore has no artifact to bound it.
  windows: writes
  # apply has no artifact of its own: it ends at 03-verify.md's first read after apply began, so a document read
  # ahead (all three at the start) does not close the apply window (the order item judges the read-ahead)
  next_read: after_start
  signals: [order, process, "stage:*"]
  process_scale: stage_mean
  compliance: mean
  selftest:
    template_copy_stage_max: 0.10
    frontmatter_stub_compliance_max: 0.05
    x_fill_no_real_test_compliance_max: 0.50
    honest_golden_min: 0.95
    # OpenSpec's artifacts record no test result (no Baseline / Result field): a failing run followed by a passing
    # re-run of the same command contradicts nothing the documents ask
    hidden_failure_min_drop: 0.0

gates:
  # an artifact still holding its template's placeholders is the template, not the stage's result (DESIGN §9
  # template_copy_stage_max 0.10)
  "openspec_ff.ff.proposal.no_template_residue": {cap_stage: 0.1}
  "openspec_ff.ff.tasks.no_template_residue": {cap_stage: 0.1}
  "openspec_ff.verify.verify.no_template_residue": {cap_stage: 0.1}
  # a field, list item or table cell holding only a fill-in mark (x, ..., ?) is a placeholder left in place
  "openspec_ff.*.no_template_residue.fill_marks": {cap_stage: 0.1}

llm:
  backend: claude-cli
  model: claude-opus-5-5
  samples: 2
  batch: 16
  chunk_lines: 80
  max_rounds: 2
  max_budget_usd: 3.0
  max_total_usd: 16.0  # the run's cap (28 USD) less what the calls in flight (parallel x max per call) can add
  parallel: 4
  timeout: 900

# Extracted (G5/G7) items dropped on review. Each names the G4 statement it came from (gen-work/statements.jsonl).
exclude:
  # -- the same requirement as a reviewed (manual) item, in a plugin kind G8 does not dedupe, or with other parameters
  - {statement: "*", kind: artifact_exists, reason: "every artifact's existence is a manual item (stage_end for planning, final for the report); design.md is conditional (SCHEMA:170, FF:72) -- an unconditional copy fails the honest no-design run"}
  - {statement: "*", kind: openspec_ff.cli, reason: "every CLI call the documents name (explore's list --json, new change, status, instructions <artifact>, instructions apply, archive) and every forbidden one (init, --schema, --no-validate, new change during explore) is a manual openspec_ff.cli / openspec_ff.archive item with the window its action gives it (before the artifact's first write, before apply's first code change); the extracted copies use whole-stage windows (FF:80-83's final status falls after the ff window ends) or a quoted spelling"}
  - {statement: "*", kind: openspec_ff.archive, reason: "the archive rules (succeeded, retries, specs_only, by_cli, after) are manual items; cw-061 ('call finish without archiving') mapped to by_cli is a misreading"}
  - {statement: "*", kind: openspec.capabilities, reason: "duplicates the manual declared / listed_have_specs / specs_listed items (SCHEMA:34-37, SCHEMA:74)"}
  - {statement: "*", kind: openspec.read_files, reason: "duplicates the manual dependency reads (FF:56, FF:107) and context-file reads (AP:74, VF:41), whose windows run from the dependency's write to the dependent artifact / to apply's first code change"}
  - {statement: "*", kind: openspec.tasks, reason: "duplicates the manual has_tasks / verification items (SCHEMA:211-229)"}
  - {statement: "*", kind: openspec_ff.evidence, reason: "duplicates the manual apply test_or_check item (SCHEMA:232-234)"}
  - {statement: "*", kind: openspec_ff.holds, reason: "duplicates the manual code-change gate (CW:22) and the archive stage's no-return-to-apply items (CW:86-87, CW:105-106)"}
  - {statement: "*", kind: openspec_ff.verify, reason: "duplicates the manual open_tasks_critical items, kept at should: both sides are the agent's writing (P6)"}
  - {statement: "*", kind: openspec_ff.no_fetch, reason: "duplicates the manual global no_fetch item (CW:42-44, CONFIG:13), which already names every fetching command"}
  - {statement: "*", kind: doc_read, reason: "the stage documents' reads are manual items, one per stage window"}
  - {statement: "*", kind: openspec_ff.note, reason: "explore's summary is the manual note item (CW:62-63, EX:189-191, EX:209); the stage documents' other 'announce' / 'display' lines may also go in the message of a turn that makes a tool call, or into an artifact (CW:52-53), which a tool-call note check does not see, and an assumption is recorded only when there is one (EX:35)"}
  - {statement: "*", kind: openspec_ff.paths_written, stage: explore, reason: "duplicates the manual explore no-file item (CW:77-78, EX:5), which already covers every path (repository, /tmp, checks/, the workflow configuration)"}
  - {statement: "*", kind: prohibited_action, stage: explore, reason: "duplicates the manual explore no-file item (CW:77-78: a repository edit is a file write) and the composed-code item (CW:75-77, EX:5), kept at should: the issue's own example may be run as given (conflict below)"}
  - {statement: "*", kind: openspec_ff.tasks, reason: "the task-list rules (done_or_reasoned, rerun_after_tick) are manual items (AP:97-98, AP:105, AP:109); the extracted copies repeat done_or_reasoned (cw-011, ap-059, ap-072, schema-114) or read 'Mark the task complete' (ap-047) as a write the done_or_reasoned item already judges"}
  - {statement: "ff-062", kind: no_template_residue, reason: "the context / rules blocks not copied into an artifact (FF:101-103) are manual items per artifact, with the config's own sentences as patterns"}
  - {statement: "schema-00[23]", kind: section_present, reason: "the proposal's headings are the template's, compiled at must under FF:100's binding ('Use `template` as the structure'); SCHEMA:13-15 describe their content (the manual field_filled items)"}
  - {statement: "schema-003", kind: item_format, reason: "duplicates the manual What Changes bullet item (SCHEMA:14)"}
  - {statement: "schema-07[59]", kind: section_present, reason: "design.md's headings are the template's, compiled at must under FF:100's binding; SCHEMA:176-180 describe their content (the manual field_filled items)"}
  - {statement: "schema-081", kind: section_present, reason: "design.md's Risks / Trade-offs heading is the template's, compiled at must (FF:100); SCHEMA:180 describes its content (the manual field_filled item and the kept arrow-format item)"}
  - {statement: "schema-049", kind: item_format, reason: "duplicates the manual openspec.delta delta_sections and openspec_ff.delta added_only items (SCHEMA:96, CW:69-70)"}
  - {statement: "schema-053", kind: item_format, reason: "duplicates the manual openspec.delta requirement_blocks item (SCHEMA:103)"}
  - {statement: "schema-054", kind: item_format, reason: "duplicates the manual openspec.delta shall_must item (SCHEMA:104), which judges every requirement, not one line"}
  - {statement: "schema-055", kind: item_format, reason: "duplicates the manual openspec.delta scenario / scenario_heading items (SCHEMA:105-107)"}
  - {statement: "schema-056", kind: no_template_residue, reason: "duplicates the manual openspec.delta scenario_heading item (SCHEMA:106)"}
  - {statement: "schema-096", kind: item_format, reason: "duplicates the manual tasks groups item (SCHEMA:218), which allows the optional Workflow follow-up section"}
  - {statement: "schema-097", kind: item_format, reason: "duplicates the manual task_lines item (SCHEMA:219)"}
  - {statement: "vf-132", kind: item_format, reason: "duplicates the scorecard rows compiled from the template (VF:152-156)"}
  - {statement: "vf-117", kind: item_format, reason: "duplicates the manual Final Assessment item (VF:180-186), which also accepts the prescribed 'All checks passed. Ready for archive.' this pattern misses"}
  - {statement: "config-00[47]", kind: openspec_ff.created_files, reason: "duplicates the manual global created_files items (tests: CW:79; scratch scripts: CW:81-82)"}
  - {statement: "cw-062", kind: prohibited_action, reason: "duplicates the manual global no_skip_validation item (CW:105), which matches the flag in an openspec call over the whole run"}
  # -- misreadings
  - {statement: "schema-076", kind: item_format, reason: "'(e.g., \"See proposal.md - Why\")' is an example of referencing the proposal, not a required word (SCHEMA:177)"}
  - {statement: "cw-049", kind: write_discipline, reason: "'Verify runs once' (CW:86) is the action, not the file: a report corrected in place is still one verify, and the archive moves verify.md (no trace write explains the archived file, so the item fails every run); a return to apply after it is the archive stage's no-return items"}

# Contradictions and gaps the documents leave, and how the rubric reads them (P3).
conflicts:
  - description: "Verify once: the report keeps upstream's CRITICAL label 'Must fix before archive' and the assessment 'Fix before archiving' (VF:163, VF:181); core-workflow.md says verify runs once and the run moves on to archive whatever it finds (CW:86-87), and 03-verify.md's next step is the archive (VF:188)"
    sources:
      - {path: docs/core-workflow.md, lines: [86, 87], quote: "Verify runs once and writes `/openspec/changes/issue/verify.md`. Whatever it finds, move on to archive; the report records what is still open."}
      - {path: docs/stages/03-verify.md, lines: [181, 181], quote: "- If CRITICAL issues: \"X critical issue(s) found. Fix before archiving.\""}
      - {path: docs/stages/03-verify.md, lines: [188, 188], quote: "**Next step**: go to the archive step in `/opsx/core-workflow.md`. What is left stays recorded in this report."}
    resolution: "procedure precedence (core first): a CRITICAL issue is recorded in verify.md, not fixed; no item asks for a fix or a second report after a CRITICAL count, and the prescribed 'N critical issue(s) found. Fix before archiving.' passes the Final Assessment item; going back to apply after verify.md (a repository edit or a task-list write once verify.md is written) fails the archive stage's no-return items (CW:74, CW:86-87, CW:105-106)"
  - description: "Every stage document opens with the upstream Project check ('confirm the project has a root: run `openspec list --json`'); core-workflow.md says the planning root is already set up"
    sources:
      - {path: docs/stages/01-ff.md, lines: [3, 3], quote: "confirm the project has a root: run `openspec list --json`"}
      - {path: docs/stages/00-explore.md, lines: [9, 9], quote: "confirm the project has a root: run `openspec list --json`"}
      - {path: docs/core-workflow.md, lines: [33, 33], quote: "- Planning root: `/openspec`, already set up with `openspec init`"}
    resolution: "one global should item: `openspec list --json` before the first write (`openspec new change`); the check's answer is fixed in this sandbox, so it is not must. The no-root branches (EX:11-18: stop and show the error, stop using OpenSpec, ask how to proceed) cannot arise here and have no item. Explore's start from the same call (CW:20) is a separate must item of the explore stage"
  - description: "The proposal instruction says to research existing specs with `openspec list --specs` / `openspec show` (SCHEMA:21-33); core-workflow.md and the project context say specs/ starts empty"
    sources:
      - {path: sandbox/schemas/spec-driven-sandbox/schema.yaml, lines: [21, 22], quote: "Research existing specs before filling this in: run `openspec list --specs` for the project's capability inventory"}
      - {path: docs/stages/00-explore.md, lines: [123, 126], quote: "That is the *change* list - work in flight. It does not include the project's durable capabilities, so list those too: ```bash openspec list --specs ```"}
      - {path: docs/core-workflow.md, lines: [69, 69], quote: "`/openspec/specs/` starts out empty, so this project has no capability yet for a change to modify."}
    resolution: "no item for the research calls (the proposal's, and explore's `openspec list --specs` / `openspec show`, EX:123-129): their answer is fixed (no capability), the proposal's Modified Capabilities item carries the consequence"
  - description: "Open tasks: 02-apply.md lets a task stay unchecked with a one-line reason (AP:105, AP:109); the openspec port's all_checked rule demands every box ticked"
    sources:
      - {path: docs/stages/02-apply.md, lines: [109, 109], quote: "Completion: every task is checked, or the only unchecked ones carry their one-line reason."}
    resolution: "openspec_ff.tasks done_or_reasoned (a ticked box or a plain line under it) instead of openspec.tasks all_checked; verify must then list the open task as CRITICAL (VF:70-71)"
  - description: "The action table names the document to open first for each action (CW:18-24) but no line forbids reading a later stage's document early"
    sources:
      - {path: docs/core-workflow.md, lines: [18, 18], quote: "| Action | Open this first | Starts from | Leaves |"}
      - {path: system-prompt.j2, lines: [69, 70], quote: "On entering one, read its stage document in /opsx/stages/"}
    resolution: "each stage's read is judged in its own window; the order item also voids a document first seen before the previous artifact (read ahead, e.g. all four at once) -- a reading of 'Open this first' / 'On entering one' as 'not before'"
  - description: "Explore calls itself 'a stance, not a workflow' with 'no fixed steps and no required sequence' (EX:7); core-workflow.md gives it a starting command, a required summary before 01-ff.md and no file (CW:20, CW:60-63)"
    sources:
      - {path: docs/stages/00-explore.md, lines: [7, 7], quote: "**This is a stance, not a workflow.** There are no fixed steps and no required sequence. The one required output is the summary under **Ending Discovery**, written when exploration is done."}
      - {path: docs/core-workflow.md, lines: [20, 20], quote: "| explore | `/opsx/stages/00-explore.md` | `openspec list --json` | no file: only the \"What We Figured Out\" summary, in a tool call before the ff document is opened |"}
    resolution: "procedure precedence (core first): the explore stage's items are what core-workflow.md and the document's own required parts fix -- its document read, `openspec list --json`, the summary in a tool call, no file, no composed code, no `openspec new change`; the stance's suggestions (diagrams, comparison tables, `list --specs` / `show`, how long to explore) have no item, and reading the project config is should"
  - description: "The stance asks questions and lets 'the user' follow what resonates (EX:24-25, EX:40); core-workflow.md says nobody answers and never to ask (CW:48-51)"
    sources:
      - {path: docs/stages/00-explore.md, lines: [35, 35], quote: "A question only the person could answer (intent, priorities, scope the issue leaves open) gets no reply: take the most plausible reading of the issue, mark it as an **assumption** (not as confirmed intent) in your summary, and continue"}
      - {path: docs/core-workflow.md, lines: [51, 51], quote: "- never ask a question and never stop to report;"}
    resolution: "a question is put to the issue, the code and the tests and settled there or recorded as an assumption in the summary (EX:35, CW:54-55); no item reads the questions or the assumptions (prose judgment), and a text-only turn ends the session by itself"
  - description: "Explore may run 'the issue's own example exactly as given' but no code it composes (EX:5, CW:75-77); a Python example from an issue can only be run as `python -c` / a heredoc, which is also what composed code looks like"
    sources:
      - {path: docs/stages/00-explore.md, lines: [5, 5], quote: "Here a read-only command is one that runs only what already exists and writes no file: reading, searching, running existing code and existing tests, and running the issue's own example exactly as given."}
      - {path: docs/core-workflow.md, lines: [75, 77], quote: "runs only what is already there: existing code, existing tests, and the issue's own example exactly as given. It composes no code of its own: not a one-line `python -c`, not a heredoc piped to `python3`"}
    resolution: "the composed-code item (`python -c`, a heredoc or stdin piped to python in the explore window) is should: the trace does not hold the issue text to tell its example from the agent's own code. The no-file item stays must: running an example needs no file"
  - description: "Where explore ends: the documents end it by opening 01-ff.md after the summary (EX:189-191, CW:62-63); a run that never opens 01-ff.md, or reads it ahead, has no other boundary between explore and ff"
    sources:
      - {path: docs/stages/00-explore.md, lines: [189, 189], quote: "Then open `/opsx/stages/01-ff.md` and continue: ff turns what you found into a change."}
      - {path: docs/core-workflow.md, lines: [62, 63], quote: "written inside a tool call (the `think` tool, for example) before you open `/opsx/stages/01-ff.md`."}
    resolution: "explore's window runs from the start to the first read of 01-ff.md, ff's from that read to tasks.md (windows: writes; explore has no artifact). A run that writes the change without opening 01-ff.md keeps every write inside explore (its no-file / no-new-change items fail) and has no ff window (ff's document read fails, ff's repository-write item finds nothing to judge); 01-ff.md read ahead (with 00-explore.md at the start) closes explore there, and the order item voids the pair"
  - description: "The summary goes 'inside a tool call ... before the tool call that opens 01-ff.md' (EX:191); a turn may hold the summary call and the call that opens 01-ff.md together"
    sources:
      - {path: docs/stages/00-explore.md, lines: [191, 191], quote: "write this summary inside a tool call (the `think` tool, for example) before the tool call that opens `/opsx/stages/01-ff.md`"}
    resolution: "the summary item looks in every tool call (a `think` thought, a command as typed, a write's text) of the explore window and of the step that opens 01-ff.md; it needs the 'What We Figured Out' heading with 'The problem' and 'Where the change goes' (EX:189: the two entries that must be stated); the evidence behind each entry and the other entries are prose and have no item"
  - description: "The archive: core-workflow.md says to run `openspec archive issue --yes`, which validates, merges the delta specs and moves the change; nothing forbids doing those steps by hand in words, but the step is the command"
    sources:
      - {path: docs/core-workflow.md, lines: [93, 100], quote: "Then run once: ```bash openspec archive issue --yes ``` It validates the change, merges its delta specs into `/openspec/specs/` and moves the change to `/openspec/changes/archive/<date>-issue/`."}
    resolution: "the archive stage needs a successful `openspec archive` call (zero_stage gate) and no archive directory / main spec the trace itself wrote or moved (zero_stage gate): a hand-made archive scores 0 on the stage even when its files look right"
  - description: "The CLI's file operations (`new change`'s scaffold, the archive move, the merged main specs) and its exit codes: the trace shows only the command and what it printed; harbor's openhands-sdk observations carry no exit-code line"
    sources:
      - {path: docs/core-workflow.md, lines: [102, 103], quote: "- Exit code 0: call `finish`. - Exit code 1: correct only what the error message names in the delta spec"}
    resolution: "a call's outcome is read off its observation: the CLI's failure text (Error / Aborted / Validation failed) fails it, the archive's 'archived as' passes it, else the terminal's exit-code line when present; the planning artifacts are found at either location (exclusive) and their trace writes count at the active one"
  - description: "skip_specs: the schema lets a change opt out of specs when no spec-level behaviour changes; a SWE task changes behaviour, and core-workflow.md says every delta is ADDED for a new capability (CW:69-70)"
    sources:
      - {path: sandbox/schemas/spec-driven-sandbox/schema.yaml, lines: [91, 92], quote: "There must be at least one spec file unless the change's `.openspec.yaml` sets `skip_specs: true`"}
      - {path: docs/stages/01-ff.md, lines: [72, 72], quote: "`specs` qualifies only via the `skipped` status above, never by your own judgment"}
    resolution: "the delta-spec items stay in the denominator: a change without a delta spec fails them (as the openspec port)"
  - description: "design.md is conditional ('create only if any apply') while tasks requires [specs, design]"
    sources:
      - {path: sandbox/schemas/spec-driven-sandbox/schema.yaml, lines: [170, 170], quote: "When to include design.md (create only if any apply):"}
      - {path: docs/stages/01-ff.md, lines: [72, 73], quote: "Spec-driven's `design.md` qualifies ... Dependencies are enablers, not gates"}
    resolution: "design's existence is never required; its format items, its instructions call and its dependency read apply only when it exists"
  - description: "The ff stage re-reads dependency artifacts 'from disk, even if you saw them earlier' (FF:56, FF:107) though the agent just wrote them"
    sources:
      - {path: docs/stages/01-ff.md, lines: [56, 56], quote: "Read any completed dependency files for context - always re-read them from disk, even if you saw them earlier in the conversation"}
    resolution: "required as written (must): a read of the dependency file after it was written and before the dependent artifact"
  - description: "The generic system prompt asks to keep AGENTS.md in the repository (SP:11) and to ask the user for clarification; the workflow forbids leaving anything behind in /testbed and stopping to ask (CW:48-56, CW:81-82)"
    sources:
      - {path: system-prompt.j2, lines: [11, 11], quote: "* Use `AGENTS.md` under the repository root as your persistent memory for repository-specific knowledge and context."}
      - {path: docs/core-workflow.md, lines: [81, 82], quote: "- Leave nothing else behind in `/testbed`: no notes, summaries or scratch scripts."}
    resolution: "the workflow wins (SP:61-64 the workflow takes the place of the usual procedure): a scratch / note file created in the repository fails its item even when removed again; AGENTS.md is not itemized"

