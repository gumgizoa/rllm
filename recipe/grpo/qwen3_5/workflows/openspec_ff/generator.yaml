    sources: &open_crit
      - {path: docs/stages/03-verify.md, lines: [70, 71], quote: "- If `progress.remaining` is greater than 0: - Add CRITICAL issue for each listed incomplete task."}
    note: "when tasks.md held an open box as the report was written, the report lists a CRITICAL issue"
  - id: openspec_ff.verify.verify.no_template_residue.fill_marks
    stage: verify
    class: content
    requirement: must
    target: {type: artifact, ref: verify, state: final}
    check: {kind: no_template_residue, params: {patterns: &fill_marks ['(?im)^\|(?:[^|\n]*\|)*\s*(?:x+|\.{2,}|…+|\?+)\s*\|', '(?im)^\s*(?:[-*+]|\d{1,3}[.)])\s+(?:(?:\*\*|__)?[\w /&().-]{1,60}?(?:\*\*|__)?\s*:\s*(?:\*\*|__)?\s*)?(?:x+|\.{2,}|…+|\?+)\s*$', '\bX critical issue\(s\) found\b', '\bY warning\(s\) to consider\b', '\bZ suggestion\(s\) to consider\b']}}
    modality_evidence: "VF:159 'In each Status cell, report the results of checks that ran': a cell or item holding only a fill-in mark, or the Final Assessment's own X / Y / Z, is a placeholder left in place"
