    stage: archive
    class: structure
    requirement: must
    target: {type: artifact, ref: main_spec, state: final}
    check: {kind: openspec.main_spec, params: {rule: exists, root: "{artifact}/specs"}}
    modality_evidence: "CW:99 'merges its delta specs into `/openspec/specs/`'"
    sources:
      - {path: docs/core-workflow.md, lines: [99, 99], quote: "It validates the change, merges its delta specs into `/openspec/specs/`"}
    note: "every capability the deltas add has its main spec /openspec/specs/<capability-path>/spec.md"
  - id: openspec_ff.archive.main_spec.main_spec.synced
    stage: archive
    class: content
    requirement: must
    target: {type: artifact, ref: main_spec, state: final}
    check: {kind: openspec.main_spec, params: {rule: synced, root: "{artifact}/specs"}}
    gate: {zero_stage: true}
    modality_evidence: "CW:99 'merges its delta specs into `/openspec/specs/`': the archive's product is the archived change's deltas merged; main specs that do not hold them are no archive of this change"
    sources:
      - {path: docs/core-workflow.md, lines: [99, 99], quote: "It validates the change, merges its delta specs into `/openspec/specs/`"}
    note: "each ADDED requirement of the archived deltas (with its scenarios) is in its main spec"
  - id: openspec_ff.ff.spec.no_template_residue.context
    stage: ff
    class: content
    requirement: must
    target: {type: artifact, ref: spec, state: final}
    check: {kind: no_template_residue, params: {patterns: *ctx_copy}}
