      - {path: docs/stages/03-verify.md, lines: [181, 181], quote: "\"X critical issue(s) found. Fix before archiving.\""}
    note: "a table cell or list item holding only a fill-in mark (x, ..., ?), or the template's 'X critical issue(s)' / 'Y warning(s)' / 'Z suggestion(s)'"
  # ============================================================== archive (core-workflow.md, "Archive, Then Finish")
  - id: openspec_ff.archive.run.openspec_ff_archive.after_verify
    stage: archive
    class: evidence
    requirement: must
    check: {kind: openspec_ff.archive, params: {rule: after, event: "write:verify"}}
    availability: [trace]
    modality_evidence: "imperative (CW:91-92 'archive only once `/openspec/changes/issue/verify.md` exists')"
    sources:
      - {path: docs/core-workflow.md, lines: [91, 93], quote: "archive only once `/openspec/changes/issue/verify.md` exists. If it does not, open `/opsx/stages/03-verify.md` and write it first."}
    note: "the first `openspec archive` call comes after verify.md is written"
  - id: openspec_ff.archive.run.prohibited_action.repo_write
    stage: archive
    class: evidence
    requirement: must
    check: {kind: prohibited_action, params: {action: repo_write, window: ["first_write:verify", "end"]}}
    availability: [trace]
    modality_evidence: "prohibition (CW:74 'Only the apply action edits `/testbed`'; CW:86-87 'Verify runs once ... Whatever it finds, move on to archive'; CW:105-106 'do not reopen tasks or apply: the code is done')"
    sources: &no_return
      - {path: docs/core-workflow.md, lines: [86, 87], quote: "Verify runs once and writes `/openspec/changes/issue/verify.md`. Whatever it finds, move on to archive; the report records what is still open."}
      - {path: docs/core-workflow.md, lines: [74, 74], quote: "- Only the apply action edits `/testbed`. ff and verify read it and run commands in it."}
      - {path: docs/core-workflow.md, lines: [105, 106], quote: "do not reopen tasks or apply: the code is done, and judging it was verify's job."}
      - {path: docs/stages/03-verify.md, lines: [188, 188], quote: "**Next step**: go to the archive step in `/opsx/core-workflow.md`. What is left stays recorded in this report."}
    note: "no write into the repository once verify.md is written (no return to apply after the report, whatever it found)"
  - id: openspec_ff.archive.run.openspec_ff_paths_written.tasks_after_verify
    stage: archive
    class: evidence
    requirement: must
    check: {kind: openspec_ff.paths_written, params: {pattern: '^/openspec/changes/issue/tasks\.md$', window: ["first_write:verify", "end"]}}
    availability: [trace]
    modality_evidence: "prohibition (CW:105-106 'do not reopen tasks or apply'; CW:86-87 'Whatever it finds, move on to archive; the report records what is still open'): an open task stays open in tasks.md and recorded in verify.md"
    sources: *no_return
    note: "the active tasks.md not written once verify.md is written (no task ticked, reopened or added after the report); after the archive call the specs_only item covers the archived copy, and a hand-made move is the by_cli item's"
  - id: openspec_ff.archive.run.openspec_ff_archive.succeeded
    stage: archive
    class: evidence
    requirement: must
    check: {kind: openspec_ff.archive, params: {rule: succeeded}}
    gate: {zero_stage: true}
    availability: [trace]
    modality_evidence: "imperative (CW:93-96 'Then run once: openspec archive issue --yes'; CW:24 the action starts from it)"
    sources:
      - {path: docs/core-workflow.md, lines: [93, 96], quote: "Then run once: ```bash openspec archive issue --yes"}
      - {path: docs/core-workflow.md, lines: [24, 24], quote: "| archive | this document, below | `openspec archive issue --yes` | the archived change |"}
    note: "an `openspec archive` call succeeded (its output says 'archived as', or it exited 0 without failure text)"
  - id: openspec_ff.archive.run.openspec_ff_archive.retries
    stage: archive
    class: evidence
    requirement: must
    check: {kind: openspec_ff.archive, params: {rule: retries}}
    availability: [trace]
    modality_evidence: "imperative (CW:93 'run once'; CW:103-104 'run the same command one more time. If it fails again, call `finish` without archiving'; CW:102 'Exit code 0: call `finish`')"
    sources:
      - {path: docs/core-workflow.md, lines: [102, 105], quote: "- Exit code 0: call `finish`. - Exit code 1: correct only what the error message names in the delta spec (its format, or a spec file that is missing), then run the same command one more time. If it fails again, call `finish` without archiving."}
    note: "at most two `openspec archive` calls, the second only after a failed first"
  - id: openspec_ff.archive.run.openspec_ff_archive.specs_only
    stage: archive
    class: evidence
    requirement: must
    check: {kind: openspec_ff.archive, params: {rule: specs_only, allow: ["{artifact}/changes/issue/specs"]}}
    availability: [trace]
    modality_evidence: "imperative (CW:103 'correct only what the error message names in the delta spec'); prohibition (CW:105-106 'do not reopen tasks or apply')"
    sources:
      - {path: docs/core-workflow.md, lines: [103, 106], quote: "correct only what the error message names in the delta spec (its format, or a spec file that is missing) ... Never add `--no-validate`, and do not reopen tasks or apply: the code is done, and judging it was verify's job."}
      - {path: docs/core-workflow.md, lines: [91, 91], quote: "The code change must be complete before this step"}
    note: "after the first `openspec archive` call nothing is written but the change's delta specs (no code, tasks or other artifact)"
  - id: openspec_ff.archive.run.openspec_ff_archive.by_cli
    stage: archive
    class: evidence
    requirement: must
    check: {kind: openspec_ff.archive, params: {rule: by_cli, roots: ["{artifact}/changes/archive", "{artifact}/specs"]}}
    gate: {zero_stage: true}
    availability: [trace]
    modality_evidence: "CW:99-100: the command merges the delta specs and moves the change; a hand-made archive (mv / cp of the change, a main spec written by the agent) is not the archive step"
    sources:
      - {path: docs/core-workflow.md, lines: [99, 100], quote: "It validates the change, merges its delta specs into `/openspec/specs/` and moves the change to `/openspec/changes/archive/<date>-issue/`."}
      - {path: docs/core-workflow.md, lines: [27, 28], quote: "The `openspec` command is installed and does the bookkeeping."}
    note: "the trace writes or moves nothing into /openspec/changes/archive/ or /openspec/specs/: the CLI did it"
