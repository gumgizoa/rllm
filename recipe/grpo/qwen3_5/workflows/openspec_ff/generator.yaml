    sources:
      - {path: docs/core-workflow.md, lines: [99, 100], quote: "moves the change to `/openspec/changes/archive/<date>-issue/`."}
      - {path: docs/core-workflow.md, lines: [24, 24], quote: "| archive | this document, below | `openspec archive issue --yes` | the archived change |"}
    note: "the change ended up in the archive"
