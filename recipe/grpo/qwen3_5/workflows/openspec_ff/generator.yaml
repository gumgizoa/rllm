    sources: &prio_src
      - {path: docs/stages/03-verify.md, lines: [202, 202], quote: "- Grouped lists for issues (CRITICAL/WARNING/SUGGESTION)"}
      - {path: docs/stages/03-verify.md, lines: [161, 163], quote: "**Issues by Priority**: 1. **CRITICAL** (Must fix before archive):"}
