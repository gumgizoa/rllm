# Pre-port rule inventory of BMAD-METHOD `bmad-build-auto` (stage 1b of the port).
# Every rule cites the upstream file:line it was read from (doc ids below); nothing is from memory.
# Rendered to 01b-rules.md by the scratchpad script render_rules.py; edit this file, not the markdown.
schema: port.rules/1
workflow: bmad_build_auto
upstream: BMAD-METHOD @ 10db8f35bba515e4fbf0388c5bd59a6cc7a3e9c8 (v6.12.2)
process: bmad-build-auto (src/bmm-skills/ship/bmad-build-auto, rendered chain SKILL.md -> workflow.md -> step-01..04 -> HALT)
docs:
  SK: {path: src/bmm-skills/ship/bmad-build-auto/SKILL.md, role: skill}
  WF: {path: src/bmm-skills/ship/bmad-build-auto/workflow.md, role: skill}
  S1: {path: src/bmm-skills/ship/bmad-build-auto/step-01-clarify-and-route.md, role: step}
  S2: {path: src/bmm-skills/ship/bmad-build-auto/step-02-plan.md, role: step}
  S3: {path: src/bmm-skills/ship/bmad-build-auto/step-03-implement.md, role: step}
  S4: {path: src/bmm-skills/ship/bmad-build-auto/step-04-review.md, role: step}
  ST: {path: src/bmm-skills/ship/bmad-build-auto/spec-template.md, role: template}
  CT: {path: src/bmm-skills/ship/bmad-build-auto/customize.toml, role: prompt}
  EH: {path: src/bmm-skills/ship/bmad-build-auto/review-prompts/edge-case-hunter.md, role: prompt}
  VG: {path: src/bmm-skills/ship/bmad-build-auto/review-prompts/verification-gap.md, role: prompt}
  CC: {path: src/bmm-skills/ship/bmad-build-auto/references/claims-check.md, role: prompt}
  DC: {path: src/bmm-skills/ship/bmad-build-auto/references/deletion-check.md, role: prompt}
  CE: {path: src/bmm-skills/ship/bmad-build-auto/compile-epic-context.md, role: prompt}
  MB: {path: src/bmm-skills/module.yaml, role: code}
  MC: {path: src/core-skills/module.yaml, role: code}
# Stages: 0 global/activation, 1 clarify-and-route, 2 plan, 3 implement, 4 review, halt = HALT/finalize.
# Blocks: A activation/reading, B artifact discipline, C routing/status, D planning/spec content,
#         E implementation, F verification, G review, H finalization/HALT, I subagent machinery, J epic context compile.
rules:

# ---------------------------------------------------------------- A. activation / reading
- id: A1
  stage: 0
  category: P
  text: "첫 행동으로 render_skill.py 명령을 정확히 한 번, cwd를 바꾸지 않고, {project-root}·{skill-root}를 절대경로로 치환해 실행한다"
  source: ["SK:6", "SK:9"]
  quote: "Run the following command exactly once without changing the current working directory."
  logic: {compares: trace-doc, form: count, window: whole-run, polarity: do}
  template: T-AW5
  skill: S3
  train: {relation: rewarded, note: "OSF openspec_ff.*.openspec_ff_cli.* (CLI command in a stage window, 18 items)", layer_candidate: L1}
  measure: code
  port: {fate: drop, gap: G7, note: "renderer emulated at build time; no uv in the sandbox (survey, Fit)"}
- id: A2
  stage: 0
  category: P
  text: "렌더 성공 시 stdout에 찍힌 workflow.md 절대경로 하나를 읽고 따른다 (가장 먼저 읽는 문서)"
  source: ["SK:12"]
  quote: "On success, read and follow the one absolute `workflow.md` instruction printed to stdout."
  logic: {compares: trace-doc, form: order, window: whole-run, polarity: do}
  template: T-RD1
  skill: S1
  train: {relation: rewarded, note: "doc_read_first.cw in AOS/OSF/SKB", layer_candidate: L1}
  measure: code
  port: {fate: env, gap: G5, note: "path fixed by the port instead of stdout"}
- id: A3a
  stage: 0
  category: P
  text: "렌더 실패(uv 없음 포함) 시 명령 출력을 보고하고 HALT한다"
  source: ["SK:13"]
  quote: "On failure (including `uv` being unavailable), report the command output and HALT."
  logic: {compares: trace-doc, form: order, window: whole-run, polarity: do}
  template: T-OR2
  skill: S2
  train: {relation: rewarded, note: "OSF archive.retries, SKB no_round_after_verified (branch on a result)", layer_candidate: L1}
  measure: code
  port: {fate: drop, gap: G7, note: "no renderer in the port"}
- id: A3b
  stage: 0
  category: R
  text: "렌더 실패 시 원본 workflow 소스 파일을 직접 실행하지 않는다"
  source: ["SK:13"]
  quote: "Do not run any workflow source directly."
  logic: {compares: trace-doc, form: window-forbid, window: whole-run, polarity: dont}
  template: T-PR6
  skill: S4
  train: {relation: rewarded, note: "OSF openspec_ff.global.run.openspec_ff_cli.no_init (a named action is prohibited)", layer_candidate: L1}
  measure: code
  port: {fate: drop, gap: G7, note: "no src/rendered split in the port"}
- id: A4
  stage: 0
  category: P
  text: "단계 파일이 다른 snapshot 파일을 가리키면 그 파일을 끝까지 읽고 따른다"
  source: ["WF:5", "S1:14"]
  quote: "If a step directs you to another snapshot file, read it fully and follow it. No exceptions."
  logic: {compares: trace-doc, form: window-require, window: in-stage, polarity: do}
  template: T-RD2
  skill: S1
  train: {relation: rewarded, note: "doc_read.* items in AOS/OSF/SKB; AOS CW:14 'Open each command document when you reach it'", layer_candidate: L1}
  measure: code
  port: {fate: env, gap: G5, note: "snapshot paths become the port's doc paths"}
- id: A5
  stage: 0
  category: P
  text: "파일 간 참조는 모두 절대 snapshot 경로다: 그 경로를 바로 열고 skill 디렉터리 기준으로 해석하지 않는다"
  source: ["WF:71"]
  quote: "Every operational cross-file reference in this workflow is an absolute snapshot path. Open it directly"
  logic: {compares: trace-doc, form: equal, window: whole-run, polarity: do}
  template: T-RD2
  skill: S1
  train: {relation: rewarded, note: "doc_read.* check the given path was read (instance: which path)", layer_candidate: L1}
  measure: code
  port: {fate: env, gap: G5, note: "one copy of the docs; the distinction disappears"}
- id: A6
  stage: 0
  category: P
  text: "활성화 1단계: prepend 단계를 순서대로 실행한다 (`_None._`이면 건너뜀; 기본값 빈 목록)"
  source: ["WF:80-82", "CT:17"]
  quote: "Execute each of these steps in order before proceeding (`_None._` means skip):"
  logic: {compares: none, form: order, window: whole-run, polarity: do}
  template: null
  skill: null
  train: {relation: none, note: "hook machinery; empty by default", layer_candidate: null}
  measure: enforced
  port: {fate: drop, gap: G7, note: "renders to `_None._`; nothing to do"}
- id: A7
  stage: 0
  category: P
  text: "활성화 2단계: persistent_facts 항목을 실행 내내 기본 맥락으로 삼고 `file:` 항목은 내용을 로드한다 (기본값 빈 목록)"
  source: ["WF:86-88", "CT:23-27"]
  quote: "Entries prefixed `file:` are paths or globs under `{project-root}` -- load the referenced contents as facts."
  logic: {compares: none, form: exists, window: whole-run, polarity: do}
  template: null
  skill: null
  train: {relation: none, note: "hook machinery; empty by default", layer_candidate: null}
  measure: enforced
  port: {fate: drop, gap: G7, note: "renders to `_None._`"}
- id: A8
  stage: 0
  category: P
  text: "활성화 3단계: append 단계를 순서대로 실행한다 (`_None._`이면 건너뜀; 기본값 빈 목록)"
  source: ["WF:92-94", "CT:21"]
  quote: "Execute each of these steps in order (`_None._` means skip):"
  logic: {compares: none, form: order, window: whole-run, polarity: do}
  template: null
  skill: null
  train: {relation: none, note: "hook machinery; empty by default", layer_candidate: null}
  measure: enforced
  port: {fate: drop, gap: G7, note: "renders to `_None._`"}
- id: A10
  stage: 0
  category: P
  text: "단계 파일을 순서대로 따른다: 한 단계를 끝까지 읽고 실행한 뒤, 지시받을 때만 다음 단계를 연다"
  source: ["WF:100"]
  quote: "Read one step fully, execute it, then load the next step only when directed."
  logic: {compares: trace-doc, form: order, window: whole-run, polarity: do}
  template: T-OR1
  skill: S2
  train: {relation: rewarded, note: "agentos_v2.global.run.order.commands, openspec_ff.global.run.order.actions, speckit_bug.global.run.order.round_1", layer_candidate: L1}
  measure: code
  port: {fate: keep, gap: null, note: "the same chain, four steps"}
- id: A11
  stage: 0
  category: P
  text: "단계를 건너뛰거나 순서를 바꾸지 않는다 (의도가 상세해도 step-02 조사·spec 작성은 생략하지 않음)"
  source: ["WF:100", "S1:13"]
  quote: "Do not skip, reorder, or pre-load steps."
  logic: {compares: trace-doc, form: order, window: whole-run, polarity: dont}
  template: T-OR1
  skill: S2
  train: {relation: rewarded, note: "same items as A10; SKB CW:11-25 one round = assess, fix, test in order", layer_candidate: L1}
  measure: code
  port: {fate: keep, gap: null, note: ""}
- id: A12
  stage: 0
  category: P
  text: "다음 단계 파일을 미리 읽지 않는다"
  source: ["WF:100"]
  quote: "Do not skip, reorder, or pre-load steps."
  logic: {compares: trace-doc, form: window-forbid, window: in-stage, polarity: dont}
  template: T-RD3
  skill: S1
  train: {relation: rewarded, note: "training implements it as order(invalidate=read_ahead) in the three order items (01_template_layer table, T-RD3 row)", layer_candidate: L1}
  measure: code
  port: {fate: keep, gap: null, note: ""}
- id: A14
  stage: 0
  category: P
  text: "각 단계 파일 끝의 NEXT가 가리키는 다음 단계 파일을 끝까지 읽고 따른다 (workflow.md→step-01→02→03→04)"
  source: ["WF:104", "S1:84", "S2:27", "S3:48"]
  quote: "Read fully and follow `[[bmad-snapshot:step-02-plan.md]]`"
  logic: {compares: trace-doc, form: window-require, window: in-stage, polarity: do}
  template: T-RD2
  skill: S1
  train: {relation: rewarded, note: "doc_read.* per stage in AOS(4)/OSF(4)/SKB(7)", layer_candidate: L1}
  measure: code
  port: {fate: env, gap: G5, note: "paths only"}

