  quote: "Use the invocation prompt as the intent."
  logic: {compares: none, form: judgement, window: in-stage, polarity: do}
  template: null
  skill: null
  train: {relation: none, note: "input definition; AOS CW:37-38 and SKB CW:33 define the issue text as the input the same way", layer_candidate: null}
