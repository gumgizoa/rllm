# ---------------------------------------------------------------- new templates (defined once; status candidate until an item implements them)
new_templates:
  NEW-J-content:
    skill: J
    name: content judged by an LLM judge over the artifact and the issue/diff (outside S1-S10)
    compares: issue-artifact or artifact-diff or artifact-internal, form judgement; the judge sees the artifact, the issue and the diff, not the trajectory
    nearest: none in the catalogue; 10_handover 2.5 keeps judge items outside S1-S10 and reports them on a separate axis (J); defined here so every judge-checkable rule carries a template id
    status: candidate
  NEW-AW-subagent:
    skill: S3
    name: a delegation call (subagent launch) required or forbidden inside a window, with its launch parameters
    compares: trace vs document — the tool call that launches a child agent, its count per message, blocking/background flag and prompt text, inside the stage window
    nearest: T-AW5 (run a CLI command inside a window); differs in the compared object (a child-agent call with a prescribed prompt, not a shell command) and in the parameters judged (one message, blocking, prompt verbatim)
    status: candidate
  NEW-FM-internal:
    skill: S10
    name: artifact-internal consistency — a field equals a value derived from other parts of the same artifact
    compares: artifact-internal, form equal/count/keyed — e.g. `<total>` equals the row count, `followup_review_recommended` equals the triage-derived value, verdict false implies route reject, `oversized` present iff the body exceeds 1600 tokens
    nearest: T-FM3 (count against a fixed number) and T-RF1 (record against the run); differs because both sides are inside the artifact (09 named it '산출물 내부 일관성')
    status: candidate
  NEW-FM-language:
    skill: S10
    name: artifact (or message) language equals the configured language
    compares: artifact-internal, form equal — language detection over the whole text
    nearest: T-FM2 (allowed values of a field); differs because it is a property of the whole text, not of a field
    status: candidate
  NEW-WD-revert:
    skill: S5
    name: after a decision the working tree is restored to the baseline (the attempt is saved elsewhere)
    compares: artifact-diff, form equal — the repository state after the revert equals the baseline revision; the saved patch file equals the discarded diff
    nearest: T-AW1 (no repository edit outside the allowed stage); differs because it compares an end state with the baseline rather than forbidding edit events
    status: candidate
