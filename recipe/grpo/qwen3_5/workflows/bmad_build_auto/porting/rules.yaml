- id: B5
  stage: 3
  category: F
  text: "spec 안의 markdown 링크는 spec 파일 디렉터리 기준 상대경로로 쓴다 (앞에 `/` 없음)"
  source: ["S3:32"]
  quote: "Any markdown links written into `{spec_file}` must use paths relative to `{spec_file}`'s directory"
