  DIFFFILE:
    under: '{artifact}/diff'
    regex: '[^/]+\.diff'
    bind: single
  RESULTFILE:
    under: '{artifact}/implementation-artifacts'
    regex: bmad-build-auto-result-[^/]+\.md
    bind: single
stages:
- id: step01
  doc: S1
  artifacts: []
- id: step02
  doc: S2
  artifacts:
  - spec
  order_artifact: spec
- id: step03
  doc: S3
  artifacts:
  - diff
  order_artifact: diff
  requires:
  - spec
- id: step04
  doc: S4
  artifacts: []
  requires:
  - spec
  - diff
artifacts:
  spec:
    locations:
    - '{artifact}/implementation-artifacts/{SPECFILE}'
    exclusive: false
    template: ST
    write_event: last_in_window
    optional: false
    kind: markdown
  diff:
    locations:
    - '{artifact}/diff/{DIFFFILE}'
    exclusive: false
    template: null
    write_event: last_in_window
    optional: false
    kind: text
  result:
    locations:
    - '{artifact}/implementation-artifacts/{RESULTFILE}'
    exclusive: false
    template: null
    write_event: last_in_window
    optional: true
    kind: markdown
