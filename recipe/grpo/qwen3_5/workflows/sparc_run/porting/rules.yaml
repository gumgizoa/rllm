# Pre-port rule inventory of SPARC (ruvnet) 1.0, process A: the five-phase evidence-gated run driven through the `sparc` CLI.
# Every rule cites the upstream file:line it was read from (checkout at /vast-ib/MMI/home/kyuminkim/project/if/workflows/sparc).
# Most rules live in code (gates.ts, store.ts, cli.ts, domain.ts); those files are treated as rule documents (role: code).
# Rule counts: 72 rules; enforced (the CLI refuses the violation) 42, code 24, judge 5, none 1.
schema: port.rules/1
workflow: sparc_run
upstream: https://github.com/ruvnet/sparc.git @ 3af6c696be3e713d885cead7f84d07a7fac25ade
process: "A. 1.0 CLI five-phase evidence-gated run: start -> Specification -> Pseudocode -> Architecture -> Refinement (implement + test + signed evidence) -> Completion -> status/trace"
docs:
  SK:  {path: skills/sparc/SKILL.md, role: skill}
  SKR: {path: skills/sparc-resume/SKILL.md, role: skill}
  SKV: {path: skills/sparc-review/SKILL.md, role: skill}
  TR:  {path: templates/README.md, role: template}
  TD:  {path: templates/definition.example.json, role: template}
  TS:  {path: templates/specification.json, role: template}
  TP:  {path: templates/pseudocode.json, role: template}
  TA:  {path: templates/architecture.json, role: template}
  TF:  {path: templates/refinement.json, role: template}
  TC:  {path: templates/completion.json, role: template}
  CLI: {path: src/cli.ts, role: code}
  GT:  {path: src/gates.ts, role: code}
  ST:  {path: src/store.ts, role: code}
  DM:  {path: src/domain.ts, role: code}
  MH:  {path: src/metaharness.ts, role: code}
  EA:  {path: docs/EVIDENCE_ATTESTATION.md, role: readme}
  TU:  {path: docs/tutorial.md, role: readme}
  RM:  {path: README.md, role: readme}

# Stage names: 0 = global; Start = `sparc start` with definition.json; the five SPARC phases by name; Trace = after finalization.
# Training evidence (train.note) cites constraints.yaml item ids of agentos_v2 (AOS) / openspec_ff (OSF) / speckit_bug (SKB), status implemented,
# or lines of their docs/ (AOS CW = agentos_v2/docs/core-workflow.md, OSF CW = openspec_ff/docs/core-workflow.md, SKB CW = speckit_bug/docs/core-workflow.md, SKB FX = speckit_bug/docs/stages/02-fix.md).

rules:

# ---------------------------------------------------------------- A. activation and order of operations
- id: A1
  stage: 0
  category: Q
  text: 시작 전에 목표·제약·요구사항·관찰 가능한 인수 증거를 (메시지나 definition에) 밝힌다
  source: ["SK:22", "MH:59"]
  quote: "1. State the goal, constraints, requirements, and observable acceptance evidence."
  logic: {compares: issue-artifact, form: judgement, window: none, polarity: do}
  template: null
  skill: null
  train: {relation: none, note: "내용 적절성 항목; 카탈로그 밖 (10_handover §2.5). 학습 항목 없음", layer_candidate: null}
  measure: judge
  port: {fate: semantic, gap: G3, note: "skill 문장을 entry 문서의 '이슈에서 REQ/TEST를 끌어내라'로 다시 쓴다; judge 항목"}

- id: A2
  stage: Start
  category: P
  text: "`sparc start`는 run마다 한 번만 호출한다 (같은 run-id로 두 번째 start는 RUN_EXISTS)"
  source: ["SK:23", "ST:349-366", "TU:39"]
  quote: "Call `sparc_run_start` once."
  logic: {compares: artifact-trace, form: count, window: whole-run, polarity: do}
  template: T-AW5
  skill: S3
  train: {relation: rewarded, note: "OSF openspec_ff.ff.run.openspec_ff_cli.new_change ('ff starts from openspec new change'), T-AW5 OSF 18건", layer_candidate: L1}
  measure: enforced
  port: {fate: keep, gap: G7, note: "CLI가 sandbox에 있어야 한다 (Node 20 + dist/). 두 번째 start는 CLI가 거부하므로 천장 항목"}

- id: A3
  stage: Start
  category: P
  text: "start 직후 `sparc status`(요약)를 읽고, 다음 변경 명령에 그 요약의 revision을 쓴다"
  source: ["SK:24", "TU:50", "RM:74"]
  quote: "Read the bounded summary with `sparc_run_get`. ... use the summary revision for the next mutation."
  logic: {compares: artifact-trace, form: window-require, window: in-stage, polarity: do}
  template: T-AW5
  skill: S3
  train: {relation: rewarded, note: "OSF openspec_ff.ff.run.openspec_ff_cli.instructions_design ('get openspec instructions before writing'); OSF FF:67 re-run status after each artifact", layer_candidate: L1}
  measure: code
  port: {fate: keep, gap: G7, note: "trace에서 start와 첫 submit 사이의 status 호출을 센다; revision 자체는 start 출력에도 있어 생략 가능성 높음"}

- id: A4
  stage: 0
  category: P
  text: "단계를 Specification → Pseudocode → Architecture → Refinement → Completion 순서로만 밟는다 (submit은 현재 단계만, advance는 바로 다음 단계만)"
  source: ["SK:25", "DM:3-9", "ST:522-527", "ST:773-793", "RM:13", "MH:44-50"]
  quote: "Only Specification to Pseudocode to Architecture to Refinement to Completion is legal"
  logic: {compares: artifact-trace, form: order, window: whole-run, polarity: do}
  template: T-OR1
  skill: S2
  train: {relation: rewarded, note: "AOS agentos_v2.global.run.order.commands; OSF openspec_ff.global.run.order.actions; SKB speckit_bug.global.run.order.round_1", layer_candidate: L1}
  measure: enforced
  port: {fate: keep, gap: G7, note: "CLI가 순서를 강제한다 (다른 단계 submit은 VALIDATION, 건너뛰는 advance는 PHASE_SKIP). 완료된 run은 위반할 수 없다"}

- id: A5
  stage: 0
  category: P
  text: "다섯 단계를 하나도 건너뛰지 않고 모두 지난다 (phaseHistory가 다섯 단계 전부를 순서대로 담는다)"
  source: ["SK:41", "ST:1829-1843", "MH:107"]
  quote: "Never skip phases, rewrite prior artifacts, ..."
  logic: {compares: artifact-trace, form: count, window: whole-run, polarity: do}
  template: T-OR1
  skill: S2
  train: {relation: rewarded, note: "AOS CW:27-28 'Each command runs once, in this order'; 위 T-OR1 항목들", layer_candidate: L1}
  measure: enforced
  port: {fate: keep, gap: G7, note: "완료 상태(status completed)에 이르면 자동으로 참. 미완료 run에서는 '어디까지 갔나'가 평가 신호"}

- id: A6
  stage: Specification|Pseudocode|Architecture|Refinement|Completion
  category: F
  text: "단계마다 그 단계의 정식 산출물(artifactId = 단계 이름 소문자)을 `sparc submit --phase <단계> --file <json>`으로 제출한다"
  source: ["SK:25", "ST:531-534", "DM:368-370", "GT:82-87", "GT:918-926"]
  quote: "Submit each phase artifact with `sparc_phase_submit`."
  logic: {compares: artifact-trace, form: exists, window: in-stage, polarity: do}
  template: T-FM1
  skill: S10
  train: {relation: rewarded, note: "AOS agentos_v2.shape_spec.spec_dir.artifact_exists; SKB speckit_bug.assess.assessment.artifact_exists; T-FM1 세 workflow 모두", layer_candidate: L1}
  measure: enforced
  port: {fate: keep, gap: G7, note: "gate가 MISSING_PHASE_ARTIFACT를 내므로 advance 전에 반드시 있다; 산출물은 run JSON 안에 쌓인다 (G5: 파일이 아니라 state 안)"}

- id: A7a
  stage: Specification|Pseudocode|Architecture|Refinement|Completion
  category: P
  text: "advance 전에 `sparc gate`를 호출해 blocker를 확인한다"
  source: ["SK:27", "TU:65-68", "RM:84"]
  quote: "6. Call `sparc_gate_validate`. Call `sparc_phase_advance` only when the current gate passes."
  logic: {compares: artifact-trace, form: order, window: in-stage, polarity: do}
  template: T-OR1
  skill: S2
  train: {relation: rewarded, note: "OSF openspec_ff.apply.tasks.openspec_ff_tasks.rerun_after_tick (도구로 상태 확인 후 진행), T-OR1 사슬 항목", layer_candidate: L1}
  measure: code
  port: {fate: keep, gap: G7, note: "CLI는 gate 호출 자체를 강제하지 않는다 (advance가 내부에서 다시 평가). trace에서 submit→gate→advance 순서를 센다"}

- id: A7b
  stage: Specification|Pseudocode|Architecture|Refinement|Completion
  category: P
  text: "gate가 통과할 때만 advance한다 (blocker가 있으면 advance는 GATE_BLOCKED, 종료코드 2)"
  source: ["SK:27", "ST:794-795", "ST:819-820", "CLI:342", "RM:104"]
  quote: "const gate = evaluatePhaseGate(this.toPublic(state), state.phase); if (!gate.ok) return this.blockedByGate(state, gate);"
  logic: {compares: artifact-trace, form: order, window: in-stage, polarity: do}
  template: T-OR2
  skill: S2
  train: {relation: rewarded, note: "OSF openspec_ff.archive.run.openspec_ff_archive.retries (결과 분기); SKB speckit_bug.global.run.speckit_bug_holds.no_round_after_verified", layer_candidate: L1}
  measure: enforced
  port: {fate: keep, gap: G7, note: "천장 항목: 통과 못 한 advance는 상태를 바꾸지 않는다"}

- id: A8
  stage: Specification|Pseudocode|Architecture|Refinement|Completion
  category: P
  text: "gate blocker가 나오면 산출물을 고쳐 새 버전으로 다시 submit하고(새 idempotency key) 다시 gate한다; blocker를 무시하거나 숨기지 않는다"
  source: ["TU:68", "SK:41", "ST:532-534"]
  quote: "Correct the artifact, submit a new immutable version with a new idempotency key, and validate again."
  logic: {compares: artifact-trace, form: order, window: in-stage, polarity: do}
  template: T-OR2
  skill: S2
  train: {relation: rewarded, note: "OSF CW:102-105 archive 실패 시 지적된 것만 고쳐 한 번 더 실행; openspec_ff.archive.run.openspec_ff_archive.retries", layer_candidate: L1}
  measure: code
  port: {fate: keep, gap: G8, note: "재시도 상한이 upstream에 없다 (G8 loops): port가 상한을 정해야 한다. trace에서 gate(exit 2) 뒤 submit이 따르는지 센다"}

- id: A9
  stage: Trace
  category: P
  text: "완료를 보고하기 전에 `sparc trace` 페이지를 끝까지 읽고 run 요약(`sparc status`)을 다시 읽는다"
  source: ["SK:29", "TU:110-115", "SKV:28"]
  quote: "8. Before reporting completion, traverse every `sparc_trace_get` page, then reread the run summary."
  logic: {compares: artifact-trace, form: window-require, window: after-last-edit, polarity: do}
  template: T-AW5
  skill: S3
  train: {relation: rewarded, note: "OSF openspec_ff.apply.tasks.openspec_ff_tasks.rerun_after_tick (T-PG2) 와 T-AW5 status 재호출 항목이 가까움", layer_candidate: L1}
  measure: code
  port: {fate: keep, gap: G7, note: "마지막 응답 전 trace+status 호출 존재. SWE run은 12~15 revision이라 페이지 하나"}

- id: A10
  stage: Trace
  category: A
  text: "마지막 보고에 run ID, 최종 revision, 남은 exception을 적고, 그 값이 state와 같다"
  source: ["SK:29"]
  quote: "Report the run ID, final revision, and remaining exceptions."
  logic: {compares: artifact-trace, form: equal, window: after-last-edit, polarity: do}
  template: T-RF1
  skill: S6
  train: {relation: rewarded, note: "SKB speckit_bug.fix.fix.field_type.commands_run (기록한 값 = 실행 값); T-RF1 세 workflow 모두", layer_candidate: L1}
  measure: code
  port: {fate: keep, gap: null, note: "마지막 메시지의 revision 숫자를 state 파일과 대조"}

- id: A11
  stage: 0
  category: P
  text: "페이지 cursor는 불투명하게 다루고 nextCursor가 없어질 때까지 이어 읽는다; cursor가 stale하거나 revision이 바뀌면 모은 페이지를 버리고 첫 페이지부터 다시 읽는다 (스냅샷을 섞지 않음)"
  source: ["SK:39", "SK:24", "TU:115"]
  quote: "If a cursor is rejected as stale or the run revision changes, discard all pages from that traversal and restart at the first page; never mix snapshots."
  logic: {compares: artifact-trace, form: order, window: whole-run, polarity: do}
  template: T-OR2
  skill: S2
  train: {relation: rewarded, note: "T-OR2 (결과 분기·재시도) OSF/SKB 각 1건; 페이지 루프 자체는 학습에 없음", layer_candidate: L1}
  measure: code
  port: {fate: env, gap: G8, note: "단일 agent·작은 run에서는 페이지가 하나이고 stale cursor가 생기지 않는다; 규칙은 남지만 거의 발동하지 않음"}

- id: A12
  stage: Specification|Pseudocode|Architecture|Refinement|Completion
  category: P
  text: "단계 산출물을 쓰기 전에 그 단계의 템플릿(templates/<phase>.json)을 읽고 복사해 채운다"
  source: ["TU:54", "TU:78", "RM:92", "TR:3"]
  quote: "Copy `templates/specification.json`, replace its example identifiers and content, then submit it with the current revision"
  logic: {compares: trace-doc, form: order, window: in-stage, polarity: do}
  template: T-RD2
  skill: S1
  train: {relation: rewarded, note: "AOS agentos_v2.shape_spec.run.doc_read.ss; OSF openspec_ff.ff.run.doc_read.ff; SKB speckit_bug.assess.run.doc_read.as", layer_candidate: L1}
  measure: code
  port: {fate: env, gap: G5, note: "템플릿 파일을 port의 문서 디렉터리에 두고 경로를 entry 문서에 적는다; 읽기 시점(submit 전)을 trace에서 본다"}

# ---------------------------------------------------------------- B. run start / definition
- id: B1
  stage: Start
  category: F
  text: "definition.json: requirements ≥1개, 각 요구사항에 id·statement(비어있지 않은 텍스트)·inScope(boolean)·acceptanceTestIds(배열); 각 acceptanceTest에 id·description(·선택 command 텍스트)"
  source: ["ST:1146-1178", "ST:1156-1160", "TD:1-16", "DM:39-51"]
  quote: "if (!Array.isArray(requirementsInput) || requirementsInput.length === 0) { throw new SparcError('VALIDATION', 'at least one stable requirement is required'); }"
  logic: {compares: artifact-internal, form: exists, window: none, polarity: do}
  template: T-FM6
  skill: S10
  train: {relation: rewarded, note: "AOS agentos_v2.write_spec.spec.agentos_v2_blocks.specific_requirements; OSF openspec_ff.ff.spec.delta.when_then (블록마다 필드)", layer_candidate: L1}
  measure: enforced
  port: {fate: keep, gap: G1, note: "start가 거부한다. 이슈 → REQ/TEST 변환(G1 입력)은 B7의 내용 문제"}

- id: B2
  stage: Start
  category: F
  text: "REQ/TEST/run/evidence 식별자는 128자 이내의 이식 가능한 식별자 패턴 ^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$ 을 따른다"
  source: ["DM:361", "DM:372-375", "ST:1158", "ST:1169", "ST:563-565", "TU:39"]
  quote: "export const SPARC_IDENTIFIER_PATTERN = /^[A-Za-z0-9](?:[A-Za-z0-9._:@-]{0,127})$/;"
  logic: {compares: artifact-internal, form: exists, window: none, polarity: do}
  template: T-FM3
  skill: S10
  train: {relation: rewarded, note: "AOS agentos_v2.shape_spec.requirements.item_format.questions (번호 형식); SKB speckit_bug.assess.assessment.item_format.suspected_code_paths", layer_candidate: L1}
  measure: enforced
  port: {fate: keep, gap: null, note: "형식 위반은 start/evidence가 거부"}

- id: B3
  stage: Start
  category: F
  text: "요구사항 id와 인수테스트 id는 중복이 없고, 한 요구사항의 acceptanceTestIds 안에서도 같은 TEST를 반복하지 않는다"
  source: ["ST:1161", "ST:1171", "ST:1182"]
  quote: "if (requirements.has(requirement.id)) throw new SparcError('VALIDATION', `duplicate requirement ${requirement.id}`);"
  logic: {compares: artifact-internal, form: count, window: none, polarity: dont}
  template: T-FM3
  skill: S10
  train: {relation: rewarded, note: "T-FM3 고유성 항목 (AOS 11, OSF 10, SKB 11 implemented)", layer_candidate: L1}
  measure: enforced
  port: {fate: keep, gap: null, note: ""}

- id: B4
  stage: Start
  category: C
  text: "요구사항이 인용하는 모든 TEST id가 같은 definition의 acceptanceTests에 등록되어 있다 (인용 ⊆ 등록)"
  source: ["ST:1183"]
  quote: "if (!tests.has(testId)) throw new SparcError('VALIDATION', `requirement ${requirement.id} references unknown ${testId}`);"
  logic: {compares: artifact-internal, form: set, window: none, polarity: do}
  template: NEW-S8-intra-set
  skill: S8
  train: {relation: none, note: "학습 cross_ref는 모두 산출물 간 집합 관계(T-TR1); 한 산출물 안의 두 섹션 사이 집합 관계는 항목·문서 모두 없음. T-TR1의 구조 확장", layer_candidate: L2M}
  measure: enforced
  port: {fate: keep, gap: null, note: ""}

- id: B5
  stage: Start
  category: F
  text: "inScope=true인 요구사항은 인수테스트가 1개 이상이고 nonGoalReason이 없다; inScope=false인 요구사항은 인수테스트가 없고 nonGoalReason 텍스트가 있다"
  source: ["ST:1186-1198", "DM:45-51"]
  quote: "if (ids.size === 0) { throw new SparcError('VALIDATION', `in-scope requirement ${requirement.id} requires an acceptance test`); }"
  logic: {compares: artifact-internal, form: exists, window: none, polarity: do}
  template: T-FM2
  skill: S10
  train: {relation: rewarded, note: "T-FM2 조건부 채움(field_filled when) 항목이 세 workflow에 다수; 예 SKB speckit_bug.assess.assessment.section_present.proposed_remediation", layer_candidate: L1}
  measure: enforced
  port: {fate: keep, gap: null, note: "SWE 과제에서 out-of-scope REQ는 거의 쓰이지 않을 것"}

- id: B6
  stage: Start
  category: F
  text: "`sparc start --run-id --title --definition --idempotency-key`로 run을 만들어 state root 아래 run JSON(revision 1, phase Specification)이 생긴다"
  source: ["CLI:212-231", "ST:320-347", "TU:41-50", "RM:66-72"]
  quote: "sparc start --run-id ID --title TEXT --definition FILE [mutation options]"
  logic: {compares: artifact-trace, form: exists, window: none, polarity: do}
  template: T-FM1
  skill: S10
  train: {relation: rewarded, note: "AOS agentos_v2.shape_spec.spec_dir.artifact_exists (지정 경로에 산출물 생성)", layer_candidate: L1}
  measure: code
  port: {fate: keep, gap: G5, note: "state root는 저장소 밖 절대경로여야 한다 (I4). run JSON 경로는 sha256(principal)/sha256(run-id)라 평가기는 CLI나 glob으로 찾는다"}

- id: B7
  stage: Start
  category: Q
  text: "요구사항 statement는 관찰 가능한 요구 하나를, 인수테스트 description은 그것을 증명하는 객관적 증거를 적는다; 식별자는 라벨이 아니라 안정된 trace 키다"
  source: ["TD:5", "TD:13", "TU:39", "MH:59"]
  quote: "\"statement\": \"State one observable requirement\" ... \"description\": \"State objective evidence that proves REQ-1\""
  logic: {compares: issue-artifact, form: judgement, window: none, polarity: do}
  template: null
  skill: null
  train: {relation: none, note: "내용 적절성; 카탈로그 밖", layer_candidate: null}
  measure: judge
  port: {fate: semantic, gap: G1, note: "입력이 이슈(hidden tests)라 인수테스트는 agent가 스스로 정하는 재현·회귀 테스트가 된다; judge가 이슈 대비 적절성을 본다"}

# ---------------------------------------------------------------- C. per-phase artifact fields (form)
- id: C1
  stage: Specification|Pseudocode|Architecture|Refinement|Completion
  category: F
  text: "단계 산출물의 텍스트 필드는 비어있지 않은 문자열, 목록 필드는 비어있지 않은 문자열만 담은 배열(또는 문자열)이다 — Spec: outcome, businessValue, actors, inputs, outputs, assumptions, constraints, exclusions, securityBoundaries, measurableSuccessCriteria; Pseudo: controlFlow, dataTransformations, invariants, walkthroughs.success/.failure, walkthroughs.invariantChecks.success/.failure; Arch: dataLifecycle, deploymentModel, observability, migrationPath, rollbackPath, selectedDesign; Refinement: verification, preservedBehavior; Completion: finalDiff, documentation, observability, rollback, residualRisks"
