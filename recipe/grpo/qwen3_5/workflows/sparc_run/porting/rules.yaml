# ---------------------------------------------------------------- new template candidates (defined once)
new_templates:
  NEW-S8-intra-set:
    skill: S8
    name: set relation between two sections of one artifact (cited ⊆ declared)
    compares: "artifact-internal: the id/text set one section cites against the set another section of the same artifact declares; form set"
    nearest: "T-TR1 (set relation between artifacts). Differs in the object compared: both sides are inside one artifact, and the elements may be literal strings (invariant sentences), not ids. 10_handover §2.3 lists '산출물 내부 일관성' as a template 09 needed"
    instances: [B4, D4]
    status: candidate
  NEW-S8-intra-keyed:
    skill: S8
    name: keyed 1:1 mapping between two sections of one artifact
    compares: "artifact-internal: every element of section A has exactly one record in section B and B points only at A's elements; form keyed"
    nearest: "T-TR1b (keyed mapping between artifacts); same difference as NEW-S8-intra-set vs T-TR1 (inside one artifact)"
    instances: [D5]
    status: candidate
  NEW-S6-attested-record:
    skill: S6
    name: a recorded result carries a signature from a configured verifier over the exact run-bound subject
    compares: "artifact (evidence record + attestation) against run state (digests, revision, phase) and the configured public keys; form equal (signature verification over canonical bytes)"
    nearest: "T-RF1 (recorded result equals what was run). Differs in what fidelity is checked against: not the trace but a second party's signature bound to the run; the trace is never consulted"
    instances: [E6]
    status: candidate
  NEW-S2-carried-revision:
    skill: S2
    name: a value returned by the previous tool call is carried into the next mutating call (compare-and-set revision)
    compares: "trace against trace: the --expected-revision argument of each mutating call against the revision the previous response returned (equivalently the state file's revision); form equal, per call"
    nearest: "T-PG2 (re-run the tool after ticking) and T-TR2 (plan adherence) touch 'use the tool's output', but neither compares an argument value with a previous output. T-RF1 compares a record with the trace, not two calls"
    instances: [F1]
    status: candidate
  NEW-S2-idempotency-key:
    skill: S2
    name: one fresh key per distinct mutating request; a key reused only with an identical request
    compares: "trace-internal: the idempotency key of each mutating call against the (operation, payload) of every earlier call with the same key; form keyed"
    nearest: "NEW-S2-carried-revision (same protocol family) but keyed uniqueness rather than carried equality; T-FM3 uniqueness is artifact-internal, not across calls"
    instances: [F2]
    status: candidate
  NEW-S3-command-format:
    skill: S3
    name: a CLI command is invoked with the documented option set and value types
    compares: "trace: the argument vector of each CLI call against the documented option schema (required options present, no positional/unknown options, value types); form exists per call"
    nearest: "T-AW5 (run a CLI command inside a window) judges presence/absence of a command, not its argument form; 10_handover §2.3 lists '명령 형식' among the templates 09 needed"
    instances: [F4]
    status: candidate
