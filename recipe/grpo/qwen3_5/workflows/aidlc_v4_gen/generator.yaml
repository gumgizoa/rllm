# Generator config for aidlc_v4_gen: what the generator cannot read off aidlc_v4's documents.
#
# The agent sees aidlc_v4's files (docs/ at /ai-dlc, instruction.md, system-prompt.j2); this package
# only references them. Every decision below cites the line it rests on. Paths are relative to this
# package or to docs/ (they resolve to ../aidlc_v4/...).
workflow: aidlc_v4_gen
prefix: aidlc_gen

# Source ids used in the rubric (the abbreviations of notes/aidlc_instr.md).
ids:
  docs/core-workflow.md: CW
  docs/rule-details/01-reverse-engineering.md: RE
  docs/rule-details/02-requirements-analysis.md: RA
  docs/rule-details/03-code-generation-planning.md: CP
  docs/rule-details/04-code-generation-generation.md: CG
  docs/rule-details/05-build-and-test.md: BT
  ../aidlc_v4/instruction.md: INS
  ../aidlc_v4/system-prompt.j2: SP

roles:
  - docs/core-workflow.md: core
  - docs/rule-details/*.md: stage_rule

system_prompt:
  sections:
    PROBLEM_SOLVING_WORKFLOW: workflow
    "*": harness_generic

# AI-DLC's documents, instruction and system-prompt workflow section are the workflow's own text
# (byte-identical to the harbor originals, notes/aidlc_instr.md §0.2): no adapter text we wrote.
adapter_roles: [adapter]

precedence:
  - order: [stage_rule, core, "system_prompt:workflow", instruction, "system_prompt:harness_generic"]
    applies_to: all
    authority:
      path: docs/core-workflow.md
      lines: [22, 22]
      quote: "**Every stage ends by writing its result to a file**, in the format its rule detail file specifies"

classify:
  aidlc:
    # RE:47 / RA:42 / CP:35 / CG:54 / BT:64 "Replace only the bracketed text": a bracketed span is a
    # placeholder; unbracketed text is literal output. Requirement-tag brackets are legit syntax whose
    # words are literal ([satisfies R1, R3] in step headings, [R1] in Plan Execution lines).
    brackets: true
    placeholder: []
    legit:
      - '\[(?:satisfies\s+)?R\d+(?:,\s*R\d+)*\]'
    none_tokens: [none, "not applicable", "none stated"]

templates:
  - id: t1
    path: docs/rule-details/01-reverse-engineering.md
    block: {fence: markdown, index: 0}
    artifact: a1
    stage: reverse_engineering
    rules: aidlc
    binding:
      path: docs/rule-details/01-reverse-engineering.md
      lines: [47, 47]
      quote: Keep the frontmatter keys, the `##` headings, and the field prefixes exactly as given. Replace only the bracketed text.
  - id: t2
    path: docs/rule-details/02-requirements-analysis.md
    block: {fence: markdown, index: 0}
    artifact: a2
    stage: requirements_analysis
    rules: aidlc
    binding:
      path: docs/rule-details/02-requirements-analysis.md
      lines: [42, 42]
      quote: Keep the frontmatter keys, the `##` headings, and the `- Rn:` prefix exactly as given. Replace only the bracketed text.
  - id: t3
    path: docs/rule-details/03-code-generation-planning.md
    block: {fence: markdown, index: 0}
    artifact: a3
    stage: code_generation_planning
    rules: aidlc
    binding:
      path: docs/rule-details/03-code-generation-planning.md
      lines: [35, 35]
      quote: Keep the frontmatter keys, the `##` headings, the `### Step n [satisfies Rx]` step headings, and the field prefixes exactly as given. Replace only the bracketed text.
  - id: t4
    path: docs/rule-details/04-code-generation-generation.md
    block: {fence: markdown, index: 0}
    artifact: a4
    stage: code_generation_generation
    rules: aidlc
    binding:
      path: docs/rule-details/04-code-generation-generation.md
      lines: [54, 54]
      quote: Keep the frontmatter keys, the `##` headings, and the field prefixes exactly as given. Replace only the bracketed text.
  - id: t5
    path: docs/rule-details/05-build-and-test.md
    block: {fence: markdown, index: 0}
    artifact: a5
    stage: build_and_test
    rules: aidlc
    binding:
      path: docs/rule-details/05-build-and-test.md
      lines: [64, 64]
      quote: Keep the frontmatter keys, the `##` headings, and the field prefixes exactly as given. Replace only the bracketed text.

# Per-field none vocabularies from the template alternatives (DESIGN §5.2): RE:61 offers only
# "not applicable", RA:55 only "none stated"; every other "[... | none]" field offers "none".
none_vocab:
  "Build & Test Commands/Build": ["not applicable"]
  "Non-Functional Requirements/": ["none stated"]

# Template fields with no none alternative whose prose demands the content (DESIGN §5.2: "no" only where
# the source asks for content). The fields left silent ("unspecified") are the documented gaps: Created
# (no created file), Assumptions (RA:62), Existing Tests Path (no covering test, RE:65), Exercises.
content_required:
  - artifact: a1
    section: Affected Scope
    label: Files
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [19, 19], quote: "Record every path in full, from the repository root"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [74, 74], quote: "Affected scope identified, with full paths and owning module"}
  - artifact: a1
    section: Affected Scope
    label: Owning module
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [17, 17], quote: "Record the module or package that owns those files, and its boundary within the repository"}
  - artifact: a1
    section: Affected Scope
    label: Language/framework
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [18, 18], quote: "Note the language and framework in use"}
  - artifact: a3
    section: Reproduction Script
    label: Path
    sources:
      - {path: docs/rule-details/03-code-generation-planning.md, lines: [29, 29], quote: "Record the path where the script will be written"}
      - {path: docs/rule-details/03-code-generation-planning.md, lines: [92, 92], quote: "The reproduction script is planned, with its path recorded"}
  - artifact: a4
    section: Reproduction Script
    label: Path
    sources:
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [28, 28], quote: "Write the reproduction script at the path the plan records"}
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [68, 68], quote: "- Path: [full path as written, matching the planned path]"}
  - artifact: a5
    section: Final Change
    label: Files in the change
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [103, 103], quote: "Confirm the files in the change are exactly those Code Generation listed as modified or created"}

stage_model:
  fixed:
    roots:
      artifact: /tmp/swe-bench-pro
      code: "{WORKDIR}"
    stages:
      - id: reverse_engineering
        doc: docs/rule-details/01-reverse-engineering.md
        artifacts: [a1]
        order_artifact: a1
      - id: requirements_analysis
        doc: docs/rule-details/02-requirements-analysis.md
        artifacts: [a2]
        order_artifact: a2
        requires: [a1]
      - id: code_generation_planning
        doc: docs/rule-details/03-code-generation-planning.md
        artifacts: [a3]
        order_artifact: a3
        requires: [a1, a2]
      - id: code_generation_generation
        doc: docs/rule-details/04-code-generation-generation.md
        artifacts: [a4]
        order_artifact: a4
        requires: [a3]
      - id: build_and_test
        doc: docs/rule-details/05-build-and-test.md
        artifacts: [a5]
        order_artifact: a5
        requires: [a1, a4]
    artifacts:
      a1:
        locations: ["{artifact}/01-reverse-engineering.md"]
        template: docs/rule-details/01-reverse-engineering.md
        source:
          - {path: docs/core-workflow.md, lines: [24, 24], quote: "**Artifact path**: `/tmp/swe-bench-pro/` + the stage's rule detail filename. Stage 1 writes `/tmp/swe-bench-pro/01-reverse-engineering.md`"}
          - {path: docs/rule-details/01-reverse-engineering.md, lines: [45, 45], quote: "Write `/tmp/swe-bench-pro/01-reverse-engineering.md` in a single write, with the full content below"}
      a2:
        locations: ["{artifact}/02-requirements-analysis.md"]
        template: docs/rule-details/02-requirements-analysis.md
        source:
          - {path: docs/core-workflow.md, lines: [24, 24], quote: "**Artifact path**: `/tmp/swe-bench-pro/` + the stage's rule detail filename."}
          - {path: docs/rule-details/02-requirements-analysis.md, lines: [40, 40], quote: "Write `/tmp/swe-bench-pro/02-requirements-analysis.md` in a single write, with the full content below"}
      a3:
        locations: ["{artifact}/03-code-generation-planning.md"]
        template: docs/rule-details/03-code-generation-planning.md
        source:
          - {path: docs/core-workflow.md, lines: [24, 24], quote: "**Artifact path**: `/tmp/swe-bench-pro/` + the stage's rule detail filename."}
          - {path: docs/rule-details/03-code-generation-planning.md, lines: [33, 33], quote: "Write `/tmp/swe-bench-pro/03-code-generation-planning.md` in a single write, with the full content below"}
      a4:
        locations: ["{artifact}/04-code-generation-generation.md"]
        template: docs/rule-details/04-code-generation-generation.md
        source:
          - {path: docs/core-workflow.md, lines: [24, 24], quote: "**Artifact path**: `/tmp/swe-bench-pro/` + the stage's rule detail filename."}
          - {path: docs/rule-details/04-code-generation-generation.md, lines: [52, 52], quote: "Write `/tmp/swe-bench-pro/04-code-generation-generation.md` in a single write, with the full content below"}
      a5:
        locations: ["{artifact}/05-build-and-test.md"]
        template: docs/rule-details/05-build-and-test.md
        source:
          - {path: docs/core-workflow.md, lines: [24, 24], quote: "Stage 5 writes `/tmp/swe-bench-pro/05-build-and-test.md`"}
          - {path: docs/rule-details/05-build-and-test.md, lines: [62, 62], quote: "Write `/tmp/swe-bench-pro/05-build-and-test.md` in a single write, with the full content below"}

# DESIGN §9. Stage windows by document reads (CW:11 "Load that file as the first step of the stage").
scoring:
  item_weight: {must: 1.0, should: 0.25}
  stage: {formula: sigma_kappa}
  substantive_threshold: 0.5
  windows: reads
  signals: [order, process, "stage:*"]
  # The global items are mostly prohibitions and write rules (no install, no test edit, no rewrite) that
  # a run doing nothing satisfies: scaled by the mean stage score they govern the work instead of
  # crediting inaction (G9 frontmatter_stub: process 1.0 alone was 1/7 of the reward, 0.15 > 0.05).
  process_scale: stage_mean
  compliance: mean
  selftest:
    template_copy_stage_max: 0.10
    frontmatter_stub_compliance_max: 0.05
    x_fill_no_real_test_compliance_max: 0.50
    honest_golden_min: 0.95

# A missing artifact or a broken frontmatter zeroes its stage (the old reward's G1/G2); the
# execution-evidence gates are on the manual items below (cap 0.57 = the old S1/S5 cap, 4/7).
gates:
  # the final-state existence item (the stage model's, cited from CW:24); a stage_end existence item
  # (written within its stage, CW:22) stays a structure item
  "aidlc_v4_gen.*.artifact_exists": {zero_stage: true}
  frontmatter: {zero_stage: true}
  # an artifact still holding its template's bracketed placeholders is the template, not the stage's result
  # ("Replace only the bracketed text", RE:47 / RA:42 / CP:35 / CG:54 / BT:64); DESIGN §9 template_copy_stage_max 0.10.
  # On the step24 runs no written artifact keeps a placeholder (every residue failure is an absent artifact).
  "aidlc_v4_gen.*.no_template_residue": {cap_stage: 0.1}

llm:
  backend: claude-cli
  model: claude-opus-5-5
  claude_bin: /home/gwan7801/.vscode-server/extensions/anthropic.claude-code-2.1.283-linux-x64/resources/native-binary/claude
  samples: 2
  batch: 16
  chunk_lines: 80
  max_rounds: 3
  max_budget_usd: 3.0
  max_total_usd: 18.0  # the run's cap (20 USD) less what the calls in flight (parallel x max per call) can add
  parallel: 4
  timeout: 900

# Extracted (G5) items dropped on review. Each names the G4 statement it came from (gen-work/statements.jsonl).
exclude:
  - {statement: cw-011, kind: aidlc.executed, reason: "mkdir before the first write: the editor creates the directory itself, and a mkdir in the same call as the write falls outside the window"}
  - {statement: cw-012, kind: cross_ref, reason: "CW:24 explains why artifacts cannot reach the diff (they sit outside the repository); it asks nothing of the agent"}
  - {statement: cw-044, kind: item_format, reason: "an R-id line required under each category, Non-Functional included, which RA:55 allows to be 'none stated'; the FR/Edge id lines are compiled from the template"}
  - {statement: cw-045, kind: item_format, reason: "replaced by the manual id-sequence item (its pattern also hit prose lines starting with an R id, e.g. Assumptions)"}
  - {statement: cw-049, kind: item_format, reason: "replaced by the manual id-uniqueness item (same pattern problem as cw-045)"}
  - {statement: ra-009, kind: item_format, reason: "'some R id somewhere' is implied by the template's id-line items"}
  - {statement: ra-012, kind: item_format, reason: "replaced by the manual id-sequence item (pattern without the ':' of '- Rn:' hits prose lines)"}
  - {statement: ra-013, kind: item_format, reason: "replaced by the manual id-uniqueness item"}
  - {statement: ra-029, kind: item_format, reason: "replaced by the manual id-uniqueness item"}
  - {statement: ra-019, kind: item_format, reason: "requires an '- Rn:' line under Non-Functional Requirements, which RA:55 allows to be 'none stated'"}
  - {statement: ra-026, kind: item_format, reason: "duplicates the template's Functional Requirements id-line item", merge_into: template}
  - {statement: cw-055, kind: item_format, reason: "any line starting with a number inside Plan; cp-006 checks the step headings' sequence exactly", merge_into: cp-006}
  - {statement: cp-037, kind: item_format, reason: "duplicates cp-006 (step heading sequence)", merge_into: cp-006}
  - {statement: cw-060, kind: item_format, reason: "'an R id in Plan' is implied by the step-heading tag format (cp-022)", merge_into: cp-022}
  - {statement: cp-008, kind: item_format, reason: "duplicates the template's Target-line shape item", merge_into: template}
  - {statement: cp-035, kind: item_format, reason: "duplicates cp-022 (step headings carry [satisfies Rn])", merge_into: cp-022}
  - {statement: cp-014, kind: cross_ref, reason: "duplicates cw-060's tags-subset-of-A2-ids cross_ref (and reads only the first tag of each heading)", merge_into: cw-060}
  - {statement: cw-064, kind: cross_ref, reason: "every A2 id incl. a '- R3: none stated' line must appear in the plan: one reading of a documented ambiguity (RA:55 vs CP:67/86, aidlc_instr #2); replaced by the manual items that accept both"}
  - {statement: cp-026, kind: cross_ref, reason: "same as cw-064 for Requirement Coverage; replaced by the manual coverage item"}
  - {statement: cp-036, kind: cross_ref, reason: "same as cw-064"}
  - {statement: cp-005, kind: cross_ref, reason: "same as cw-064"}
  - {statement: cg-034, kind: cross_ref, reason: "same as cw-064 for Plan Execution (A2 ids incl. 'none stated'); the manual PE-tags == A3-tags item carries it"}
  - {statement: cp-018, kind: field_type, reason: "CP:29 asks only that the path be recorded; the reproduction script may live outside the repository (BT:106), where repo_path can never hold"}
  - {statement: cg-015, kind: cross_ref, stage: code_generation_generation, reason: "the planned repro path must be a repository write: false for a script under /tmp (BT:106 expects it outside the repo)"}
  - {statement: cp-029, kind: cross_ref, reason: "stage-4 edits only to planned targets: CG:34-37 allows recorded deviations; the Deviations none predicate checks the consistent reading"}
  - {statement: cg-043, kind: cross_ref, reason: "whether the repro script is listed under Created is a documented ambiguity (aidlc_instr #8; BT:102/106 vs BT:103): both readings allowed"}
  - {statement: bt-019, kind: cross_ref, reason: "Regressions values are 'id -> cause -> fix' lines: field_list compares whole lines, so a correct entry never equals an A1 id"}
  - {statement: bt-026, kind: cross_ref, reason: "same as bt-019 for Pre-existing failures ('id -> reasoning'); the manual test_id item checks the id against the baseline run"}
  - {statement: cw-040, kind: cross_ref, reason: "same as bt-026"}
  - {statement: bt-027, kind: cross_ref, reason: "the template value is the literal 'none' (BT:95): ['none'] never equals the empty set of diff test paths; the literal's refuted_by covers it"}
  - {statement: bt-045, kind: cross_ref, reason: "same as bt-027"}
  - {statement: re-017, kind: field_filled, reason: "Contract sits after the em dash on the Path line (RE:65), not in sub-blocks: the item fails every artifact; the Path line's shape item checks '— Contract:'"}
  - {statement: re-027, kind: label_present, reason: "same as re-017: 'Contract' is not a line-leading label"}
  - {statement: cw-072, kind: cross_ref, reason: "duplicates cg-042 (A4 Modified paths existed at BASE_SHA)", merge_into: cg-042}
  - {statement: cw-100, kind: cross_ref, reason: "duplicates bt-044 (Files in the change vs the diff)", merge_into: bt-044}
  - {statement: cg-033, kind: cross_ref, reason: "duplicates cg-026 (Plan Execution step numbers cover the plan's)", merge_into: cg-026}
  - {statement: bt-005, kind: cross_ref, reason: "string equality of A5 Command and A1 Test is stricter than 'the same selection' (BT:36, BT:81): output flags may differ; the same-selection re-run item compares the selected tests"}
  # FIX2 review of the regeneration with the extended vocabulary (2026-10-12): duplicates of reviewed manual items, and broken readings
  - {statement: re-017, kind: aidlc.executed, reason: "duplicates the manual read_tests item (RE:35: every Existing Tests Path read before A1 is written)"}
  - {statement: cp-032, kind: cross_ref, reason: "the same check as cp-048 (no plan Target is a test file in the change, CP:93) without allow_empty", merge_into: cp-048}
  - {statement: cw-065, kind: cross_ref, reason: "the same check as cp-048 (normalize placed on the selectors)", merge_into: cp-048}
  - {statement: cp-043, kind: cross_ref, reason: "the id pattern [A-Z]+-\\d+ matches no AI-DLC id (R1, RA:20): the left side is always empty; the manual coverage items carry CP:90"}
  - {statement: cg-014, kind: cross_ref, reason: "duplicates the manual plan_execution_tags item (step and tags as pairs, DESIGN §8)"}
  - {statement: cw-069, kind: cross_ref, reason: "duplicates the manual repro_path item (A4 Path == A3 Path, CG:68)"}
  - {statement: cg-010, kind: prohibited_action, reason: "duplicates the global duplicate_variant prohibition (CW:146, CG:23)"}
  - {statement: cg-036, kind: aidlc.executed, reason: "duplicates the manual repro_written item (the A3 / A4 path written between the plan and A4)"}
  - {statement: bt-055, kind: cross_ref, reason: "compares the untracked files with the whole 'Files in the change' value as one string (a field, not a field list): fails every change of two files; the Unintended literal and repro_not_left carry BT:102-113"}
  - {statement: bt-047, kind: cross_ref, reason: "duplicates the manual repro_not_left item (the reproduction script not left in the repository, BT:102/106) online only"}
  - {statement: cw-090, kind: aidlc.executed, reason: "duplicates the manual Stage-5 sequence item (CW:124 build -> reproduce -> re-run)"}
  - {statement: cw-022, kind: cross_ref, reason: "duplicates the manual coverage_ids item (Coverage ids are A2 ids, CW:42 / CP:67)"}
  - {statement: bt-043, kind: cross_ref, reason: "every untracked file must be an A4 Created path: contradicts the documented readings that the reproduction script need not be listed under Created (#8) and that Stage-5 fixes need not be in A4 (#9); a file left behind is the Unintended literal's and repro_not_left's (BT:102-106)"}
  - {statement: cw-031, kind: exec_evidence, reason: "a valid run of A1's Test command before the first source edit duplicates the manual test_run item (the recorded Test is the command of a valid baseline run); scored twice it doubles one miss in Stage 1"}

# Items the extraction did not yield (or yielded in a form that is wrong or too weak): DESIGN §8.
# Each replaces compiled / extracted items on the same subject (compile._precedence / _supersede).
manual:
  # ============================================================== global
  - id: aidlc_v4_gen.global.run.doc_read_first.cw
    stage: global
    class: evidence
    requirement: must
    check: {kind: doc_read_first, params: {doc: CW}}
    availability: [trace]
    modality_evidence: "imperative (SP:64 'before taking any other action'; INS:3 'first')"
    sources:
      - {path: ../aidlc_v4/system-prompt.j2, lines: [64, 64], quote: "Read /ai-dlc/core-workflow.md before taking any other action on the task."}
      - {path: ../aidlc_v4/instruction.md, lines: [3, 3], quote: "Read /ai-dlc/core-workflow.md first."}
  - id: aidlc_v4_gen.global.run.order.stages
    stage: global
    class: evidence
    requirement: must
    check:
      kind: order
      params:
        chain: ["read:RE", "write:a1", "read:RA", "write:a2", "read:CP", "write:a3", "read:CG", "write:a4", "read:BT", "write:a5"]
        invalidate: [read_ahead, multi_read, rewrite]
    availability: [trace]
    modality_evidence: "CW:7 'always executes, in order'; CW:18 'Do NOT read ... until'; CW:28-29 one write, never rewrite; SP:68-69"
    sources:
      - {path: docs/core-workflow.md, lines: [7, 7], quote: "Every stage always executes, in order."}
      - {path: docs/core-workflow.md, lines: [18, 18], quote: "Do NOT read a stage's rule detail file until the previous stage's Completion Criteria are met."}
      - {path: docs/core-workflow.md, lines: [28, 29], quote: "One write, full content, at the end of the stage ... Never rewrite an earlier stage's artifact."}
      - {path: ../aidlc_v4/system-prompt.j2, lines: [68, 69], quote: "Load one rule detail file at a time, immediately before its stage. Do not read ahead to a later stage's rule detail file."}
    note: "rule detail read, then its artifact written, stage by stage; a read ahead of the previous artifact, a multi-document read and a rewritten artifact void their pair"
  - id: aidlc_v4_gen.global.run.prohibited_action.install
    stage: global
    class: evidence
    requirement: must
    check: {kind: prohibited_action, params: {action: install}}
    availability: [trace]
    modality_evidence: "prohibition (CW:134 'Do not', BT:20 'Do NOT'); SP:157-162 (install) yields to the workflow (conflict recorded)"
    sources:
      - {path: docs/core-workflow.md, lines: [134, 134], quote: "Do not spend effort on environment setup"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [20, 20], quote: "**Do NOT** install dependencies or set up the environment"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [30, 30], quote: "**Do NOT** plan dependency installation or environment setup"}
  - id: aidlc_v4_gen.global.run.prohibited_action.test_file_write
    stage: global
    class: evidence
    requirement: must
    check: {kind: prohibited_action, params: {action: test_file_write, pattern: '(?:^|/)tests?/'}}
    availability: [trace]
    modality_evidence: "prohibition (CW:141 'DO NOT MODIFY', CG:30 'MANDATORY — do not')"
    sources:
      - {path: docs/core-workflow.md, lines: [141, 142], quote: "**DO NOT MODIFY**: test files ... Existing tests are **read and executed**, never edited."}
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [30, 30], quote: "do not modify test files."}
      - {path: docs/rule-details/05-build-and-test.md, lines: [53, 53], quote: "Correct the source code, never the tests"}
    note: "existing tests = test files at BASE_SHA under a test/ or tests/ directory (a package's own test framework, django/test/ or sympy/testing/, is library code); a file the run adds is no edit of the tests (it is judged as part of the change, BT:104), and a repro script named test_*.py elsewhere is not one"
  - id: aidlc_v4_gen.global.run.prohibited_action.duplicate_variant
    stage: global
    class: evidence
    requirement: must
    check: {kind: prohibited_action, params: {action: repo_write, pattern: '_(?:new|modified)\.[A-Za-z]+$'}}
    availability: [trace]
    modality_evidence: "prohibition (CW:146 'Never create')"
    sources:
      - {path: docs/core-workflow.md, lines: [146, 146], quote: "Never create a duplicate variant such as `module_new.py` or `ClassName_modified.java`"}
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [23, 23], quote: "Never create `module_new.py`, `ClassName_modified.java`, or any similar duplicate"}
    note: "the documents' own two suffixes only (a minimal pattern; 'any similar duplicate' is not decidable)"
  - id: aidlc_v4_gen.global.run.prohibited_action.edit_before_generation
    stage: global
    class: evidence
