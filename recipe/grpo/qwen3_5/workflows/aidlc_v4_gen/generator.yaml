      - {path: docs/core-workflow.md, lines: [158, 158], quote: "Failures judged to be pre-existing rather than caused by the patch, with the reasoning — Stage 5"}
    note: "'none' only if the Verdict does not claim pre-existing failures and either the baseline had none or the last Stage-5 run has no failure"
  - id: aidlc_v4_gen.build_and_test.a5.field_type.pre_existing_ids
    stage: build_and_test
    target: {type: artifact, ref: a5}
    class: content
    requirement: must
    check:
      kind: field_type
      params:
        section: Existing Tests vs Baseline
        label: Pre-existing failures
        type: failed_test_id
        run_kind: test
        window: ["stage_start:reverse_engineering", [*first_source_edit, "end"]]
        listed_in: {field_list: {artifact: a1, section: Baseline, label: Failing}}
    modality_evidence: "BT:49 'Existing test failure that also failed in the baseline' (anchored on the baseline run, or on A1's Failing which its own items anchor)"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [49, 49], quote: "**Existing test failure that also failed in the baseline**"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [84, 84], quote: "- Pre-existing failures: [none | test id -> the reasoning that identifies it as pre-existing]"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [70, 70], quote: "- Failing: [test id, one per line | none]"}
    note: "each id listed is a baseline failure: A1 Failing lists it, or a valid baseline run (before the first source modification) reports it failed or errored -- a test that passed at baseline is a regression, not pre-existing"
  - id: aidlc_v4_gen.build_and_test.a5.field_filled.fixes
    stage: build_and_test
    target: {type: artifact, ref: a5}
    class: content
    requirement: must
    check: {kind: field_filled, params: {section: Fixes Applied, none_vocab: [none]}}
    none_allowed:
      if:
        absent:
          fact: repo_edit
          window: ["write:a4", "end"]
          final: true
          paths_not_in: {field: {artifact: a4, section: Reproduction Script, label: Path}, normalize: path}
    modality_evidence: "imperative (BT:55 'Record what was changed and why'); template BT:87 offers none"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [87, 87], quote: "- [none | what changed and why]"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [55, 55], quote: "Record what was changed and why"}
    note: "'none' only when no file of the final change was edited after the Stage-4 artifact (the reproduction script, and scratch files written and removed again, excepted: BT:55 records source changes, BT:102 the cleanup)"
  - id: aidlc_v4_gen.build_and_test.a5.field_filled.outstanding
    stage: build_and_test
    target: {type: artifact, ref: a5}
    class: content
    requirement: must
    check: {kind: field_filled, params: {section: Outstanding Failures, none_vocab: [none]}}
    none_allowed:
      if:
        not:
          any:
            - {field_matches: {artifact: a5, section: Build, label: Result, pattern: '^\W*fail'}}
            - {field_matches: {artifact: a5, section: Reproduction Script, label: Result, pattern: '^\W*fail'}}
            - all:
                - {field_present: {artifact: a5, section: Reproduction Script, label: Unmet requirements}}
                - {not: {field_is_none: {artifact: a5, section: Reproduction Script, label: Unmet requirements}}}
            # any valid Stage-5 run (not only the last: a narrowed clean re-run hides nothing) with a failing test that
            # neither the baseline (A1 Failing: pre-existing, conflict #20) nor A5's Regressions / Pre-existing failures record
            - counts:
                fact: valid_run
                kind: test
                window: "stage:build_and_test"
                which: any
                failures_not_in:
                  - {field_list: {artifact: a1, section: Baseline, label: Failing}}
                  - {field_list: {artifact: a5, section: Existing Tests vs Baseline, label: Regressions}}
                  - {field_list: {artifact: a5, section: Existing Tests vs Baseline, label: Pre-existing failures}}
    modality_evidence: "BT:98 'it is never left as `none` to make the run look clean'; CW:40; MANDATORY (BT:56)"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [90, 90], quote: "- [none | what remains, and why it was not resolved]"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [98, 98], quote: "it is never left as `none` to make the run look clean."}
      - {path: docs/core-workflow.md, lines: [40, 40], quote: "Unresolved work goes under Outstanding Failures in the Stage 5 artifact, and nowhere else."}
      - {path: docs/rule-details/05-build-and-test.md, lines: [56, 56], quote: "write the artifact with the outstanding failures and stop"}
    note: "'none' contradicts a failed build, a failed reproduction, unmet requirements, or a failure in any valid Stage-5 run that is recorded nowhere (not a baseline failure, a regression or a pre-existing failure)"
  - id: aidlc_v4_gen.build_and_test.a5.field_literal.test_files_in_change
    stage: build_and_test
    target: {type: artifact, ref: a5}
    class: structure
    requirement: must
    check:
      kind: field_literal
      params:
        section: Final Change
        label: Test files in the change
        text: none
        refuted_by: {not: {relation: {left: {fact: diff_test_paths}, right: {literal: []}, rel: subset}}}
    modality_evidence: "template literal (BT:64 'exactly as given'); BT:104"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [95, 95], quote: "- Test files in the change: none"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [104, 104], quote: "Confirm no test file appears in the change"}
    note: "refuted by a test path in the final diff (online; offline the literal alone is checked)"
  - id: aidlc_v4_gen.build_and_test.a5.field_literal.unintended_files
    stage: build_and_test
    target: {type: artifact, ref: a5}
    class: structure
    requirement: must
    check:
      kind: field_literal
      params:
        section: Final Change
        label: Unintended files in the repository
        text: none
        refuted_by:
          any:
            - not:
                relation:
                  left: {fact: untracked_paths}
                  right: {ids: {artifact: a5, section: Final Change, pattern: '/?(?:[\w.-]+/)*[\w.-]+\.[A-Za-z]\w*'}, normalize: path}
                  rel: subset
            # the reproduction script left inside the repository is the unintended file BT:106 names, listed or not
            - {relation: {left: {field: {artifact: a3, section: Reproduction Script, label: Path}, normalize: path}, right: {fact: untracked_paths}, rel: intersects}}
            - {relation: {left: {field: {artifact: a4, section: Reproduction Script, label: Path}, normalize: path}, right: {fact: untracked_paths}, rel: intersects}}
    modality_evidence: "template literal (BT:64 'exactly as given'); MANDATORY (BT:102)"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [94, 94], quote: "- Unintended files in the repository: none"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [102, 102], quote: "Confirm no unintended file is part of the change — no temporary script, scratch file, or debug output inside the repository"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [106, 106], quote: "The reproduction script can, if it was written inside the repository — that is what this step exists to catch."}
    note: "refuted by an untracked file left in the repository that the Final Change does not declare (new source files listed there are part of the change; build/test byproducts aside), and by the reproduction script (A3 / A4 Path) left inside the repository even when listed (BT:106); offline the untracked files are the replay's (created and not removed)"
  - id: aidlc_v4_gen.build_and_test.run.cross_ref.repro_not_left
    stage: build_and_test
    class: evidence
    requirement: must
    check:
      kind: cross_ref
      params:
        left: {field: {artifact: a4, section: Reproduction Script, label: Path}}
        right: {fact: untracked_paths}
        relation: disjoint
        normalize: path
    availability: [trace]
    modality_evidence: "MANDATORY (BT:102 'no temporary script ... inside the repository'); BT:106 names the reproduction script; BT:113 Completion Criteria"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [102, 102], quote: "**MANDATORY**: Confirm no unintended file is part of the change — no temporary script, scratch file, or debug output inside the repository"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [106, 106], quote: "The reproduction script can, if it was written inside the repository — that is what this step exists to catch."}
      - {path: docs/rule-details/05-build-and-test.md, lines: [113, 113], quote: "Repository contains no unintended file, and no test file was modified"}
    applies_when: {field_present: {artifact: a4, section: Reproduction Script, label: Path}}
    note: "the reproduction script A4 records is not left in the repository at the end: written outside it (/tmp, BT:106) or removed (online the untracked files, offline the replay's created-and-not-removed files)"

# Contradictions and gaps the documents leave (notes/aidlc_instr.md §5), and how the rubric reads them (P3:
# both readings where expressible; a value set the template fixes is not relaxed; the workflow over the
# system prompt's generic sections, CW:3 / SP:61-62).
conflicts:
  - description: "Stage 1 allows 'Build: not applicable' (RE:61), Stage 5 always runs the recorded build and has only success|failure (BT:17, BT:73) (#3)"
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [61, 61], quote: "- Build: [verbatim build or type-check command | not applicable]"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [17, 17], quote: "Run the build or type-check command Reverse Engineering recorded"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [73, 73], quote: "- Result: [success | failure]"}
    resolution: "build items apply only when A1 records a command: the Stage-5 build run and A5 Build Command are not applicable for a none value, the Build Result enum and the build step of the Stage-5 sequence are conditional on it"
  - description: "'- R3: [... otherwise \"none stated\"]' may consume an id (RA:55) that Coverage must then account for (CP:67, CP:86); the CP example omits R3 (#2)"
    sources:
      - {path: docs/rule-details/02-requirements-analysis.md, lines: [55, 55], quote: "- R3: [statement, only if stated in the task description; otherwise \"none stated\"]"}
      - {path: docs/rule-details/03-code-generation-planning.md, lines: [67, 67], quote: "it must account for every identifier that artifact defines."}
    resolution: "Coverage and step tags must include every A2 id that states a requirement; an id whose value is 'none stated' may be listed or not"
  - description: "Whether the reproduction script is listed under A4 Created (CG:65, BT:103) when it must not remain in the repository (BT:102, BT:106) (#8)"
    sources:
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [65, 65], quote: "- Created: [full path] [requirement tags]"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [106, 106], quote: "The reproduction script can, if it was written inside the repository — that is what this step exists to catch."}
    resolution: "both readings: the changed-files item counts the reproduction script's recorded Path as listed; no item requires it under Created"
  - description: "Stage-5 fixes may touch files Stage 4 did not list (BT:51-55) while the change must be exactly A4's Modified + Created (BT:103) (#9)"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [53, 55], quote: "Correct the source code, never the tests ... Record what was changed and why"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [103, 103], quote: "Confirm the files in the change are exactly those Code Generation listed as modified or created"}
    resolution: "the changed-files item checks the repository writes up to the Stage-4 artifact; Stage-5 edits are recorded under Fixes Applied (its none predicate)"
  - description: "Step 7 (confirm the final change) comes after Step 6 writes the artifact, which may not be rewritten (BT:60-106, CW:28-29) (#1)"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [100, 102], quote: "### Step 7: Confirm the Final Change ... Confirm no unintended file is part of the change"}
      - {path: docs/core-workflow.md, lines: [28, 28], quote: "One write, full content, at the end of the stage"}
    resolution: "the Final Change literals are judged against the repository at the end of the run (online refutation); write once still holds"
  - description: "Verdict has no value for an unresolved regression and 'unchanged' overlaps 'pre-existing failures only' (BT:82, BT:56, BT:98) (#4)"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [82, 82], quote: "- Verdict: [unchanged | regression resolved | pre-existing failures only]"}
    resolution: "the template enum is kept (P3 does not relax it); only the implications the value names hold one way: 'regression resolved' -> Regressions not none, 'pre-existing failures only' -> Pre-existing failures not none"
  - description: "'Unresolved work goes under Outstanding Failures ... and nowhere else' (CW:40, BT:98) while Unmet requirements and Regressions also record it (BT:78, BT:83) (#5)"
    sources:
      - {path: docs/core-workflow.md, lines: [40, 40], quote: "Unresolved work goes under Outstanding Failures in the Stage 5 artifact, and nowhere else."}
      - {path: docs/rule-details/05-build-and-test.md, lines: [78, 78], quote: "- Unmet requirements: [none | which requirement is unmet and how it fails]"}
    resolution: "Outstanding Failures may not be none when the build or reproduction failed, requirements are unmet, or the last Stage-5 run shows failures the baseline did not have"
  - description: "The generic system prompt asks to keep AGENTS.md in the repository (SP:11-12) and to install missing dependencies (SP:157-162); the workflow forbids unintended files and environment setup (BT:102, CW:134)"
    sources:
      - {path: ../aidlc_v4/system-prompt.j2, lines: [11, 11], quote: "Use `AGENTS.md` under the repository root as your persistent memory"}
      - {path: ../aidlc_v4/system-prompt.j2, lines: [157, 157], quote: "please install the application and run the command again."}
      - {path: docs/core-workflow.md, lines: [134, 134], quote: "Do not spend effort on environment setup"}
    resolution: "the workflow wins (CW:3, SP:61-62): installs are prohibited; an AGENTS.md written in the repository counts as an unlisted repository write / unintended file"
  - description: "The generic system prompt asks to confirm a new plan with the user (SP:171) and to combine commands (SP:18); the workflow forbids user interaction (CW:132) and loads one document at a time (CW:18)"
    sources:
      - {path: ../aidlc_v4/system-prompt.j2, lines: [171, 171], quote: "propose a new plan and confirm with the user before proceeding."}
      - {path: ../aidlc_v4/system-prompt.j2, lines: [18, 18], quote: "combine multiple actions into a single action"}
      - {path: docs/core-workflow.md, lines: [132, 132], quote: "Never generate a question file, never ask for approval, never wait for input."}
    resolution: "the workflow wins: no item rewards asking; a step that reads several stage documents does not count as reading any of them"
  - description: "The template's Build and Reproduction results allow failure|fail (BT:73, BT:77) while the Completion Criteria require 'Build succeeds' and a resolved reproduction (BT:109-110) (#6)"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [73, 73], quote: "- Result: [success | failure]"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [109, 110], quote: "Build succeeds ... Reproduction script demonstrates the issue is resolved"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [56, 56], quote: "write the artifact with the outstanding failures and stop"}
    resolution: "both readings: the enums keep failure|fail (a failed run that stops per BT:56 still writes an honest artifact), and a failure must then be named under Outstanding Failures (its none predicate)"
  - description: "Three requirement-tag notations: '[satisfies R2, R4]' (CP:45, CP:51), '[R2, R4]' (CG:72-73) and '[requirement tags]' (CG:63-65) (#7)"
    sources:
      - {path: docs/rule-details/03-code-generation-planning.md, lines: [51, 51], quote: "### Step 2 [satisfies R2, R4]"}
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [73, 73], quote: "- Step 2 [R2, R4]: complete"}
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [63, 63], quote: "- Modified: [full path] [requirement tags]"}
    resolution: "each artifact's own notation; the tag cross-references read the ids inside any '[... Rn, Rm]' bracket, so plan and execution tags compare whatever notation each used"
  - description: "'complete' is the only Plan Execution status the template shows (CG:72-73) while a structural invalidation supersedes steps (CG:37) (#10)"
    sources:
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [72, 72], quote: "- Step 1 [R1]: complete"}
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [37, 37], quote: "State which steps are invalidated, why, and what supersedes them"}
    resolution: "the template literal is kept (P3 does not relax a value the template fixes): a superseded step is recorded under Deviations from Plan ('structural invalidation: ...', CG:76), not as another status"
  - description: "Paths 'in full, from the repository root' (RE:19, CP:77) vs 'full paths' (CW:42, CG:63): repo-relative or absolute; the reproduction script may sit outside the repository (#11)"
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [19, 19], quote: "Record every path in full, from the repository root"}
      - {path: docs/core-workflow.md, lines: [42, 42], quote: "Quote identifiers — `R1`, step numbers, full paths — verbatim"}
    resolution: "both readings: every path comparison normalises a path to repository-relative (the workdir prefix and /testbed/ stripped), and a path outside the repository (/tmp/...) is kept absolute"
  - description: "'one per line' under a single '- Files:' / '- Passing:' prefix (RE:56, RE:69-70): the multi-line layout is not specified (#12)"
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [56, 56], quote: "- Files: [full paths from the repository root, one per line]"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [69, 69], quote: "- Passing: [test id, one per line | none]"}
    resolution: "every layout is read: the value on the label line, nested bullets and continuation lines under it, and comma / semicolon lists"
  - description: "'both Step 2 and Step 3 passed' (BT:43) is undefined when the baseline already had failures that keep failing (#20)"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [43, 43], quote: "If the build succeeded and both Step 2 and Step 3 passed, nothing has failed"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [49, 49], quote: "**Existing test failure that also failed in the baseline**"}
    resolution: "a failure is judged against the baseline only one way: Outstanding Failures may not be none when the baseline had no failure and the last Stage-5 run has one; a pre-existing failure may be recorded or the run counted as passed"
  - description: "The generic system prompt asks to 'first thoroughly understand the codebase through exploration' (SP:38); the workflow forbids surveying beyond the identified files (RE:21) (#24)"
    sources:
      - {path: ../aidlc_v4/system-prompt.j2, lines: [38, 38], quote: "Before implementing any changes, first thoroughly understand the codebase through exploration."}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [21, 21], quote: "**Do NOT** enumerate packages unrelated to the issue, or survey the repository beyond the files identified above."}
    resolution: "the workflow wins (CW:3); RE:21 is not itemized (what counts as unrelated is not decidable from the trace), so no item rewards or penalizes exploration"
  - description: "The A4 skeleton has one example line per changed file (CG:63-65); nothing says what to write when no file was created (gap)"
    sources:
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [65, 65], quote: "- Created: [full path] [requirement tags]"}
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [89, 89], quote: "listing modified and created files and any deviation from the plan"}
    resolution: "both readings: the Created label and value are required only when the run created a repository file of the final change (the reproduction script aside); otherwise an omitted line or 'Created: none' passes"
  - description: "Temporary files: BT:102 and BT:106 require no scratch file to remain in the repository, while A4 lists the files generation created (CG:89) and Fixes Applied records Stage-5 changes (BT:55)"
    sources:
      - {path: docs/rule-details/05-build-and-test.md, lines: [102, 102], quote: "Confirm no unintended file is part of the change — no temporary script, scratch file, or debug output inside the repository"}
      - {path: docs/rule-details/05-build-and-test.md, lines: [55, 55], quote: "Record what was changed and why"}
    resolution: "listing, fixes and deviations are judged on the final change: a file written and removed again by the run need not be listed, is no fix and no deviation; one left behind is an unintended file"
  - description: "Where Stage 4 ends: the stage window runs to reading BT (CW:11), while 'Every stage ends by writing its result to a file' (CW:22)"
    sources:
      - {path: docs/core-workflow.md, lines: [22, 22], quote: "**Every stage ends by writing its result to a file**"}
      - {path: docs/rule-details/04-code-generation-generation.md, lines: [28, 28], quote: "**do not execute it in this stage**"}
    resolution: "the A4 'Executed: no' line and the Stage-4 no-execution rule are judged up to the A4 write (what the line states when written); an execution between the A4 write and reading BT is not Stage 4's -- the Stage-5 order items judge it"
  - description: "No guidance when no covering tests exist (RE:65) and no none alternative for Assumptions (RA:62) (#13, #14)"
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [65, 65], quote: "- Path: [full path] — Contract: [signatures, return shapes, raised errors it enforces]"}
      - {path: docs/rule-details/02-requirements-analysis.md, lines: [62, 62], quote: "- [any ambiguity resolved by decision, with the reasoning]"}
    resolution: "a none value is accepted there (unspecified); the baseline run is still required (CW:79 is MANDATORY)"
