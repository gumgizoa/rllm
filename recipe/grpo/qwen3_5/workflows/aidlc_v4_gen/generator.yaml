  # ============================================================== stage 1: the baseline (CW:79, RE:36-37, RE:69-70)
  - id: aidlc_v4_gen.reverse_engineering.run.exec_evidence.baseline
    stage: reverse_engineering
    class: evidence
    requirement: must
    check:
      kind: exec_evidence
      params:
        kind: test
        # the first source modification (CW:79): the first edit of a file that existed at BASE_SHA -- creating a file (a
        # scratch or reproduction script) modifies no source, nor does writing the reproduction script's path; no edit at all:
        # open to the end of the run (UNKNOWN when the diff shows a base file changed outside the trace: fail safe)
        window:
          - "stage_start:reverse_engineering"
          - - &first_source_edit
              first:
                fact: repo_edit
                created: false
                paths_not_in:
                  - {field: {artifact: a3, section: Reproduction Script, label: Path}, normalize: path}
                  - {field: {artifact: a4, section: Reproduction Script, label: Path}, normalize: path}
            - "end"
    gate: {cap_stage: 0.57}
    availability: [trace]
    modality_evidence: "MANDATORY (CW:79, RE:36)"
    sources:
      - {path: docs/core-workflow.md, lines: [79, 79], quote: "Record the baseline pass/fail state by executing those tests **before any source file is modified**"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [36, 36], quote: "Execute those tests once, **before any source file is modified**"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [34, 34], quote: "Locate the existing tests that cover the affected scope"}
    note: "a valid run of tests that exist in the base repository, after reading the stage document and before the first source modification (an edit of a base file; new files and the reproduction script are none; without any, to the end); a gate (cap 0.57, the old S1 cap)"
  - id: aidlc_v4_gen.reverse_engineering.a1.field_type.test_run
    stage: reverse_engineering
    target: {type: artifact, ref: a1}
    class: content
    requirement: must
    check: {kind: field_type, params: {section: Build & Test Commands, label: Test, type: command_run, run_kind: test, window: ["stage_start:reverse_engineering", [*first_source_edit, "end"]]}}
    modality_evidence: "template 'verbatim targeted test command' (RE:62) for the tests RE:36 makes MANDATORY to execute before any edit"
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [62, 62], quote: "- Test: [verbatim targeted test command for the covering tests]"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [36, 36], quote: "Execute those tests once, **before any source file is modified**"}
      - {path: docs/core-workflow.md, lines: [79, 79], quote: "Record the baseline pass/fail state by executing those tests **before any source file is modified**"}
    note: "the recorded Test command is the command of a valid test run (the baseline) before the first source modification; spellings of one invocation compare equal (python -m pytest / pytest, /testbed/ paths, timeout / env wrappers), other flags do not (RE:62 'verbatim')"
  - id: aidlc_v4_gen.reverse_engineering.a1.field_type.test_selection
    stage: reverse_engineering
    target: {type: artifact, ref: a1}
    class: content
    requirement: must
    check: {kind: field_type, params: {section: Build & Test Commands, label: Test, type: test_selection}}
    modality_evidence: "imperative (RE:27 'Express the test command so that it can target ... not the whole suite'); template 'targeted' (RE:62)"
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [27, 27], quote: "Express the test command so that it can target **the tests covering the affected scope**, not the whole suite"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [62, 62], quote: "- Test: [verbatim targeted test command for the covering tests]"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [75, 75], quote: "Build/type-check command and a targeted test command known"}
    note: "the recorded Test command selects tests (paths, node ids, labels, a -k/-m/--tag filter, or a subdirectory cwd), not the bare runner"
  - id: aidlc_v4_gen.reverse_engineering.run.aidlc_executed.read_tests
    stage: reverse_engineering
    class: evidence
    requirement: must
    check:
      kind: aidlc.executed
      params:
        window: ["start", "write:a1"]
        steps:
          - {read_of: {ids: {artifact: a1, section: Existing Tests, pattern: '(?m)^\s*[-*+]\s*\**Path\**:\s*\**`?([^\s`*]+)', group: 1}}, optional_if_none: true}
    availability: [trace]
    modality_evidence: "imperative (RE:35 'Read them to understand the contract'); RE:76 Completion Criteria 'located and read'; CW:78"
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [35, 35], quote: "Read them to understand the contract the affected code must honor"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [76, 76], quote: "Existing covering tests located and read"}
      - {path: docs/core-workflow.md, lines: [78, 78], quote: "locate and read the existing covering tests"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [65, 65], quote: "- Path: [full path] — Contract: [signatures, return shapes, raised errors it enforces]"}
    note: "every Existing Tests Path A1 lists was read (an editor view or a read verb on it, or on a file under it) before A1 was written; skipped for a none value"
  - id: aidlc_v4_gen.reverse_engineering.a1.field_filled.passing
    stage: reverse_engineering
    target: {type: artifact, ref: a1}
    class: content
    requirement: must
    check: {kind: field_filled, params: {section: Baseline, label: Passing, none_vocab: [none]}}
    none_allowed:
      if:
        any:
          # the baseline claim rests on runs observed before it was written (write:a1) and before the first source modification
          - {counts: {fact: valid_run, kind: test, window: &baseline_claim ["stage_start:reverse_engineering", ["write:a1", *first_source_edit]], command_in: {field: {artifact: a1, section: Build & Test Commands, label: Test}}, which: last, passed: 0}}
          - all:
              - {absent: {fact: valid_run, kind: test, window: *baseline_claim, command_in: {field: {artifact: a1, section: Build & Test Commands, label: Test}}}}
              - {counts: {fact: valid_run, kind: test, window: *baseline_claim, which: last, passed: 0}}
    modality_evidence: "imperative (RE:37 'Record which of them pass'); template RE:69 offers none"
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [69, 69], quote: "- Passing: [test id, one per line | none]"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [37, 37], quote: "Record which of them pass and which already fail"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [68, 68], quote: "Recorded before any source file was modified."}
    note: "'none' only when the baseline run passed 0 tests: the last valid run of A1's Test command (RE:37 'them' = the covering tests), else the last valid run, observed before A1 was written and before the first source modification (a claim needs its evidence before it is written)"
  - id: aidlc_v4_gen.reverse_engineering.a1.field_filled.failing
    stage: reverse_engineering
    target: {type: artifact, ref: a1}
    class: content
    requirement: must
    check: {kind: field_filled, params: {section: Baseline, label: Failing, none_vocab: [none]}}
    none_allowed:
      if:
        any:
          - {counts: {fact: valid_run, kind: test, window: *baseline_claim, command_in: {field: {artifact: a1, section: Build & Test Commands, label: Test}}, which: last, failed_or_errors: 0}}
          - all:
              - {absent: {fact: valid_run, kind: test, window: *baseline_claim, command_in: {field: {artifact: a1, section: Build & Test Commands, label: Test}}}}
              - {counts: {fact: valid_run, kind: test, window: *baseline_claim, which: last, failed_or_errors: 0}}
    modality_evidence: "imperative (RE:37 'Record ... which already fail'); template RE:70 offers none"
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [70, 70], quote: "- Failing: [test id, one per line | none]"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [37, 37], quote: "Record which of them pass and which already fail"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [68, 68], quote: "Recorded before any source file was modified."}
    note: "'none' only when the baseline run had no failure or error: the last valid run of A1's Test command, else the last valid run, before A1 was written and before the first source modification"
  - id: aidlc_v4_gen.reverse_engineering.a1.field_type.passing
    stage: reverse_engineering
    target: {type: artifact, ref: a1}
    class: content
    requirement: must
    check: {kind: field_type, params: {section: Baseline, label: Passing, type: test_id, run_kind: test, window: *baseline_claim}}
    modality_evidence: "imperative (RE:37 'Record which of them pass'); RE:77 'with each test named individually'"
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [69, 69], quote: "- Passing: [test id, one per line | none]"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [77, 77], quote: "Baseline pass/fail state recorded **before** any modification, with each test named individually"}
    note: "each Passing id is backed by a valid baseline run observed before A1 was written: in its output, ids or targets, a file / label it ran (paths <-> django dotted labels), or a test the source it ran defines (def test_x, observed in a base file); prose names no test"
  - id: aidlc_v4_gen.reverse_engineering.a1.field_type.failing
    stage: reverse_engineering
    target: {type: artifact, ref: a1}
    class: content
    requirement: must
    check: {kind: field_type, params: {section: Baseline, label: Failing, type: failed_test_id, run_kind: test, window: *baseline_claim}}
    modality_evidence: "imperative (RE:37 'Record ... which already fail'); RE:77 'with each test named individually'"
    sources:
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [70, 70], quote: "- Failing: [test id, one per line | none]"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [37, 37], quote: "Record which of them pass and which already fail"}
      - {path: docs/rule-details/01-reverse-engineering.md, lines: [77, 77], quote: "Baseline pass/fail state recorded **before** any modification, with each test named individually"}
    note: "each Failing id failed or errored in a valid baseline run observed before A1 was written (the run's output names it as failing)"
