      - {path: docs/core-workflow.md, lines: [113, 113], quote: "Execute every plan step: modify the source files in place and write the reproduction script, executing neither yet"}
      - {path: docs/core-workflow.md, lines: [84, 84], quote: "It is recorded before any modification and consumed in Stage 5."}
      - {path: docs/rule-details/03-code-generation-planning.md, lines: [73, 73], quote: "Generation executes only what is written here"}
