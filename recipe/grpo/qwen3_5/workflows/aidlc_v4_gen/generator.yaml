      - {path: docs/rule-details/04-code-generation-generation.md, lines: [36, 36], quote: "such as a function residing in a different file than the plan states. Note the correction and proceed"}
      - {path: docs/core-workflow.md, lines: [157, 157], quote: "Deviations from the plan, with what changed and why — Stage 4"}
