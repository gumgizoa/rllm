- {at: 'I:1', text: Follow the workflow defined in /ai-dlc/core-workflow.md., skip: 전체 지시 (A5)}
- {at: 'I:3', text: Read /ai-dlc/core-workflow.md first. It names the rule detail file that governs, rules: [A1]}
- {at: 'I:4', text: each stage; load that file from /ai-dlc/rule-details/ as the first step of the, rules: [A2]}
- {at: 'I:5', text: 'stage it governs, and execute the stage from it.', rules: [A2]}
- {at: 'SP:61', text: Follow the workflow defined in /ai-dlc/core-workflow.md. It OVERRIDES any other, skip: 전체 지시 (A5)}
- {at: 'SP:62', text: 'problem-solving procedure, including any you would otherwise default to.', skip: 전체 지시 (A5)}
- {at: 'SP:64', text: 1. Read /ai-dlc/core-workflow.md before taking any other action on the task., rules: [A1]}
- {at: 'SP:65', text: 2. It names the rule detail file that governs each stage. Load that file from, rules: [A2]}
- {at: 'SP:66', text: '/ai-dlc/rule-details/ as the first step of the stage it governs, and execute', rules: [A2]}
- {at: 'SP:67', text: the stage from that file., rules: [A2], dup: A5}
- {at: 'SP:68', text: '3. Load one rule detail file at a time, immediately before its stage. Do not read', rules: [A3a], dup: A2}
- {at: 'SP:69', text: ahead to a later stage's rule detail file., rules: [A3b]}
- {at: 'SP:70', text: '4. Every stage ends by writing its artifact to the path core-workflow.md specifies,', rules: [B1]}
- {at: 'SP:71', text: after that stage's Completion Criteria are met., rules: [B3b]}
- {at: 'CW:3', text: '**This workflow OVERRIDES all other built-in workflows.** When resolving a reported issue in an existing repository, follow this workflow rather than any default approach.', rules: [A5]}
- {at: 'CW:7', text: '**The pipeline is fixed. Every stage always executes, in order.** There is no stage selection, no depth selection, and no adaptive planning.', rules: [C1a, C1b]}
- {at: 'CW:11', text: '**CRITICAL**: Each stage below names the rule detail file that governs it. Load that file as the first step of the stage, and execute the stage from it.', rules: [A2]}
- {at: 'CW:13', text: '**Path resolution**: rule detail paths are relative to the directory containing this file. Check these paths in order and use the first one that exists, regardless of which IDE or setup method was used:', rules: [A4]}
- {at: 'CW:14', text: '- `rule-details/` (alongside this file)', rules: [A4]}
- {at: 'CW:15', text: '- `.swe-bench-pro/rule-details/`', rules: [A4]}
- {at: 'CW:16', text: '- `.claude/swe-bench-pro-workflow/rule-details/`', rules: [A4]}
- {at: 'CW:18', text: '**Load one file at a time, immediately before its stage.** Do NOT read a stage''s rule detail file until the previous stage''s Completion Criteria are met. Reading ahead places later-stage instructions in context before the baseline is recorded, and that ordering is what this workflow depends on.', rules: [A3a, A3b]}
- {at: 'CW:22', text: '**Every stage ends by writing its result to a file**, in the format its rule detail file specifies — not as chat output.', rules: [B1], dup: B5b}
- {at: 'CW:24', text: '**Artifact path**: `/tmp/swe-bench-pro/` + the stage''s rule detail filename. Stage 1 writes `/tmp/swe-bench-pro/01-reverse-engineering.md`; Stage 5 writes `/tmp/swe-bench-pro/05-build-and-test.md`. `mkdir -p` the directory before the first write. It sits outside the repository, so no artifact can reach the final diff.', rules: [B2, B2b]}
- {at: 'CW:28', text: '- **One write, full content, at the end of the stage**, after its Completion Criteria are met. No appends, no placeholder to fill in later', rules: [B3a, B3b, B3c]}
- {at: 'CW:29', text: '- **Write artifacts with the file-editing tool** (create the file with its full content), not with a shell command such as `cat > file <<EOF`. A shell heredoc inside a tool call is the most common way an artifact write breaks the call', rules: [B12]}
- {at: 'CW:30', text: '- **Never rewrite an earlier stage''s artifact.** A later stage that contradicts an earlier one records that in its own artifact — as a deviation, a correction, or a pre-existing failure', rules: [B4a, B4b]}
- {at: 'CW:31', text: '- **Keep the prescribed skeleton exactly** — frontmatter keys, `##` headings, field prefixes. A renamed or omitted heading makes the stage unverifiable even when the work behind it was done', rules: [B5a, B5b, B5c]}
- {at: 'CW:32', text: '- **Frontmatter is these two keys and no others:**', rules: [B6a]}
- {at: 'CW:35', text: '---', dup: B6a}
- {at: 'CW:36', text: 'stage: <1-5>', rules: [B6b]}
- {at: 'CW:37', text: 'name: <reverse-engineering | requirements-analysis | code-generation-planning | code-generation-generation | build-and-test>', rules: [B6c]}
- {at: 'CW:38', text: '---', dup: B6a}
- {at: 'CW:41', text: 'The artifact''s existence is what states the stage finished. Unresolved work goes under Outstanding Failures in the Stage 5 artifact, and nowhere else.', rules: [B3b, B7, B7b]}
- {at: 'CW:43', text: '- **Do not re-read an artifact you can still see.** The result is already in context; re-reading duplicates the largest artifacts where context is already largest. Quote identifiers — `R1`, step numbers, full paths — verbatim, never renumbered or paraphrased', rules: [B8, B9]}
- {at: 'CW:44', text: '- **Read an artifact only to recover**, when an earlier stage''s content is no longer visible because output was truncated or history was compacted', rules: [B8]}
