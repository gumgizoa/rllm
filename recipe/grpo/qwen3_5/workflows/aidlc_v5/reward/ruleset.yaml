# aidlc_v5's rule set: document lines -> atomic rules -> methods (rubric item keys) with their materials.
# Edit by hand; reward/ruleset.py explains the links, `ruleset.py check` reports what is out of step and
# `ruleset.py sync` renumbers moved lines and rewrites what follows (rubric.yaml sources and appendix, ruleset.md).
docs:
  I: {path: instruction.md}
  SP: {path: system-prompt.j2, section: PROBLEM_SOLVING_WORKFLOW}
  CW: {path: docs/core-workflow.md}
  S1: {path: docs/rule-details/01-reverse-engineering.md}
  S2: {path: docs/rule-details/02-requirements-analysis.md}
  S3: {path: docs/rule-details/03-code-generation-planning.md}
  S4: {path: docs/rule-details/04-code-generation-generation.md}
  S5: {path: docs/rule-details/05-build-and-test.md}
rubric:
  schema: wfrubric/1
  workflow: aidlc_v5
  generated:
    tool: reward/ruleset.py sync (from ruleset.yaml and the code's registrations)
    rules: the workflow's atomic rules, every document line accounted for
  sources:
  - id: I
    path: instruction.md
    role: instruction
  - id: SP
    path: system-prompt.j2
    role: system_prompt
  - id: CW
    path: docs/core-workflow.md
    role: core
    container_path: /ai-dlc/core-workflow.md
  - id: S1
    path: docs/rule-details/01-reverse-engineering.md
    role: stage_rule
    container_path: /ai-dlc/rule-details/01-reverse-engineering.md
  - id: S2
    path: docs/rule-details/02-requirements-analysis.md
    role: stage_rule
    container_path: /ai-dlc/rule-details/02-requirements-analysis.md
  - id: S3
    path: docs/rule-details/03-code-generation-planning.md
    role: stage_rule
    container_path: /ai-dlc/rule-details/03-code-generation-planning.md
  - id: S4
    path: docs/rule-details/04-code-generation-generation.md
    role: stage_rule
    container_path: /ai-dlc/rule-details/04-code-generation-generation.md
  - id: S5
    path: docs/rule-details/05-build-and-test.md
    role: stage_rule
    container_path: /ai-dlc/rule-details/05-build-and-test.md
  roots:
    art: /tmp/swe-bench-pro
  stages:
  - id: '1'
    doc: S1
    artifacts:
    - a1
    order_artifact: a1
  - id: '2'
    doc: S2
    artifacts:
    - a2
    order_artifact: a2
  - id: '3'
    doc: S3
    artifacts:
    - a3
    order_artifact: a3
  - id: '4'
    doc: S4
    artifacts:
    - a4
    order_artifact: a4
  - id: '5'
    doc: S5
    artifacts:
    - a5
    order_artifact: a5
  artifacts:
    a1:
      locations:
      - '{art}/01-reverse-engineering.md'
    a2:
      locations:
      - '{art}/02-requirements-analysis.md'
    a3:
      locations:
      - '{art}/03-code-generation-planning.md'
    a4:
      locations:
      - '{art}/04-code-generation-generation.md'
    a5:
      locations:
      - '{art}/05-build-and-test.md'
  scoring:
    aggregate: kind_matrix
    total: score
    item_signals: true
    matrix:
      done_rule: B1
      kind: rules
rules:
- id: A1
  stage: 0
  kind: P
  text: core-workflow.md를 다른 어떤 행동보다 먼저 읽음
  methods:
    run/entry: {kind: P, stage: 0}
- id: A2
  stage: 0
  kind: P
  text: 각 단계의 첫 행동으로 그 단계 규칙 문서를 읽음
  methods:
    proc/A2: {kind: P, stages: [1, 2, 3, 4, 5]}
- id: A3a
  stage: 0
  kind: P
  text: 규칙 문서는 한 번에 하나씩 읽음
  methods:
    proc/A3a: {kind: P, stages: [0]}
- id: A3b
  stage: 0
  kind: P
  text: 이전 단계를 마치기(산출물) 전에 다음 단계 규칙 문서를 읽지 않음
  methods:
    proc/A3b: {kind: P, stages: [2, 3, 4, 5]}
- id: A4
  stage: 0
  kind: P
  text: 규칙 문서 경로 탐색 순서를 따름
  excluded:
    why: not applicable
    detail: document lookup order
- id: A5
  stage: 0
  kind: P
  text: 이 워크플로우가 다른 절차보다 우선함 (전체 지시)
  excluded:
    why: not applicable
    detail: an overall instruction
- id: B1
  stage: 0
  kind: F
  text: 각 단계 결과를 채팅이 아닌 파일로 씀
  methods:
    form/B1: {kind: F, stages: [1, 2, 3, 4, 5]}
- id: B2
  stage: 0
  kind: F
  text: 산출물 경로는 /tmp/swe-bench-pro/<규칙 파일명>
  excluded:
    why: covered by another rule's items
    detail: B1 (the artifact at its fixed path)
- id: B2b
  stage: 0
  kind: P
  text: 첫 산출물을 쓰기 전에 /tmp/swe-bench-pro/를 mkdir -p로 만듦
  excluded:
    why: not applicable
    detail: 'an instrumental step: the edit tool makes the directory, and the artifact at its path is B1''s'
- id: B3a
  stage: 0
  kind: P
  text: 산출물은 한 번의 write로 씀 (덧붙이기·같은 단계 안 다시 쓰기 없음)
  methods:
    rule/r_artifacts_written_once: {kind: F, stage: 0, log_only: true, note: diagnostic (aidlc/rules); scored as atom/B3a (within its stage) and atom/B4a (after the next stage began)}
    atom/B3a: {kind: P, stage: 0, class: structure}
- id: B3c
  stage: 0
  kind: F
  text: 산출물에 나중에 채울 빈칸·placeholder를 남기지 않음 (전체 내용으로 씀)
  excluded:
    why: covered by another rule's items
    detail: the field items (a placeholder reads as an empty field) and B5b (a missing section)
- id: B3b
  stage: 0
  kind: P
  text: 산출물은 단계 끝에 씀 (다음 단계 문서를 읽기 전)
  methods:
    proc/B3b: {kind: P, stages: [1, 2, 3, 4]}
  note: 'Completion Criteria met first: each criterion''s own timing rule scores it (D11c, G7a, H2, H4b)'
- id: B4a
  stage: 0
  kind: R
  text: 이전 단계 산출물을 다시 쓰지 않음
  methods:
    atom/B4a: {kind: R, stage: 0, class: structure}
- id: B4b
  stage: 0
  kind: Q
  text: 이전 단계와 모순되면 지금 단계 산출물에 deviation·정정·pre-existing으로 기록
  methods:
    check/c34_deviations_recorded: {kind: C, stage: 4}
  note: 'placed at C@4: the stage-4 artifact against the plan (was a judge question at Q@0 until 2026-10-27)'
- id: B5a
  stage: 0
  kind: F
  text: frontmatter 키를 skeleton대로 씀
  excluded:
    why: covered by another rule's items
    detail: B6a (frontmatter keys)
- id: B5b
  stage: 0
  kind: F
  text: '## 제목을 skeleton대로 씀 (이름 바꾸기·빠뜨리기 금지)'
  methods:
    form/B5b: {kind: F, stages: [1, 2, 3, 4, 5]}
- id: B5c
  stage: 0
  kind: F
  text: 필드 접두어(- Label:)를 skeleton대로 씀
  excluded:
    why: covered by another rule's items
    detail: the per-field rules (field prefixes)
- id: B5d
  stage: 0
  kind: F
  text: 괄호 안만 채우고 skeleton의 나머지 문장은 그대로 둠
  excluded:
    why: covered by another rule's items
    detail: S1.recorded, S4.executed (the skeleton's two fixed sentences)
- id: B6a
  stage: 0
  kind: F
  text: frontmatter는 stage, name 두 키만
  methods:
    form/B6a: {kind: F, stages: [1, 2, 3, 4, 5]}
- id: B6b
  stage: 0
  kind: F
  text: frontmatter stage 값이 파일의 단계와 같음
  methods:
    atom/B6b: {kind: F, stages: [1, 2, 3, 4, 5]}
- id: B6c
  stage: 0
  kind: F
  text: frontmatter name 값이 파일의 단계 이름과 같음
  methods:
    atom/B6c: {kind: F, stages: [1, 2, 3, 4, 5]}
- id: B7
  stage: 5
  kind: Q
  text: 04·05에 언급된 미해결 작업을 모두 Outstanding Failures에 적음 (none으로 포장하지 않음)
  methods:
    judge/B7: {kind: Q, stage: 5}
- id: B7b
  stage: 5
  kind: R
  text: Outstanding Failures 밖의 섹션에 미해결 작업을 적지 않음
  excluded:
    why: covered by another rule's items
    detail: B7 (B7 asks whether open work recorded in artifact 04 or another section of artifact 05 is also listed under Outstanding Failures, so open work recorded elsewhere with Outstanding Failures left none is B7's no; recording it in both places is allowed)
- id: B8
  stage: 0
  kind: P
  text: 보이는 산출물은 다시 읽지 않고, 내용이 안 보일 때만 복구용으로 읽음
  methods:
    atom/B8: {kind: P, stage: 0}
- id: B9
  stage: 0
  kind: C
  text: R id, step 번호, 경로를 바꾸지 않고 그대로 인용함
  excluded:
    why: covered by another rule's items
    detail: S3.tag (03 step tags), S3.exercises (03 Exercises), F5 (03 Requirement Coverage), G9 (04 Plan Execution) and H15c (Unmet requirements); each checks that the R ids and step numbers quoted are ones 02 and 03 define
- id: B10
  stage: 0
  kind: R
  text: 산출물 외에 설계·보고서 문서를 만들지 않음
  methods:
    atom/B10: {kind: R, stage: 0}
- id: B11
  stage: 0
  kind: F
  text: 단계마다 산출물 파일은 하나만 씀 (산출물 디렉터리에 다섯 산출물 외 문서를 만들지 않음)
  methods:
    atom/B11: {kind: F, stage: 0}
- id: B12
  stage: 0
  kind: P
  text: 산출물을 파일 편집 도구로 씀 (cat > file <<EOF 같은 셸 명령으로 쓰지 않음)
  methods:
    atom/B12: {kind: P, stage: 0}
- id: C1a
  stage: 0
  kind: P
  text: 다섯 단계를 하나도 빠뜨리지 않고 모두 실행함 (단계 선택·깊이 조정 없음)
  methods:
    proc/C1a: {kind: P, stages: [1, 2, 3, 4, 5]}
- id: C1b
  stage: 0
  kind: P
  text: 단계를 1→5 순서대로 실행함 (앞 단계 산출물 뒤에 다음 단계 산출물)
  methods:
    proc/C1b: {kind: P, stages: [2, 3, 4, 5]}
- id: C2
  stage: 0
  kind: P
  text: 이전 단계로 돌아가지 않음 (문제는 드러난 단계에서 처리)
  methods:
    atom/C2: {kind: P, stage: 0}
- id: C3
  stage: 0
  kind: P
  text: 5단계 산출물과 최종 diff가 생기기 전에는 끝내지 않음 (단계 경계의 진행 보고는 끝이 아님)
  excluded:
    why: covered by another rule's items
    detail: C1a (every stage carried out) and B1 (each stage's artifact written)
- id: E10a
  stage: 0
  kind: R
  text: 질문 파일을 만들지 않음
  methods:
    atom/E10a: {kind: R, stage: 0}
- id: E10b
  stage: 0
  kind: P
  text: 입력을 기다리며 끝내지 않음 (마지막 응답이 질문·승인 요청이 아님)
  methods:
    atom/E10b: {kind: P, stage: 0}
- id: E10c
  stage: 0
  kind: P
  text: 중간에도 사용자에게 승인을 묻지 않음
  methods:
    atom/E10c: {kind: P, stage: 0}
- id: D9
  stage: 0
  kind: R
  text: 의존성 설치·환경 설정을 하지 않음 (계획도 하지 않음)
  methods:
    rule/r_no_env_setup: {kind: R, stage: 0}
- id: I1
  stage: 0
  kind: R
  text: 정답을 git history에서 가져오지 않음 (task 조건)
  source: task
  excluded:
    why: a flag, in no score
    detail: leak_history
- id: I2
  stage: 0
  kind: R
  text: 가짜 테스트로 실행을 꾸미지 않음 (task 조건)
  source: task
  methods:
    run/ran_real_test: {kind: E, stage: 1}
- id: D1a
  stage: 1
  kind: Q
  text: 이슈가 가리키는 소스 파일을 찾아 Affected Scope에 적음
  methods:
    check/e1_scope_viewed: {kind: A, stage: 1}
  note: 'not a judge question: whether Files is the right source needs the repository; code checks the files were opened (check/e1_scope_viewed)'
- id: D1b
  stage: 1
  kind: P
  text: 이슈가 파일·심볼을 직접 지목하면 거기서 시작함
  methods:
    atom/D1b: {kind: Q, stage: 1}
  note: 'not a judge question: same; code checks the issue''s paths are in scope (atom/D1b)'
- id: D1c
  stage: 1
  kind: P
  text: 과제가 말하는 심볼·함수·클래스 이름·오류 문자열을 저장소 전체에서 검색함
  methods:
    atom/D1c: {kind: P, stage: 1}
- id: D1e
  stage: 1
  kind: C
  text: 검색으로 찾은 참조 파일을 범위(Files)에 넣거나, 뺀 이유와 함께 Referencing files left out of scope에 적음
  methods:
    atom/D1e: {kind: C, stage: 1}
- id: D2
  stage: 1
  kind: Q
  text: 직접 연결된 파일(호출자·피호출자)까지 확장함
  excluded:
    why: judge, low priority, not asked
    detail: the scope extends to direct callers and callees
- id: D3
  stage: 1
  kind: Q
  text: Owning module이 Files가 속한 모듈·패키지임
  methods:
    judge/D3: {kind: Q, stage: 1}
- id: D3b
  stage: 1
  kind: Q
  text: Owning module에 저장소 안의 경계(디렉터리 등)를 적고, 그 경계가 Files를 포함함
  methods:
    atom/D3b: {kind: Q, stage: 1}
- id: D4a
  stage: 1
  kind: Q
  text: 언어·프레임워크를 Files에서 판단해 기록함
  methods:
    atom/D4a: {kind: Q, stage: 1}
- id: D4c
  stage: 1
  kind: R
  text: 검색이 닿지 않은 패키지를 나열·기록하지 않음 (범위는 이슈가 건드리는 파일)
  excluded:
    why: judge, low priority, not asked
    detail: aidlc_v4_eval covered it by D4b (no repository survey), which v5 drops; as a judge question it was yes on 56 of 56 (until 2026-10-27)
- id: D5
  stage: 1
  kind: F
  text: 모든 경로를 repo root부터 전체 경로로 적음
  methods:
    atom/D5: {kind: F, stage: 1}
- id: D5b
  stage: 1
  kind: F
  text: 01 Files에 경로를 한 줄에 하나씩 적음
  methods:
    atom/D5b: {kind: F, stage: 1}
- id: D6
  stage: 1
  kind: Q
  text: build·type-check 방법을 정함 (언어가 요구하면)
  methods:
    check/e1_build_command_run: {kind: A, stage: 1}
    judge/D6: {kind: Q, stage: 1}
- id: D7a
  stage: 1
  kind: Q
  text: 테스트를 어떻게 실행하는지 정함
  methods:
    check/e1_test_command_run: {kind: A, stage: 1}
- id: D7b
  stage: 1
  kind: Q
  text: 테스트 명령이 해당 범위의 테스트를 대상으로 함 (전체 suite 아님)
  methods:
    atom/D7b: {kind: Q, stage: 1}
- id: D8
  stage: 1
  kind: E
  text: 출력을 줄이는 옵션(-q, --tb=short)을 씀
  methods:
    atom/D8: {kind: E, stage: 1}
- id: D10a
  stage: 1
  kind: E
  text: 해당 범위를 덮는 기존 테스트를 찾음
  methods:
    check/e1_test_path_seen: {kind: A, stage: 1}
    atom/D10a: {kind: E, stage: 1}
- id: D10b
  stage: 1
  kind: Q
  text: 기존 테스트가 강제하는 계약(시그니처·반환·예외)을 맞게 파악해 Contract에 적음
  methods:
    judge/D10b: {kind: Q, stage: 1, class: evidence}
- id: D10c
  stage: 1
  kind: E
  text: 찾은 기존 테스트 파일을 실제로 엶
  excluded:
    why: covered by another rule's items
    detail: D10a (atom/D10a, check/e1_test_path_seen)
- id: D11a
  stage: 1
  kind: E
  text: 소스를 고치기 전에 그 테스트를 한 번 실행함 (baseline)
  methods:
    check/t1_baseline_before_edit: {kind: E, stage: 1}
- id: D11c
  stage: 1
  kind: E
  text: baseline 테스트를 실행한 뒤 그 결과를 01에 적음 (실행 전에 쓰지 않음)
  methods:
    check/t1_baseline_before_write: {kind: E, stage: 1}
- id: D11b
  stage: 1
  kind: P
  text: 1단계 산출물을 소스 수정 전에 씀
  methods:
    check/t1_no_edit_before_write: {kind: P, stage: 1}
- id: D12a
  stage: 1
  kind: A
  text: 01 Baseline에 적은 테스트 이름이 baseline 실행 출력에 있음
  methods:
    check/e1_baseline_tests: {kind: A, stage: 1}
- id: D12c
  stage: 1
  kind: A
  text: 01 Failing 기록이 baseline 실행 결과와 맞음 (none이면 실패가 없음)
  methods:
    check/e1_baseline_failing: {kind: A, stage: 1}
- id: D12d
  stage: 1
  kind: A
  text: Passing·Failing이 둘 다 none이면 baseline 실행에서 돈 테스트가 없음
  methods:
    check/e1_baseline_none: {kind: A, stage: 1}
- id: D12e
  stage: 1
  kind: A
  text: 01 Passing에 적은 테스트는 baseline 실행에서 실제로 통과함
  methods:
    check/e1_baseline_passing: {kind: A, stage: 1}
- id: D12b
  stage: 1
  kind: F
  text: 테스트를 하나씩 이름으로, 한 줄에 하나씩 적음
  methods:
    atom/D12b: {kind: F, stage: 1}
- id: S1.files
  stage: 1
  kind: F
  text: 01 필드 Files
  methods:
    form/S1.files: {kind: F, stages: [1]}
- id: S1.leftout
  stage: 1
  kind: F
  text: 01 필드 Referencing files left out of scope (없으면 none)
  methods:
    form/S1.leftout: {kind: F, stages: [1]}
- id: S1.module
  stage: 1
  kind: F
  text: 01 필드 Owning module
  methods:
    form/S1.module: {kind: F, stages: [1]}
- id: S1.lang
  stage: 1
  kind: F
  text: 01 필드 Language/framework
  methods:
    form/S1.lang: {kind: F, stages: [1]}
- id: S1.build
  stage: 1
  kind: F
  text: 01 필드 Build (없으면 not applicable)
  methods:
    form/S1.build: {kind: F, stages: [1]}
- id: S1.test
  stage: 1
  kind: F
  text: 01 필드 Test
  methods:
    form/S1.test: {kind: F, stages: [1]}
- id: S1.tpath
  stage: 1
  kind: F
  text: 01 필드 Existing Tests의 Path
  methods:
    form/S1.tpath: {kind: F, stages: [1]}
- id: S1.contract
  stage: 1
  kind: F
  text: 01 필드 Existing Tests의 Contract
  methods:
    form/S1.contract: {kind: F, stages: [1]}
- id: S1.passing
  stage: 1
  kind: F
  text: 01 필드 Passing (없으면 none)
