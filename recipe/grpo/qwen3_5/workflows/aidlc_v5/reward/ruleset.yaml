- {at: 'S4:37', text: 'A deviation is the normal way a plan gets corrected, not a failure. When the code, an import, an error message, or a test points to a file the plan does not name, open that file and read the relevant part before deciding; if it also needs the change, add it to the change and record the addition as a local correction. Do not leave a location unchanged only because the plan did not list it.', rules: [G11]}
