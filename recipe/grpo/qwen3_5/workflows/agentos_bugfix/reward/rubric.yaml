conflicts:
- type: documented
  description: create-tasks PHASE 1 reads spec.md / requirements.md only when they are not in the conversation context (CT:13),
    while its Step 1 says to read each of them (CT:32-34); implement-tasks 'Analyze the provided spec.md, requirements.md'
    (IT:29) likewise
  resolution: the reads of spec.md / requirements.md in create-tasks and implement-tasks are should; the run's own write of
    them is in its context
  items: []
  sources:
  - path: docs/commands/create-tasks/create-tasks.md
    lines:
    - 13
    - 13
    quote: IF you don't have ONE OR BOTH of those files in your current conversation context, then find the spec folder under
      `/tmp/agent-os/specs/` (this run creates one) and read the files there.
  - path: docs/commands/create-tasks/create-tasks.md
    lines:
    - 32
    - 32
    quote: 'Read each of these files (whichever are available) and analyze them to understand the requirements for this feature
      implementation:'
- type: documented
  description: The create-tasks skeleton is 'an example format' to adapt (CT:42), while the test sub-tasks and acceptance
    criteria are stated as rules (CT:214-216)
  resolution: the example's headings, Overview, Dependencies lines and Execution Order are should; task groups with checkbox
    sub-tasks, acceptance criteria and test-first / run-last sub-tasks are must; the example's web-app groups (Database /
    API / UI) are never required
  items: []
  sources:
  - path: docs/commands/create-tasks/create-tasks.md
    lines:
    - 42
    - 42
    quote: The following is an example format - adapt the content of the tasks list to match what THIS feature actually needs.
  - path: docs/commands/create-tasks/create-tasks.md
    lines:
    - 214
    - 216
    quote: '- **Use a focused test-driven approach** where each task group starts with writing 2-8 tests (x.1 sub-task) and
      ends with running ONLY those tests (final sub-task)'
- type: documented
  description: Run the entire test suite (IT:239) on repositories whose whole suite may be slow or fail to collect; the verification
    only reports and never fixes (IT:243)
  resolution: a valid test run (>= 1 test reported) after every task is ticked and before the report is must, and so is one
    of them being the whole suite (a bare runner at the repository root, or only its top-level test directory); a run that
    only fails to collect is no valid run, so such a repository costs the PHASE 3 items; repository edits after PHASE 3 began
    fail code_frozen
  items: []
  sources:
  - path: docs/commands/implement-tasks/implement-tasks.md
    lines:
    - 239
    - 239
    quote: Run the entire tests suite for the application so that ALL tests run.
  - path: docs/commands/implement-tasks/implement-tasks.md
    lines:
    - 243
    - 243
    quote: DO NOT attempt to fix any failing tests.  Just note their failures in your final verification report.
- type: documented
  description: 'IT:39 ''Running ONLY the tests you''ve written'' after each task group: whether a later group re-runs an earlier
    group''s checks is not said'
  resolution: 'read as every check script written so far: each one''s last run must pass after the last code change of implement-tasks
    (pass_last); upstream states no fail-first step, so a check failing before the change is not required'
  items: []
  sources:
  - path: docs/commands/implement-tasks/implement-tasks.md
    lines:
    - 39
    - 39
    quote: '- Running ONLY the tests you''ve written (if any; they are check scripts under `/tmp/agent-os/specs/[this-spec]/checks/`,
      not repository test files) and ensuring those tests pass.'
- type: documented
  description: The report's structure 'should' be followed (IT:249), while section 2's status and its reason are imperative
    (IT:235) and the counts and failed tests must be included (IT:241)
  resolution: the report's headings, labels and status value sets are should; its existence, section 2's status and reason,
    the Test Summary counts (against a PHASE 3 run), the failed tests and a Test Suite status the run does not refute are
    must
  items: []
  sources:
  - path: docs/commands/implement-tasks/implement-tasks.md
    lines:
    - 249
    - 249
    quote: 'The content of this report should follow this structure:'
  - path: docs/commands/implement-tasks/implement-tasks.md
    lines:
    - 235
    - 235
    quote: In section 2 of the report (Roadmap Updates), record Status `⚠️ No Updates Needed` with that reason in its Notes.
- type: documented
  description: shape-spec's questions are 4-8 numbered ones plus the reusability question at the end (SS:121-123), which requirements.md
    may record as one more **Qn:**
  resolution: 4 to 9 **Qn:** lines numbered from 1; the reuse answer itself is judged in Existing Code to Reference
  items: []
  sources:
  - path: docs/commands/shape-spec/shape-spec.md
    lines:
    - 121
    - 123
    quote: 'Based on the initial idea, generate 4-8 targeted, NUMBERED questions that explore requirements while suggesting
      reasonable defaults. **CRITICAL: Always include the reusability question at the END of your questions.**'
- type: documented
  description: The generic system prompt asks to ask the user for clarification and to keep AGENTS.md in the repository (SP:11,
    SP:175); the workflow has no one to ask and keeps everything of its own out of /testbed (CW:67-74, CW:86-87)
  resolution: 'the workflow wins (CW:6-7 ''it replaces any procedure you would otherwise follow''): spec files, notes and
    scratch scripts created in the repository fail their item; AGENTS.md is not itemized; no item rewards asking'
  items: []
  sources:
  - path: system-prompt.j2
    lines:
    - 11
    - 11
    quote: '* Use `AGENTS.md` under the repository root as your persistent memory for repository-specific knowledge and context.'
  - path: docs/core-workflow.md
    lines:
