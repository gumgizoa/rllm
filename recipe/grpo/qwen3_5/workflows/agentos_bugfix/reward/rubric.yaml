    quote: 'Nothing that belongs to the workflow goes into `/testbed`: no spec files, notes, summaries or temporary scripts.'
- type: documented
  description: 'The report has four **Status:** lines (IT:257, 269, 285, 297), each with its own value set (G7 critic: a whole-report
    Status enum would demand the header''s values everywhere)'
  resolution: the header enum reads the document's first Status line only (a section-less field read stops at the first match,
    the header under the title); sections 1, 2 and 3 are read in their own sections; all four items stand
  items: []
  sources:
  - path: docs/commands/implement-tasks/implement-tasks.md
    lines:
