# Extracted (G5/G7) items dropped on review. Each names the G4 statement it came from (gen-work/statements.jsonl).
exclude:
  # -- the same requirement as a reviewed (manual) or stage-model item, in another id or with other parameters: one item judges it
  - {statement: "*", kind: artifact_exists, reason: "every artifact's existence is a stage-model or manual item (the stage gates, the Phase 1 files, the checklist, feature.json, convergence-2.md conditional on round 1's Outcome); a second copy double-counts it, and an unconditional convergence-2.md fails the one-round run"}
  - {statement: "*", kind: speckit_sdd.script, reason: "each stage's script run is a manual item whose window ends at the stage's own first write (plan.md, tasks.md, the round report) or first repository edit; the extracted copies use the whole stage window or miss the flags"}
  - {statement: "*", kind: speckit_sdd.tasks, reason: "every tasks.md rule (story_tests, empty_phases, ticked, ticked_after_work, later_edits, appended, convergence_phase, convergence_lines) is a manual item with the window and round condition its stage gives it; the extracted copies drop the round conditions (an appended phase required of a converged round) or the window"}
  - {statement: "*", kind: speckit_sdd.report, reason: "the round reports' rules are manual items per round (convergence-2.md's apply with round 2)"}
  - {statement: "*", kind: speckit_sdd.plan_docs, reason: "duplicates the manual contracts / na_body items (PL:43)"}
  - {statement: "*", kind: speckit_sdd.feature_json, reason: "duplicates the manual feature_json item (SY:26-32)"}
  - {statement: "*", kind: speckit_sdd.checks, reason: "the verification scripts' rules (written, red_green, before_code, pass_last) are manual items per implement round"}
  - {statement: "*", kind: speckit_sdd.no_fetch, reason: "duplicates the global no_fetch item (CW:49-50), which covers every stage"}
  - {statement: "*", kind: speckit_sdd.links, reason: "the spec's links item (SY:6) is manual; PL:28 'a link you rely on is recorded as [UNVERIFIED — not fetched]' names no artifact (research.md / plan.md alike) -- the no_fetch item carries the rule"}
  - {statement: "*", kind: speckit_sdd.untouched, reason: "duplicates the manual shipped-trees item (CW:18-19)"}
  - {statement: "*", kind: speckit_sdd.created_files, reason: "duplicates the manual test / scratch items (CW:77, CW:82-84); cw-037's 'any new .md file' would fail a documentation change the feature itself needs"}
  - {statement: "*", kind: speckit_sdd.paths_written, reason: "duplicates the manual scripts-outside-checks item (CW:83-84), which also covers /tmp subdirectories"}
  - {statement: "*", kind: speckit.task_lines, reason: "duplicates the manual tasks.md line-rule items (one per rule, TK:57-63)"}
  - {statement: "*", kind: speckit.read, reason: "the artifact reads are manual items per stage (plan PL:5, tasks TK:5-7, implement IM:35-41, converge CV:3-5), with the window before the stage's own write where the document orders it"}
  - {statement: "*", kind: speckit.holds, reason: "the write rules (CW:66-71: spec / checklist / plan documents / round reports not written later), the round rules (CW:38-43) and converge's no-touch rules are manual items; cv-007 (spec / plan not written in converge) is part of the global plan-documents item"}
  - {statement: "*", kind: speckit.tasks_done, reason: "marked_after_code fails a test task ticked once its verification script is written and seen failing -- before any code edit, as IM:53 orders; the manual ticked_after_work item ties each tick to the work its task names"}
  - {statement: "*", kind: doc_read, reason: "the stage documents', templates' and constitution's reads are manual items, one per stage window"}
  - {statement: "*", kind: field_literal, reason: "the Round value is the manual field_enum item per round report (CV:136)"}
  - {statement: "*", kind: write_discipline, reason: "converge's append-only rule is the manual write_discipline item per round (CV:17)"}
  - {statement: "sy-0[0-6]*", kind: item_format, reason: "duplicates the compiled Feature Branch line and the manual clarifications_resolved item (no marker left, SY:127), which supersedes the at-most-3 count"}
  - {statement: "sy-04[0-9]", kind: no_template_residue, reason: "duplicates the manual clarifications_resolved item (SY:127)"}
  - {statement: "sy-05[0-9]", kind: no_template_residue, reason: "duplicates the manual no_na_section item (SY:147), which matches a line that is only N/A instead of any line starting with it"}
  - {statement: "tk-0[2-6]*", kind: item_format, reason: "duplicates the manual task-line items (checkbox, format, sequential_ids, file_path, unchecked_when_written)"}
  - {statement: "tk-045", kind: cross_ref, reason: "duplicates the manual one_phase_per_story item (TK:25)"}
  - {statement: "pl-014", kind: no_template_residue, reason: "duplicates the manual plan clarifications item (the whole plan, PL:11)"}
  - {statement: "pl-034", kind: no_template_residue, reason: "duplicates the manual contracts item, which fails on the <REPLACE ...> mark (PL:43)"}
  - {statement: "cv-059", kind: item_format, reason: "duplicates the manual appended / convergence_phase items (CV:155-159)"}
  - {statement: "cw-036", kind: prohibited_action, reason: "duplicates the manual ignore-files item (CW:81)"}
  # -- misreadings
  - {statement: "pl-046", kind: no_template_residue, reason: "PL:67 'use project-relative paths for references in documentation' read as 'no /tmp/speckit-sdd/ anywhere': the templates the agent fills write the absolute feature path themselves (TPL_PLAN:5, TPL_PLAN:50, TPL_TASKS:3), so every honest plan, research and quickstart fails it (conflicts)"}
  - {statement: "cw-039", kind: prohibited_action, reason: "CW:88 explains that the scripts' hints name slash commands; it forbids nothing (running '/speckit.plan' in a shell is a failing command, not a rule)"}

# Contradictions and gaps the documents leave, and how the rubric reads them (P3: both readings where expressible; a
# value set the template fixes is not relaxed; the workflow over the system prompt's generic sections, CW:6).
conflicts:
  - description: "Rounds: the stage documents describe one implement and one converge stage; core-workflow.md alternates them in at most two rounds, round 2 only when convergence.md's Outcome is tasks_appended (CW:38-43)"
    sources:
      - {path: docs/core-workflow.md, lines: [38, 41], quote: "2. implement and converge then alternate, in at most two rounds: - Round 1: implement works through the whole of `tasks.md`; converge writes `convergence.md`. - If that report's **Outcome** is `tasks_appended`, round 2 follows: implement does only the unchecked tasks (the new `## Phase N: Convergence`), and converge writes `convergence-2.md`."}
      - {path: docs/stages/05-converge.md, lines: [188, 190], quote: "- On `tasks_appended` in round 1: open the implement stage document (`/speckit-sdd/stages/04-implement.md`) again and complete the new Convergence phase's tasks (round 2), then return to this document and write `convergence-2.md`."}
    resolution: "seven stages (specify, plan, tasks, implement, converge, implement_2, converge_2); the round-2 stages' items apply when convergence.md's Outcome is tasks_appended or convergence-2.md exists, and convergence-2.md's existence (zero_stage) when the Outcome is tasks_appended; a stage with no applicable item is no signal, so a round-1 converged run is scored on five stages, order and process; a round-2 report after converged, or a third report, fails a global item"
  - description: "Stage windows: every stage begins by opening its document (CW:32-33), the round-2 stages open the same documents again (CV:188-190); no line forbids reading a later stage's document early"
    sources:
      - {path: docs/core-workflow.md, lines: [32, 33], quote: "Begin every stage by opening its document, and carry the stage out from that document rather than from memory."}
    resolution: "a stage's window opens at its document's first read after the previous stage began (scoring.next_read: after_start in reads mode), so round 2 opens at the re-reads and a read ahead opens nothing early; each stage's read is judged in its own window, and the round-1 order item voids a document first seen before the previous artifact (e.g. all five at once)"
  - description: "The shipped constitution is the unfilled template: the stages load it (SY:41, PL:5, TK:8, IM:40), but it holds no principle, so plan writes 'skipped — template' and converge skips its checks (PL:9, CV:31-32)"
    sources:
      - {path: docs/stages/02-plan.md, lines: [9, 9], quote: "write \"skipped — template\" in Constitution Check and evaluate no gate"}
      - {path: docs/stages/05-converge.md, lines: [31, 32], quote: "If the constitution is an unfilled template, skip constitution checks gracefully rather than failing."}
    resolution: "the loads are required where a stage document says so (must, in the stage's window; converge's 'if not an unfilled template' load is not); plan.md's Constitution Check says 'skipped — template' (must); the round report's metrics line says so (should); no constitution principle is checked"
