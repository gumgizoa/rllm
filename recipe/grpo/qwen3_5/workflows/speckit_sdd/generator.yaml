# Generator config for speckit_sdd: what the generator cannot read off the workflow's documents.
#
# The agent sees docs/ at /speckit-sdd -- core-workflow.md (the package author's hand-written definition of the chain:
# stages, rounds, who writes what, the repository rules) and stages/01-specify.md .. 05-converge.md (spec-kit's
# commands as build.py renders them) -- plus instruction.md and the system prompt, and the Spec Kit project the sandbox
# ships at /tmp/speckit-sdd/.specify (sandbox/specify/: the scripts the stages run, the templates they copy or print,
# the unfilled constitution they load). Those shipped files are sources too (extra_sources), with the container paths
# the agent reads them at. porting/, README.md and build.py are the author's notes and tooling, never shown to the
# agent and never a source. Every decision below cites the line it rests on; paths are relative to this package.
workflow: speckit_sdd
prefix: speckit_sdd

extra_sources:
  - {path: sandbox/specify, container: /tmp/speckit-sdd/.specify}

ids:
  docs/core-workflow.md: CW
  docs/stages/01-specify.md: SY
  docs/stages/02-plan.md: PL
  docs/stages/03-tasks.md: TK
  docs/stages/04-implement.md: IM
  docs/stages/05-converge.md: CV
  instruction.md: INS
  system-prompt.j2: SP
  sandbox/specify/templates/spec-template.md: TPL_SPEC
  sandbox/specify/templates/plan-template.md: TPL_PLAN
  sandbox/specify/templates/tasks-template.md: TPL_TASKS
  sandbox/specify/templates/checklist-template.md: TPL_CHECKLIST
  sandbox/specify/memory/constitution.md: CONSTITUTION
  sandbox/specify/scripts/bash/common.sh: SCRIPT_COMMON
  sandbox/specify/scripts/bash/setup-plan.sh: SCRIPT_SETUP_PLAN
  sandbox/specify/scripts/bash/setup-tasks.sh: SCRIPT_SETUP_TASKS
  sandbox/specify/scripts/bash/check-prerequisites.sh: SCRIPT_CHECK_PREREQUISITES

roles:
  - docs/core-workflow.md: core
  - docs/stages/*.md: stage_rule
  - sandbox/specify/templates/*.md: template
  # what the stages run: their behaviour explains an artifact (setup-plan.sh copies the plan template, setup-tasks.sh
  # prints the tasks template, the scripts find the feature through feature.json), never a requirement on the agent
  - sandbox/specify/scripts/bash/*.sh: script
  # `specify init` leaves the constitution as its unfilled template (`[PRINCIPLE_1_NAME]` ... with example comments); no
  # stage fills it, the stages only load it, and an unfilled one "has no principles" (PL:9): its text binds nothing,
  # so it is read as a template no artifact is compiled from, not as prose
  - sandbox/specify/memory/constitution.md: template

system_prompt:
  sections:
    PROBLEM_SOLVING_WORKFLOW: workflow
    "*": harness_generic

# core-workflow.md is the workflow's own definition (written for this package, it adapts no upstream text), and the
# stage documents and templates are the workflow's text: like speckit_bug and openspec_ff, no item is adapter-derived.
adapter_roles: [adapter]

# A stage is carried out from its document (CW:32-33), which says how to use its template (SY:67 "using the template
# structure"); core-workflow.md sets the order, the rounds and the repository rules around them.
precedence:
  - order: [stage_rule, template, core, reference, "system_prompt:workflow", instruction, "system_prompt:harness_generic"]
    applies_to: all
    authority:
      path: docs/core-workflow.md
      lines: [32, 33]
      quote: "Begin every stage by opening its document, and carry the stage out from that document rather than from memory."

classify:
  # SY:67 "replacing placeholders with concrete details": a bracketed span of a template is a placeholder, except
  # Spec Kit's own syntax -- the checkbox states, the task markers [P] / [USn] (TK:57-63), markdown links and the
  # clarification marker the spec may keep (SY:49-53, at most three); [UNVERIFIED — not fetched] is literal output (SY:6).
  # The header values the conversion fixed are literal: Branch `001-issue` (SY:16), Status Draft, the Input line.
  sdd_spec:
    brackets: true
    placeholder:
      - '<!--.*?-->'
    legit:
      - '\[[ xX]\]'
      - '\[P\]'
      - '\[US\d+\]'
      - '\[NEEDS CLARIFICATION:[^\[\]\n]*\]'
      - '\[UNVERIFIED — not fetched\]'
      - '\[[^\[\]\n]+\]\([^)\s]+\)'
    literal:
      - '^\*\*Feature Branch\*\*:\s*`001-issue`\s*$'
      - '^\*\*Status\*\*:\s*Draft\s*$'
    none_tokens: [none]
  # plan / tasks: "NEEDS CLARIFICATION" is an unknown still to resolve there (PL:208, 211), so it stays inside the
  # placeholders it appears in; the template's "N/A" alternative (TPL_PLAN:25) is its none. The plan's contracts line
  # holds a <REPLACE in plan.md: ...> mark (PL:243 "marked `<REPLACE in plan.md: …>`; replace it").
  sdd:
    brackets: true
    placeholder:
      - '<!--.*?-->'
      - '<REPLACE in plan\.md:[^\n]*>'
    legit:
      - '\[[ xX]\]'
      - '\[P\]'
      - '\[US\d+\]'
      - '\[Story\]'
      # the checklist item "No [NEEDS CLARIFICATION] markers remain" (SY:89) names the marker, it is no placeholder
      - '\[NEEDS CLARIFICATION\]'
      - '\[[^\[\]\n]+\]\([^)\s]+\)'
    literal:
      - '^\*\*Branch\*\*:\s*`001-issue`'
    sample_marker: []
    none_tokens: [none, "N/A", "n/a"]
  # the round report (CV:134-149): the value choices `1 | 2`, `converged | tasks_appended` and the table's example row
  # are what the report fills; the metric lines name what is counted
  report:
    brackets: false
    placeholder:
      - '<!--.*?-->'
      - '^\s*1 \| 2\s*$'
      - 'converged \| tasks_appended'
      - 'Example: no append-only guard detected in path/to/module\.py when writing tasks\.md'
    literal:
      - '^#{2} Convergence Findings'
      - '^\| ID \| Gap Type \|'
    none_tokens: [none]

templates:
  - id: spec
    path: sandbox/specify/templates/spec-template.md
    artifact: spec
    stage: specify
    rules: sdd_spec
    literals: patterns
    binding:
      path: docs/stages/01-specify.md
      lines: [67, 67]
      quote: "Write the specification to SPEC_FILE using the template structure, replacing placeholders with concrete details derived from the feature description (the issue) while preserving section order and headings."
    sections:
      # "ACTION REQUIRED: The content in this section represents placeholders. Fill them out with the right edge cases":
      # the two bullets are placeholders, not a phrasing to keep; the section and its content are manual items
      Edge Cases:
        requirement: skip
        authority: {path: sandbox/specify/templates/spec-template.md, lines: [74, 75], quote: "ACTION REQUIRED: The content in this section represents placeholders. Fill them out with the right edge cases."}
  - id: plan
    path: sandbox/specify/templates/plan-template.md
    artifact: plan
    stage: plan
    rules: sdd
    literals: patterns
    binding:
      path: docs/stages/02-plan.md
      lines: [7, 7]
      quote: "**Execute plan workflow**: Follow the structure in IMPL_PLAN template to:"
    sections:
      # "The structure here is presented in advisory capacity": the labels and values guide; filling the section is must (manual)
      Technical Context:
        requirement: should
        authority: {path: sandbox/specify/templates/plan-template.md, lines: [16, 18], quote: "ACTION REQUIRED: Replace the content in this section with the technical details for the project. The structure here is presented in advisory capacity to guide the iteration process."}
  - id: research
    # PL:30-33 "Consolidate findings in research.md using format:" -- the three labelled lines
    path: docs/stages/02-plan.md
    block: {lines: [31, 33]}
    artifact: research
    stage: plan
    rules: sdd
    literals: patterns
    binding:
      path: docs/stages/02-plan.md
      lines: [30, 30]
      quote: "**Consolidate findings** in `research.md` using format:"
    binding_requirement: must
  - id: tasks
    path: sandbox/specify/templates/tasks-template.md
    # from the sample-task comment on: lines 1-22 are the title, Input line and the format legend / path conventions
    # (guidance, not structure TK:21 asks to fill; title and Input are manual items)
    block: {lines: [24, 205]}
    artifact: tasks
    stage: tasks
    rules: sdd
    literals: patterns
    binding:
      path: docs/stages/03-tasks.md
      lines: [21, 21]
      quote: "**Generate tasks.md**: Use TASKS_TEMPLATE_CONTENT (from the JSON output above) as the structure."
    sections:
      # sample tasks (TPL_TASKS:39 "DO NOT keep these sample tasks"); the phase headings, the story phases' Tests /
      # Implementation parts and the task grammar are manual items
      '^Phase \d+: Setup':
        requirement: skip
        authority: &sample {path: sandbox/specify/templates/tasks-template.md, lines: [39, 39], quote: "DO NOT keep these sample tasks in the generated tasks.md file."}
      '^Phase \d+: Foundational':
        requirement: skip
        authority: *sample
      '^Phase \d+: User Story':
        requirement: skip
        authority: *sample
      '^Phase N: Polish':
        requirement: skip
        authority: *sample
      # TK:31 names a Dependencies section showing story completion order; its sub-headings are the template's own
      # breakdown (should), the Notes are the template's advice to the reader
      Phase Dependencies:
        requirement: should
        authority: &deps {path: docs/stages/03-tasks.md, lines: [31, 31], quote: "Dependencies section showing story completion order"}
      User Story Dependencies:
        requirement: should
        authority: *deps
      Within Each User Story:
        requirement: should
        authority: *deps
      Parallel Opportunities:
        requirement: should
        authority: *deps
      Notes:
        requirement: skip
        authority: {path: docs/stages/03-tasks.md, lines: [21, 31], quote: "Fill with:"}
  - id: req_checklist
    path: docs/stages/01-specify.md
    block: {fence: markdown, index: 0}
    artifact: req_checklist
    stage: specify
    rules: sdd
    literals: patterns
    binding:
      path: docs/stages/01-specify.md
      lines: [71, 71]
      quote: "**Create Spec Quality Checklist**: Generate a checklist file at `SPECIFY_FEATURE_DIRECTORY/checklists/requirements.md` using the structure below, with these validation items:"
    binding_requirement: must
  - id: convergence
    path: docs/stages/05-converge.md
    block: {lines: [134, 149]}
    artifact: convergence
    stage: converge
    rules: report
    literals: patterns
    binding: &report
      path: docs/stages/05-converge.md
      lines: [130, 132]
      quote: "write a compact, severity-graded summary to this round's report: `FEATURE_DIR/convergence.md` in round 1, `FEATURE_DIR/convergence-2.md` in round 2 (rounds: `/speckit-sdd/core-workflow.md`), with this structure:"
    binding_requirement: must
    # "Before appending anything, write ...": the dictionary reads no imperative there, and the skeleton's value choices
    # and example row are not shapes to keep; the report's heading, fields, table header and metrics are manual items
    sections: &report_sections
      Convergence Findings:
        requirement: skip
        authority: {path: docs/stages/05-converge.md, lines: [134, 137], quote: "## Convergence Findings - **Round**: 1 | 2 - **Outcome**: converged | tasks_appended"}
  - id: convergence_2
    path: docs/stages/05-converge.md
    block: {lines: [134, 149]}
    artifact: convergence_2
    stage: converge_2
    rules: report
    literals: patterns
    binding: *report
    binding_requirement: must
    sections: *report_sections

# CW:35-43: specify, plan, tasks once each, then implement and converge in at most two rounds; round 2 (implement
# again for the unchecked tasks, then convergence-2.md) runs only when convergence.md's Outcome is tasks_appended.
# The round-2 stages repeat the round-1 documents, so the windows open at each document's read *after the previous
# stage began* (scoring.next_read below); the round-2 report is an optional artifact whose existence is required by
# a manual item conditional on round 1's Outcome.
stage_model:
  fixed:
    roots:
      artifact: /tmp/speckit-sdd/specs
      code: "{WORKDIR}"
    stages:
      - id: specify
        doc: docs/stages/01-specify.md
        artifacts: [spec, req_checklist, feature_json]
        order_artifact: spec
      - id: plan
        doc: docs/stages/02-plan.md
        artifacts: [plan, research, data_model, quickstart]
        order_artifact: plan
        requires: [spec, feature_json]
      - id: tasks
        doc: docs/stages/03-tasks.md
        artifacts: [tasks]
        order_artifact: tasks
        requires: [plan, spec]
      - id: implement
        doc: docs/stages/04-implement.md
        artifacts: []
        requires: [tasks, plan]
      - id: converge
        doc: docs/stages/05-converge.md
        artifacts: [convergence]
        order_artifact: convergence
        requires: [spec, plan, tasks]
      - id: implement_2
        doc: docs/stages/04-implement.md
        artifacts: []
        requires: [tasks, convergence]
      - id: converge_2
        doc: docs/stages/05-converge.md
        artifacts: [convergence_2]
        order_artifact: convergence_2
        requires: [spec, plan, tasks, convergence]
    artifacts:
      spec:
        locations: ["{artifact}/001-issue/spec.md"]
        template: sandbox/specify/templates/spec-template.md
        source:
          - {path: docs/stages/01-specify.md, lines: [24, 25], quote: "Copy `/tmp/speckit-sdd/.specify/templates/spec-template.md` to `SPECIFY_FEATURE_DIRECTORY/spec.md` as the starting point - Set `SPEC_FILE` to `SPECIFY_FEATURE_DIRECTORY/spec.md`"}
          - {path: docs/core-workflow.md, lines: [25, 25], quote: "| 1 | specify | `/speckit-sdd/stages/01-specify.md` | none; the stage sets the feature up itself | `spec.md`, `checklists/requirements.md` (and `/tmp/speckit-sdd/.specify/feature.json`) |"}
      req_checklist:
        locations: ["{artifact}/001-issue/checklists/requirements.md"]
        source:
          - {path: docs/stages/01-specify.md, lines: [71, 71], quote: "Generate a checklist file at `SPECIFY_FEATURE_DIRECTORY/checklists/requirements.md`"}
      feature_json:
        locations: ["/tmp/speckit-sdd/.specify/feature.json"]
        kind: json
        source:
          - {path: docs/stages/01-specify.md, lines: [26, 26], quote: "Persist the feature directory to `/tmp/speckit-sdd/.specify/feature.json`:"}
      plan:
        locations: ["{artifact}/001-issue/plan.md"]
        template: sandbox/specify/templates/plan-template.md
        source:
          - {path: docs/stages/02-plan.md, lines: [7, 7], quote: "**Execute plan workflow**: Follow the structure in IMPL_PLAN template to:"}
          - {path: docs/core-workflow.md, lines: [26, 26], quote: "| 2 | plan | `/speckit-sdd/stages/02-plan.md` | `setup-plan.sh --json` | `plan.md`, `research.md`, `data-model.md`, `quickstart.md`"}
      research:
        locations: ["{artifact}/001-issue/research.md"]
        source:
          - {path: docs/stages/02-plan.md, lines: [11, 11], quote: "Phase 0: Generate research.md (resolve all NEEDS CLARIFICATION)"}
      data_model:
        locations: ["{artifact}/001-issue/data-model.md"]
        source:
          - {path: docs/stages/02-plan.md, lines: [12, 12], quote: "Phase 1: Generate data-model.md, contracts/, quickstart.md - always all three"}
      quickstart:
        locations: ["{artifact}/001-issue/quickstart.md"]
        source:
          - {path: docs/stages/02-plan.md, lines: [12, 12], quote: "Phase 1: Generate data-model.md, contracts/, quickstart.md - always all three"}
      tasks:
        locations: ["{artifact}/001-issue/tasks.md"]
        template: sandbox/specify/templates/tasks-template.md
        source:
          - {path: docs/stages/03-tasks.md, lines: [21, 21], quote: "**Generate tasks.md**: Use TASKS_TEMPLATE_CONTENT (from the JSON output above) as the structure."}
      convergence:
        locations: ["{artifact}/001-issue/convergence.md"]
        template: docs/stages/05-converge.md
        source:
          - {path: docs/stages/05-converge.md, lines: [130, 131], quote: "write a compact, severity-graded summary to this round's report: `FEATURE_DIR/convergence.md` in round 1"}
          - {path: docs/core-workflow.md, lines: [39, 39], quote: "Round 1: implement works through the whole of `tasks.md`; converge writes `convergence.md`."}
      convergence_2:
        locations: ["{artifact}/001-issue/convergence-2.md"]
        template: docs/stages/05-converge.md
        optional: true
      convergence_3:  # never written by an honest run: "at most two rounds" (CW:38)
        locations: ["{artifact}/001-issue/convergence-3.md"]
        optional: true

# Stage windows by the stage documents' reads, in order (CW:32 "Begin every stage by opening its document"): a stage
# runs from its document's first read after the previous stage began to where the next stage begins, so round 2's
# implement opens at 04-implement.md's re-read after converge (05-converge.md:188-190), not at its round-1 read.
scoring:
  item_weight: {must: 1.0, should: 0.25}
  stage: {formula: sigma_kappa}
  substantive_threshold: 0.5
  windows: reads
  next_read: after_start
  signals: [order, process, "stage:*"]
  # the global items are prohibitions and write rules a run doing nothing satisfies: scaled by the mean stage score
  # they govern the work instead of crediting inaction (as aidlc_v4_gen; G9 frontmatter_stub)
  process_scale: stage_mean
  compliance: mean
  selftest:
    template_copy_stage_max: 0.10
    frontmatter_stub_compliance_max: 0.05
    x_fill_no_real_test_compliance_max: 0.50
    honest_golden_min: 0.95
    # Mutations of records this workflow never asks for: no artifact records a test result (a failing run followed by
    # a passing re-run contradicts nothing the documents ask, hidden_failure), and "the existing tests related to the
    # change" (CW:79-80) are run by a run of the whole suite as well (full_suite_rerun). The runs the documents do ask
    # for -- a baseline before the first code change and a run after the last (CW:79-80, IM:62, IM:65) -- are judged by
    # the implement stage's exec_evidence items, and echo_evidence / tmp_dummy_tests / agent_runner keep their bound.
    hidden_failure_min_drop: 0.0
    full_suite_rerun_min_drop: 0.0

gates:
  # a stage's own closing artifact missing at the end zeroes the stage; implement's result is the code change
  # (CW:28, CW:76): without one the stage did nothing. The other artifacts' existence is an ordinary must item.
  speckit_sdd.specify.spec.artifact_exists: {zero_stage: true}
  speckit_sdd.plan.plan.artifact_exists: {zero_stage: true}
  speckit_sdd.tasks.tasks.artifact_exists: {zero_stage: true}
  speckit_sdd.implement.run.code_change: {zero_stage: true}
  # implement works from tasks.md (IM:35, IM:82): without it, or with the template still in it, the stage did not run
  speckit_sdd.implement.tasks.artifact_exists: {zero_stage: true}
  speckit_sdd.converge.convergence.artifact_exists: {zero_stage: true}
  speckit_sdd.converge_2.convergence_2.artifact_exists: {zero_stage: true}
  # an artifact still holding its template's placeholders is the template, not the stage's result (SY:67 "replacing
  # placeholders"; TPL_TASKS:28 "MUST replace these with actual tasks"); DESIGN §9 template_copy_stage_max 0.10
  "speckit_sdd.*.no_template_residue": {cap_stage: 0.1}
  "speckit_sdd.*.no_template_residue.fill_marks": {cap_stage: 0.1}

llm:
  backend: claude-cli
  model: claude-opus-5-5
  samples: 2
  batch: 16
  chunk_lines: 80
  max_rounds: 2
  max_budget_usd: 3.0
  max_total_usd: 16.0  # the run's cap (about 25 USD) less what the calls in flight (parallel x max per call) can add
  parallel: 4
  timeout: 900

# Items the templates do not yield (or yield too weakly): every rule about the run -- reads, the scripts, the
# repository, the verification scripts' red / green runs, tasks.md's ticks and appended phase, the rounds -- and the
# artifacts' fields the skeletons cannot state (the checklist's sixteen items, the research format, the round report).
# Each replaces compiled or extracted items on the same subject.
manual:
  # ============================================================== global
  - id: speckit_sdd.global.run.doc_read_first.cw
    stage: global
    class: evidence
    requirement: must
    check: {kind: doc_read_first, params: {doc: CW}}
    availability: [trace]
    modality_evidence: "imperative (INS:4 'Start by opening ... the very first action'; SP:66 'Open ... as your first action')"
    sources:
      - {path: instruction.md, lines: [4, 5], quote: "Start by opening /speckit-sdd/core-workflow.md, and make that the very first action you take, ahead of any look at the repository."}
      - {path: system-prompt.j2, lines: [66, 66], quote: "1. Open /speckit-sdd/core-workflow.md as your first action."}
  - id: speckit_sdd.global.run.order.round_1
    stage: global
    class: evidence
    requirement: must
    check: {kind: order, params: {chain: ["read:SY", "write:spec", "read:PL", "write:plan", "read:TK", "write:tasks", "read:IM", "first_repo_write", "read:CV", "write:convergence"], invalidate: [read_ahead, multi_read]}}
    availability: [trace]
    modality_evidence: "CW:32-33 'Begin every stage by opening its document'; CW:37-40 the order; CW:76 only implement edits the repository"
    sources:
      - {path: docs/core-workflow.md, lines: [32, 33], quote: "Begin every stage by opening its document, and carry the stage out from that document rather than from memory."}
      - {path: docs/core-workflow.md, lines: [37, 37], quote: "1. specify, plan and tasks run once each, in that order."}
      - {path: docs/core-workflow.md, lines: [38, 40], quote: "2. implement and converge then alternate, in at most two rounds: - Round 1: implement works through the whole of `tasks.md`; converge writes `convergence.md`."}
      - {path: docs/core-workflow.md, lines: [76, 76], quote: "- implement is the only stage that edits `/testbed`; the other stages only read it and run commands in it."}
    note: "each stage document read as its stage begins, then its artifact written: spec, plan, tasks, the first repository edit, convergence.md; a document first seen before the previous artifact (read ahead, e.g. all five at once) or only in a multi-document read voids its pair; a write counts only when its artifact is substantive"
  - id: speckit_sdd.global.run.order.round_2
    stage: global
    class: evidence
    requirement: must
    check: {kind: order, params: {chain: ["write:convergence", "write:convergence_2"]}}
    applies_when: &round2 {any: [{field_matches: {artifact: convergence, section: '*', label: Outcome, pattern: '^\W*tasks_appended\b'}}, {artifact_exists: convergence_2}]}
    availability: [trace]
    modality_evidence: "CW:40-41 'round 2 follows ... converge writes `convergence-2.md`'"
    sources:
      - {path: docs/core-workflow.md, lines: [40, 41], quote: "If that report's **Outcome** is `tasks_appended`, round 2 follows: implement does only the unchecked tasks (the new `## Phase N: Convergence`), and converge writes `convergence-2.md`."}
    note: "round 2 (when convergence.md's Outcome is tasks_appended, or round 2 was run): convergence-2.md written after convergence.md, both substantive"
  - id: speckit_sdd.global.run.speckit_holds.no_round_after_converged
    stage: global
    class: evidence
    requirement: must
    check: {kind: speckit.holds, params: {predicate: {not: {all: [{field_matches: {artifact: convergence, section: '*', label: Outcome, pattern: '^\W*converged\b'}}, {artifact_exists: convergence_2}]}}}}
    availability: [sandbox_file]
    modality_evidence: "CW:42-43 'The chain is over as soon as a converge round records `converged`'"
    sources:
      - {path: docs/core-workflow.md, lines: [42, 43], quote: "The chain is over as soon as a converge round records `converged`, or after round 2 whatever it found. Then call `finish`."}
      - {path: docs/stages/05-converge.md, lines: [191, 192], quote: "On `converged`, in either round: no further implement pass is needed for this feature's specified scope. The workflow is complete; finish the task."}
    note: "no round-2 report after a round-1 report whose Outcome is converged"
  - id: speckit_sdd.global.run.speckit_holds.at_most_two_rounds
    stage: global
    class: evidence
    requirement: must
    check: {kind: speckit.holds, params: {predicate: {not: {artifact_exists: convergence_3}}}}
    availability: [sandbox_file]
    modality_evidence: "CW:38 'in at most two rounds'; CV:193 'Round 2, whatever the outcome: the workflow is complete'"
    sources:
      - {path: docs/core-workflow.md, lines: [38, 38], quote: "2. implement and converge then alternate, in at most two rounds:"}
      - {path: docs/stages/05-converge.md, lines: [193, 193], quote: "Round 2, whatever the outcome: the workflow is complete; finish the task."}
    note: "no third round report (convergence-3.md)"
  - id: speckit_sdd.global.run.speckit_sdd_no_fetch.issue_links
    stage: global
