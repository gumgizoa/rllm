    a passing run with the script not rewritten in between (red_green, ratio); a failing run before the stage''s first code
    change (before_code); each script''s last run passing after the last code change (pass_last); pass / fail by the call''s
    own exit code when the script is the command''s last segment, else by failure / pass text no other segment of the command
    could print'
