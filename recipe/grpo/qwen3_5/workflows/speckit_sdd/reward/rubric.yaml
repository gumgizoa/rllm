conflicts:
- type: documented
  description: 'Rounds: the stage documents describe one implement and one converge stage; core-workflow.md alternates them
    in at most two rounds, round 2 only when convergence.md''s Outcome is tasks_appended (CW:38-43)'
  resolution: seven stages (specify, plan, tasks, implement, converge, implement_2, converge_2); the round-2 stages' items
    apply when convergence.md's Outcome is tasks_appended or convergence-2.md exists, and convergence-2.md's existence (zero_stage)
    when the Outcome is tasks_appended; a stage with no applicable item is no signal, so a round-1 converged run is scored
    on five stages, order and process; a round-2 report after converged, or a third report, fails a global item
  items: []
  sources:
  - path: docs/core-workflow.md
    lines:
    - 38
    - 41
    quote: '2. implement and converge then alternate, in at most two rounds: - Round 1: implement works through the whole
      of `tasks.md`; converge writes `convergence.md`. - If that report''s **Outcome** is `tasks_appended`, round 2 follows:
      implement does only the unchecked tasks (the new `## Phase N: Convergence`), and converge writes `convergence-2.md`.'
  - path: docs/stages/05-converge.md
    lines:
    - 188
    - 190
    quote: '- On `tasks_appended` in round 1: open the implement stage document (`/speckit-sdd/stages/04-implement.md`) again
      and complete the new Convergence phase''s tasks (round 2), then return to this document and write `convergence-2.md`.'
- type: documented
  description: 'Stage windows: every stage begins by opening its document (CW:32-33), the round-2 stages open the same documents
    again (CV:188-190); no line forbids reading a later stage''s document early'
  resolution: 'a stage''s window opens at its document''s first read after the previous stage began (scoring.next_read: after_start
    in reads mode), so round 2 opens at the re-reads and a read ahead opens nothing early; each stage''s read is judged in
    its own window, and the round-1 order item voids a document first seen before the previous artifact (e.g. all five at
    once)'
  items: []
  sources:
  - path: docs/core-workflow.md
    lines:
    - 32
    - 33
    quote: Begin every stage by opening its document, and carry the stage out from that document rather than from memory.
- type: documented
  description: 'The shipped constitution is the unfilled template: the stages load it (SY:41, PL:5, TK:8, IM:40), but it holds
    no principle, so plan writes ''skipped — template'' and converge skips its checks (PL:9, CV:31-32)'
  resolution: the loads are required where a stage document says so (must, in the stage's window; converge's 'if not an unfilled
    template' load is not); plan.md's Constitution Check says 'skipped — template' (must); the round report's metrics line
    says so (should); no constitution principle is checked
  items: []
  sources:
  - path: docs/stages/02-plan.md
    lines:
    - 9
    - 9
    quote: write "skipped — template" in Constitution Check and evaluate no gate
  - path: docs/stages/05-converge.md
    lines:
    - 31
    - 32
    quote: If the constitution is an unfilled template, skip constitution checks gracefully rather than failing.
- type: documented
  description: 'N/A: the spec must not leave a section as N/A (SY:147), while data-model.md / quickstart.md with nothing to
    hold are the one line ''N/A — <reason>'' (PL:43) and plan.md''s tree may say ''contracts/  # N/A — <reason>'''
  resolution: 'different artifacts, both rules kept: no N/A-only line in spec.md; a Phase 1 file is content or one ''N/A —
    <reason>'' line (a bare N/A fails); the contracts line lists the contract files or gives its reason'
  items: []
  sources:
