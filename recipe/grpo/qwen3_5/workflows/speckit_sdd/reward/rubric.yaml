- type: documented
  description: 'Tests: ''Tests are OPTIONAL'' upstream (TK:43, the template''s ''(OPTIONAL - only if tests requested)'' headings),
    but here the task message is the request: every story gets test tasks, as verification scripts under checks/ (TK:43, CW:77-79)'
  resolution: every story phase needs a 'Tests for User Story N' part naming a checks/ file (must; the heading matched by
