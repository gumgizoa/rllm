appendix:
  rules_without_items:
    covered by another rule's items:
      B2: B1 (the artifact at its fixed path)
      B5a: B6a (frontmatter keys)
      B5c: the per-field rules (field prefixes)
      B9: the reference checks (R ids, steps quoted as written)
      E5: B5b@2 and the S2 fields (the three categories)
      F2c: the step parse behind the S3 fields and tags
      G1b: G9, G2
      G3b: H12, F8b, S4.checks
      G4a: D13
      H16: run/fidelity
      I2: D11a's reading of a test run (agent-written runner scripts are no run)
      B5d: S1.recorded, S4.executed (the skeleton's two fixed sentences)
    a flag, in no score:
      I1: leak_history
    not applicable:
      A4: document lookup order
      A5: an overall instruction
      G6a: resolve, the task verifier's
      G6b: the task verifier's tests
    judge, low priority, not asked:
      B7: unresolved work only under Outstanding Failures
      D2: the scope extends to direct callers and callees
      E2: stage 1's result used as context
      F6: the steps in an order that can be carried out
      H8b: a regression suspects the contract first
      H8c: pre-existing failures left unfixed
    not a judge question:
      D1a: whether Files is the right source needs the repository; code checks the files were opened (check/e1_scope_viewed)
      D1b: same; code checks the issue's paths are in scope (atom/D1b)
