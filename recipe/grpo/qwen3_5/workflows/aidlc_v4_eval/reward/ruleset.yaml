- {at: 'S1:21', text: '**Do NOT** enumerate packages unrelated to the issue, or survey the repository beyond the files identified above.', rules: [D4b, D4c]}
- {at: 'S1:25', text: '- [ ] Determine how the affected module is built or type-checked, if the language requires it', rules: [D6]}
- {at: 'S1:26', text: '- [ ] Determine how its tests are invoked', rules: [D7a]}
- {at: 'S1:27', text: '- [ ] Express the test command so that it can target **the tests covering the affected scope**, not the whole suite', rules: [D7b]}
- {at: 'S1:28', text: '- [ ] Prefer output-reducing flags (for example `-q`, `--tb=short`) so that results remain readable', rules: [D8]}
