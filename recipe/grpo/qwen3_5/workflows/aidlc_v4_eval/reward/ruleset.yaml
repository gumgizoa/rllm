    check/e1_baseline_none: [AP, COLLECT, NONE, TEST, EDIT]
- id: D12e
  stage: 1
  kind: A
  text: 01 Passing에 적은 테스트는 baseline 실행에서 실제로 통과함
  methods:
    check/e1_baseline_passing: [AP, COLLECT, NONE, TEST, EDIT]
- id: D12b
  stage: 1
  kind: F
  text: 테스트를 하나씩 이름으로, 한 줄에 하나씩 적음
  methods:
    atom/D12b: [AP, COLLECT, NONE]
- id: S1.files
  stage: 1
  kind: F
  text: 01 필드 Files
