- {at: 'S1:8', text: '- The task description (PR/issue text) is available', skip: 전제}
- {at: 'S1:9', text: '- The repository is available and can already be built and tested', skip: 전제}
- {at: 'S1:15', text: '- [ ] Locate the source files the issue refers to, using symbol names, keywords, error strings, or stack traces from the task description. If the task description names files or symbols directly, start from those', rules: [D1a, D1b]}
- {at: 'S1:16', text: '- [ ] Extend to files directly connected to those files (direct callers and callees) where the description implies it', rules: [D2]}
- {at: 'S1:17', text: '- [ ] Record the module or package that owns those files, and its boundary within the repository', rules: [D3, D3b]}
- {at: 'S1:18', text: '- [ ] Note the language and framework in use — this follows from the files identified; do not survey the repository to establish it', rules: [D4a, D4b]}
