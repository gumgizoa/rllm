- id: S1.passing
  stage: 1
  kind: F
  text: 01 필드 Passing (없으면 none)
  methods:
    form/S1.passing: [AP, COLLECT]
- id: S1.failing
  stage: 1
  kind: F
  text: 01 필드 Failing (없으면 none)
  methods:
    form/S1.failing: [AP, COLLECT]
- id: S1.recorded
  stage: 1
  kind: F
  text: 01 고정 문장 'Recorded before any source file was modified.'
  methods:
    atom/B5d: [AP, COLLECT]
- id: E1a
  stage: 2
  kind: Q
  text: task 설명(기대 동작·이름·시그니처·경로)을 권위로 삼음
  methods:
    judge/E1a: [JUDGE, ISSUE, COLLECT]
- id: E1b
  stage: 2
  kind: Q
  text: 이슈가 정한 동작·인터페이스를 다시 도출하거나 대안을 내지 않음
  methods:
    judge/E1b: [JUDGE, ISSUE, COLLECT]
- id: E1c
  stage: 2
  kind: Q
  text: 이슈가 정한 동작을 뜻이 달라지게(바꾸거나 좁히거나 넓혀) 바꿔 쓰지 않음
  methods:
    judge/E1c: [JUDGE, ISSUE, COLLECT]
- id: E2
  stage: 2
  kind: C
  text: 1단계 결과를 맥락으로 사용함
  excluded:
    why: judge, low priority, not asked
    detail: stage 1's result used as context
- id: E3a
  stage: 2
  kind: Q
  text: 요구사항 하나에 문장 하나
