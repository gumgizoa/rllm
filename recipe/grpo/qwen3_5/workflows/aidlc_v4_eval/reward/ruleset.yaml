# aidlc_v4_eval's rule set: document lines -> atomic rules -> methods (rubric item keys) with their materials.
# Edit by hand; reward/ruleset.py explains the links, `ruleset.py check` reports what is out of step and
# `ruleset.py sync` renumbers moved lines and rewrites what follows (rubric.yaml sources and appendix, ruleset.md).
docs:
  I: {path: instruction.md}
  SP: {path: system-prompt.j2, section: PROBLEM_SOLVING_WORKFLOW}
  CW: {path: docs/core-workflow.md}
  S1: {path: docs/rule-details/01-reverse-engineering.md}
  S2: {path: docs/rule-details/02-requirements-analysis.md}
  S3: {path: docs/rule-details/03-code-generation-planning.md}
  S4: {path: docs/rule-details/04-code-generation-generation.md}
  S5: {path: docs/rule-details/05-build-and-test.md}
materials:
  COLLECT: 산출물 수집 (수집본만 인정)
  TEST: 테스트 실행 인식·출력의 통과/실패 수
  SCRIPT: 재현 스크립트 실행 인식
  EXIT: exit code
  PATCH: 최종 변경 파일 (patch)
  EDIT: trajectory의 편집 파일·시점
  NONE: none 값
  TESTFILE: 테스트 파일 판별
  PATH: 경로 추출·비교
  AP: 산출물 section·field·step parser
  DOC: 문서 읽기 시점
  WRITE: 산출물 쓰기 시점
  TARGET: test id·target 추출
  CMDMATCH: 기록한 명령과 실행 명령 대조
  SEEN: 파일 열람 여부
  SHELLCLS: 그 밖의 명령 분류 (설치, 조회, stash, 반복)
  ISSUE: 이슈 본문 추출
  FINAL: 마지막 응답
  JUDGE: LLM judge (이슈·산출물·단계별 발췌만 봄, trajectory는 안 봄)
  MSG: agent 메시지 (마지막 응답 앞의 것까지)
rules:
- id: A1
  stage: 0
  kind: P
  text: core-workflow.md를 다른 어떤 행동보다 먼저 읽음
  methods:
    run/entry: [DOC]
- id: A2
  stage: 0
  kind: P
  text: 각 단계의 첫 행동으로 그 단계 규칙 문서를 읽음
  methods:
    proc/A2: [DOC, WRITE]
- id: A3a
  stage: 0
  kind: P
  text: 규칙 문서는 한 번에 하나씩 읽음
  methods:
    proc/A3a: [DOC]
- id: A3b
  stage: 0
  kind: P
  text: 이전 단계를 마치기(산출물) 전에 다음 단계 규칙 문서를 읽지 않음
  methods:
    proc/A3b: [DOC, WRITE]
- id: A4
  stage: 0
  kind: P
  text: 규칙 문서 경로 탐색 순서를 따름
  excluded:
    why: not applicable
    detail: document lookup order
- id: A5
  stage: 0
  kind: P
  text: 이 워크플로우가 다른 절차보다 우선함 (전체 지시)
  excluded:
    why: not applicable
    detail: an overall instruction
- id: B1
  stage: 0
  kind: F
  text: 각 단계 결과를 채팅이 아닌 파일로 씀
  methods:
    form/B1: [AP, COLLECT]
- id: B2
  stage: 0
  kind: F
  text: 산출물 경로는 /tmp/swe-bench-pro/<규칙 파일명>
  excluded:
    why: covered by another rule's items
    detail: B1 (the artifact at its fixed path)
- id: B2b
  stage: 0
  kind: P
  text: 첫 산출물을 쓰기 전에 /tmp/swe-bench-pro/를 mkdir -p로 만듦
  excluded:
    why: not applicable
    detail: 'an instrumental step: the edit tool makes the directory, and the artifact at its path is B1''s'
- id: B3a
  stage: 0
  kind: P
  text: 산출물은 한 번의 write로 씀 (덧붙이기·같은 단계 안 다시 쓰기 없음)
  methods:
    rule/r_artifacts_written_once: [WRITE]
    atom/B3a: [WRITE, DOC, EDIT, TEST, SCRIPT]
- id: B3c
  stage: 0
  kind: F
  text: 산출물에 나중에 채울 빈칸·placeholder를 남기지 않음 (전체 내용으로 씀)
  excluded:
    why: covered by another rule's items
    detail: the field items (a placeholder reads as an empty field) and B5b (a missing section)
- id: B3b
  stage: 0
  kind: P
  text: 산출물은 단계 끝에 씀 (다음 단계 문서를 읽기 전)
  methods:
    proc/B3b: [DOC, WRITE]
  note: 'Completion Criteria met first: each criterion''s own timing rule scores it (D11c, G7a, H2, H4b)'
- id: B4a
  stage: 0
  kind: R
  text: 이전 단계 산출물을 다시 쓰지 않음
  methods:
    atom/B4a: [WRITE, DOC, EDIT, TEST, SCRIPT]
- id: B4b
  stage: 0
  kind: Q
  text: 이전 단계와 모순되면 지금 단계 산출물에 deviation·정정·pre-existing으로 기록
  methods:
    judge/B4b: [JUDGE, ISSUE, COLLECT]
- id: B5a
  stage: 0
  kind: F
  text: frontmatter 키를 skeleton대로 씀
  excluded:
    why: covered by another rule's items
    detail: B6a (frontmatter keys)
- id: B5b
  stage: 0
  kind: F
  text: '## 제목을 skeleton대로 씀 (이름 바꾸기·빠뜨리기 금지)'
  methods:
    form/B5b: [AP, COLLECT]
- id: B5c
  stage: 0
  kind: F
  text: 필드 접두어(- Label:)를 skeleton대로 씀
  excluded:
    why: covered by another rule's items
    detail: the per-field rules (field prefixes)
- id: B5d
  stage: 0
  kind: F
  text: 괄호 안만 채우고 skeleton의 나머지 문장은 그대로 둠
  excluded:
    why: covered by another rule's items
    detail: S1.recorded, S4.executed (the skeleton's two fixed sentences)
- id: B6a
  stage: 0
  kind: F
  text: frontmatter는 stage, name 두 키만
  methods:
    form/B6a: [AP, COLLECT]
- id: B6b
  stage: 0
  kind: F
  text: frontmatter stage 값이 파일의 단계와 같음
  methods:
    atom/B6b: [AP, COLLECT]
- id: B6c
  stage: 0
  kind: F
  text: frontmatter name 값이 파일의 단계 이름과 같음
  methods:
    atom/B6c: [AP, COLLECT]
- id: B7
  stage: 5
  kind: Q
  text: 04·05에 언급된 미해결 작업을 모두 Outstanding Failures에 적음 (none으로 포장하지 않음)
  methods:
    judge/B7: [JUDGE, ISSUE, COLLECT, SCRIPT, TEST]
- id: B7b
  stage: 5
  kind: R
  text: Outstanding Failures 밖의 섹션에 미해결 작업을 적지 않음
  methods:
    judge/B7b: [JUDGE, ISSUE, COLLECT]
- id: B8
  stage: 0
  kind: P
  text: 보이는 산출물은 다시 읽지 않고, 내용이 안 보일 때만 복구용으로 읽음
  methods:
    atom/B8: [WRITE, SHELLCLS]
- id: B9
  stage: 0
  kind: C
  text: R id, step 번호, 경로를 바꾸지 않고 그대로 인용함
  excluded:
    why: covered by another rule's items
    detail: the reference checks (R ids, steps quoted as written)
- id: B10
  stage: 0
  kind: R
  text: 산출물 외에 설계·보고서 문서를 만들지 않음
  methods:
    atom/B10: [EDIT]
- id: B11
  stage: 0
  kind: F
  text: 단계마다 산출물 파일은 하나만 씀 (산출물 디렉터리에 다섯 산출물 외 문서를 만들지 않음)
  methods:
    atom/B11: [WRITE, PATH]
- id: C1a
  stage: 0
  kind: P
  text: 다섯 단계를 하나도 빠뜨리지 않고 모두 실행함 (단계 선택·깊이 조정 없음)
  methods:
    proc/C1a: [DOC, WRITE]
- id: C1b
  stage: 0
  kind: P
  text: 단계를 1→5 순서대로 실행함 (앞 단계 산출물 뒤에 다음 단계 산출물)
  methods:
    proc/C1b: [WRITE]
- id: C2
  stage: 0
  kind: P
  text: 이전 단계로 돌아가지 않음 (문제는 드러난 단계에서 처리)
  methods:
    atom/C2: [DOC, WRITE]
- id: E10a
  stage: 0
  kind: R
  text: 질문 파일을 만들지 않음
  methods:
    atom/E10a: [EDIT]
- id: E10b
  stage: 0
  kind: P
  text: 입력을 기다리며 끝내지 않음 (마지막 응답이 질문·승인 요청이 아님)
  methods:
    atom/E10b: [FINAL]
- id: E10c
  stage: 0
  kind: P
  text: 중간에도 사용자에게 승인을 묻지 않음
  methods:
    atom/E10c: [MSG]
- id: D9
  stage: 0
  kind: R
  text: 의존성 설치·환경 설정을 하지 않음 (계획도 하지 않음)
  methods:
    rule/r_no_env_setup: [SHELLCLS]
- id: I1
  stage: 0
  kind: R
  text: 정답을 git history에서 가져오지 않음 (task 조건)
  source: task
  excluded:
    why: a flag, in no score
    detail: leak_history
- id: I2
  stage: 0
  kind: R
  text: 가짜 테스트로 실행을 꾸미지 않음 (task 조건)
  source: task
  methods:
    run/ran_real_test: [TEST]
- id: D1a
  stage: 1
  kind: Q
  text: 이슈가 가리키는 소스 파일을 찾아 Affected Scope에 적음
  methods:
    check/e1_scope_viewed: [AP, COLLECT, PATH, SEEN, WRITE]
  note: 'not a judge question: whether Files is the right source needs the repository; code checks the files were opened (check/e1_scope_viewed)'
- id: D1b
  stage: 1
  kind: P
  text: 이슈가 파일·심볼을 직접 지목하면 거기서 시작함
  methods:
    atom/D1b: [AP, COLLECT, ISSUE, PATH, SEEN, TESTFILE]
  note: 'not a judge question: same; code checks the issue''s paths are in scope (atom/D1b)'
- id: D2
  stage: 1
  kind: Q
  text: 직접 연결된 파일(호출자·피호출자)까지 확장함
  excluded:
    why: judge, low priority, not asked
    detail: the scope extends to direct callers and callees
- id: D3
  stage: 1
  kind: Q
  text: Owning module이 Files가 속한 모듈·패키지임
  methods:
    judge/D3: [JUDGE, ISSUE, COLLECT, SEEN]
- id: D3b
  stage: 1
  kind: Q
  text: Owning module에 저장소 안의 경계(디렉터리 등)를 적고, 그 경계가 Files를 포함함
  methods:
    judge/D3b: [JUDGE, ISSUE, COLLECT]
- id: D4a
  stage: 1
  kind: Q
  text: 언어·프레임워크를 Files에서 판단해 기록함
  methods:
    atom/D4a: [AP, COLLECT]
- id: D4b
  stage: 1
  kind: R
  text: 1단계에서 repo를 넓게 조사하지 않음
  methods:
    atom/D4b: [SHELLCLS, WRITE, EDIT]
- id: D4c
  stage: 1
  kind: R
  text: Affected Scope에 이슈와 무관한 패키지·모듈을 나열하지 않음
  methods:
    judge/D4c: [JUDGE, ISSUE, COLLECT]
- id: D5
  stage: 1
  kind: F
  text: 모든 경로를 repo root부터 전체 경로로 적음
  methods:
    atom/D5: [AP, COLLECT, PATH, SEEN]
- id: D5b
  stage: 1
  kind: F
  text: 01 Files에 경로를 한 줄에 하나씩 적음
  methods:
    atom/D5b: [AP, COLLECT, PATH]
- id: D6
  stage: 1
  kind: Q
  text: build·type-check 방법을 정함 (언어가 요구하면)
  methods:
    check/e1_build_command_run: [AP, COLLECT, NONE, CMDMATCH]
    judge/D6: [JUDGE, ISSUE, COLLECT, SEEN]
- id: D7a
  stage: 1
  kind: Q
  text: 테스트를 어떻게 실행하는지 정함
  methods:
    check/e1_test_command_run: [AP, COLLECT, CMDMATCH, TARGET]
- id: D7b
  stage: 1
  kind: Q
  text: 테스트 명령이 해당 범위의 테스트를 대상으로 함 (전체 suite 아님)
  methods:
    atom/D7b: [AP, COLLECT, NONE, TARGET]
- id: D8
  stage: 1
  kind: E
  text: 출력을 줄이는 옵션(-q, --tb=short)을 씀
  methods:
    atom/D8: [AP, COLLECT]
- id: D10a
  stage: 1
  kind: E
  text: 해당 범위를 덮는 기존 테스트를 찾음
  methods:
    check/e1_test_path_seen: [AP, COLLECT, PATH, SEEN]
    atom/D10a: [SEEN, TESTFILE, TEST, WRITE]
- id: D10b
  stage: 1
  kind: Q
  text: 기존 테스트가 강제하는 계약(시그니처·반환·예외)을 맞게 파악해 Contract에 적음
  methods:
    judge/D10b: [JUDGE, ISSUE, COLLECT, SEEN]
- id: D10c
  stage: 1
  kind: E
  text: 찾은 기존 테스트 파일을 실제로 엶
  excluded:
    why: covered by another rule's items
    detail: D10a (atom/D10a, check/e1_test_path_seen)
- id: D11a
  stage: 1
  kind: E
  text: 소스를 고치기 전에 그 테스트를 한 번 실행함 (baseline)
  methods:
    check/t1_baseline_before_edit: [TEST, EDIT]
- id: D11c
  stage: 1
  kind: E
  text: baseline 테스트를 실행한 뒤 그 결과를 01에 적음 (실행 전에 쓰지 않음)
  methods:
    check/t1_baseline_before_write: [AP, COLLECT, NONE, TEST, WRITE]
- id: D11b
  stage: 1
  kind: P
  text: 1단계 산출물을 소스 수정 전에 씀
  methods:
    check/t1_no_edit_before_write: [EDIT, WRITE]
- id: D12a
  stage: 1
  kind: A
  text: 01 Baseline에 적은 테스트 이름이 baseline 실행 출력에 있음
  methods:
    check/e1_baseline_tests: [AP, COLLECT, TEST, EDIT, TARGET]
- id: D12c
  stage: 1
  kind: A
  text: 01 Failing 기록이 baseline 실행 결과와 맞음 (none이면 실패가 없음)
  methods:
    check/e1_baseline_failing: [AP, COLLECT, NONE, TEST, EDIT, TARGET]
- id: D12d
  stage: 1
  kind: A
  text: Passing·Failing이 둘 다 none이면 baseline 실행에서 돈 테스트가 없음
