# Generator config for agentos_v2: what the generator cannot read off the workflow's documents.
#
# The agent sees docs/ at /agent-os -- core-workflow.md (the package author's hand-written definition of the run: the
# four commands in order, the spec folder, the self-answered questions, the repository rules, when to finish) and
# commands/<cmd>/<cmd>.md for shape-spec, write-spec, create-tasks and implement-tasks (Agent OS v2.1.1's compiled
# command documents as build.py renders them, each with its coding standards written out under "User Standards &
# Preferences Compliance") -- plus instruction.md and the system prompt. Nothing else is shipped: the spec folder
# (/tmp/agent-os/specs/<YYYY-MM-DD>-<name>/) is what the run writes. porting/, README.md and build.py are the author's
# notes and tooling, never shown to the agent and never a source. Every decision below cites the line it rests on;
# paths are relative to this package.
workflow: agentos_v2
prefix: agentos_v2

ids:
  docs/core-workflow.md: CW
  docs/commands/shape-spec/shape-spec.md: SS
  docs/commands/write-spec/write-spec.md: WS
  docs/commands/create-tasks/create-tasks.md: CT
  docs/commands/implement-tasks/implement-tasks.md: IT
  instruction.md: INS
  system-prompt.j2: SP

roles:
  - docs/core-workflow.md: core
  - docs/commands/*/*.md: command

system_prompt:
  sections:
    PROBLEM_SOLVING_WORKFLOW: workflow
    "*": harness_generic

# core-workflow.md is the workflow's own definition (hand-written for this package, it adapts no upstream text: the
# package docstring "core-workflow.md (hand-written, no upstream counterpart) strings them together"), and the command
# documents are the workflow's text: like speckit_bug / speckit_sdd / openspec_ff, no item is adapter-derived.
adapter_roles: [adapter]

# A command is carried out from its document (CW:14 "work from that document rather than from memory"), which gives
# each file's structure; core-workflow.md sets the order, the spec folder and the repository rules around them, and
# replaces the system prompt's default procedure (CW:6-7).
precedence:
  - order: [command, core, "system_prompt:workflow", instruction, "system_prompt:harness_generic"]
    applies_to: all
    authority:
      path: docs/core-workflow.md
      lines: [14, 14]
      quote: "Open each command document when you reach it, and work from that document rather than from memory:"

# Each command document repeats the coding standards it applies (CW:30-32), a list of `- **Name**: practice` bullets
# under "User Standards & Preferences Compliance" (SS:306-359, WS:107-272, CT:223-388, IT:47-212). They are guidance on
# how code is written ("Meaningful Names", "Fail Fast"), which no rule over the trace or the artifacts can judge; an
# item a model maps from one of them is dropped. The pattern needs a lowercase letter in the bold name, so the
# command's own `- **MANDATORY**: Always run bash command ...` (SS:292) stays.
overrides:
  - pattern: '(?m)^- \*\*[A-Z][a-z][A-Za-z ,/&+()-]{1,60}\*\*: [A-Z]'
    path: "docs/commands/*/*.md"
    action: drop
    reason: "a coding-standard bullet (the standards each command document writes out, CW:30-32): guidance on how code is written, not checkable on the trace or the artifacts"

classify:
  # SS:212-288 / WS:59-93: bracketed spans are the placeholders ("[Spec Name]", "[your answer]", "[1-2 sentences
  # describing the core objective]"), except the checkbox states and markdown links. The conditional lines
  # ("[If your search found no similar features]", "[If mockups provided]") are placeholders of their sections.
  agentos:
    brackets: true
    placeholder:
      - '<!--.*?-->'
    legit:
      - '\[[ xX]\]'
      - '\[[^\[\]\n]+\]\([^)\s]+\)'
    markers:
      mandatory: []
      optional: []
      conditional: []
    none_tokens: [none, "n/a", "not applicable"]
  # the report (IT:251-310): the Status lines offer value choices `✅ Passed | ⚠️ Passed with Issues | ❌ Failed`, which
  # the report picks one of (enum items below); `**Verifier:** implementation-verifier` is fixed text (kept verbatim
  # upstream); the Completed Tasks list shows the shape of an entry (`- [x] Task Group 1: [Title]`)
  report:
    brackets: true
    placeholder:
      - '<!--.*?-->'
      - '[✅⚠❌][^|\n]*(?:\|\s*[✅⚠❌][^|\n]*)+$'
    legit:
      - '\[[ xX]\]'
      - '\[[^\[\]\n]+\]\([^)\s]+\)'
    literal:
      - '^\*\*Verifier:\*\*\s+implementation-verifier\s*$'
    markers:
      mandatory: []
      optional: []
      conditional: []
    none_tokens: [none]

templates:
  - id: requirements
    path: docs/commands/shape-spec/shape-spec.md
    block: {fence: markdown, index: 0}
    artifact: requirements
    stage: shape_spec
    rules: agentos
    literals: patterns
    binding:
      path: docs/commands/shape-spec/shape-spec.md
      lines: [210, 210]
      quote: "Use the following structure and do not deviate from this structure when writing your gathered information to `requirements.md`."
    binding_requirement: must
    sections:
      # the **Q1:** / **Answer:** pairs repeat per question (SS:222-228 "[Continue for all questions]"): their count,
      # numbering and the assumed-answer format are manual items
      First Round Questions:
        requirement: skip
        authority: {path: docs/commands/shape-spec/shape-spec.md, lines: [228, 228], quote: "[Continue for all questions]"}
      # two alternatives: the Similar Features labels, or "No similar existing features identified for reference."
      # (SS:233-239); a manual item accepts either
      Existing Code to Reference:
        requirement: skip
        authority: {path: docs/commands/shape-spec/shape-spec.md, lines: [238, 239], quote: "[If your search found no similar features] No similar existing features identified for reference."}
      Follow-up Questions:
        requirement: skip
        authority: {path: docs/commands/shape-spec/shape-spec.md, lines: [242, 242], quote: "[If any were asked]"}
      # the Visual Assets alternatives (SS:247-261): files and insights, or "No visual assets provided." when the bash
      # check found none -- the visuals folder stays empty in this run (CW:53); manual items
      Visual Assets:
        requirement: skip
        authority: {path: docs/commands/shape-spec/shape-spec.md, lines: [260, 261], quote: "[If bash check found no files] No visual assets provided."}
      Files Provided:
        requirement: skip
        authority: {path: docs/commands/shape-spec/shape-spec.md, lines: [250, 250], quote: "[Based on actual bash check, not user statement]"}
      Visual Insights:
        requirement: skip
        authority: {path: docs/commands/shape-spec/shape-spec.md, lines: [260, 261], quote: "[If bash check found no files] No visual assets provided."}
  - id: spec
    path: docs/commands/write-spec/write-spec.md
    block: {fence: markdown, index: 0}
    artifact: spec
    stage: write_spec
    rules: agentos
    literals: patterns
    binding:
      path: docs/commands/write-spec/write-spec.md
      lines: [57, 57]
      quote: "Follow this structure exactly when creating the content of `spec.md`:"
    binding_requirement: must
    sections:
      # "[If mockups provided]": no mockups in this run (CW:53, the visuals folder stays empty)
      Visual Design:
        requirement: skip
        authority: {path: docs/commands/write-spec/write-spec.md, lines: [77, 77], quote: "[If mockups provided]"}
      # the bold-named requirement blocks and their bullets (WS:71-74) are a manual item
      Specific Requirements:
        requirement: skip
        authority: {path: docs/commands/write-spec/write-spec.md, lines: [74, 74], quote: "[repeat for up to a max of 10 specific requirements]"}
      Existing Code to Leverage:
        requirement: skip
        authority: {path: docs/commands/write-spec/write-spec.md, lines: [89, 89], quote: "[repeat for up to 5 existing code areas]"}
  - id: final_verification
    path: docs/commands/implement-tasks/implement-tasks.md
    block: {fence: markdown, index: 0}
    artifact: final_verification
    stage: implement_tasks
    rules: report
    literals: patterns
    binding:
      path: docs/commands/implement-tasks/implement-tasks.md
      lines: [249, 249]
      quote: "The content of this report should follow this structure:"
    sections:
      # "⚠️ No Updates Needed" (IT:235): no roadmap item is marked, so the list of updated items stays empty
      Updated Roadmap Items:
        requirement: skip
        authority: {path: docs/commands/implement-tasks/implement-tasks.md, lines: [235, 235], quote: "In section 2 of the report (Roadmap Updates), record Status `⚠️ No Updates Needed` with that reason in its Notes."}
      # the shape of an entry (`- [x] Task Group 1: [Title]`); its content is the run's task groups
      Completed Tasks:
        requirement: skip
        authority: {path: docs/commands/implement-tasks/implement-tasks.md, lines: [272, 276], quote: "- [x] Task Group 1: [Title] - [x] Subtask 1.1 - [x] Subtask 1.2 - [x] Task Group 2: [Title] - [x] Subtask 2.1"}

# CW:12-28: shape-spec, write-spec, create-tasks, implement-tasks, each once, in this order ("There are no repeat
# rounds", CW:28). The spec folder is created once by shape-spec under /tmp/agent-os/specs/ with a dated name the agent
# chooses (CW:43-45), so it is a var bound from the sandbox (any one directory there; the name's format is a manual
# item). implement-tasks has no artifact of its own before its report: it edits the repository and ticks tasks.md;
# its report closes it.
stage_model:
  fixed:
    roots:
      artifact: /tmp/agent-os/specs
      code: "{WORKDIR}"
    vars:
      SPEC: {under: "{artifact}", regex: '[^./][^/]*', bind: single}
    stages:
      - id: shape_spec
        doc: docs/commands/shape-spec/shape-spec.md
        artifacts: [spec_dir, initialization, visuals_dir, implementation_dir, verifications_dir, requirements]
        order_artifact: requirements
      - id: write_spec
        doc: docs/commands/write-spec/write-spec.md
        artifacts: [spec]
        order_artifact: spec
        requires: [requirements]
      - id: create_tasks
        doc: docs/commands/create-tasks/create-tasks.md
        artifacts: [tasks]
        order_artifact: tasks
        requires: [spec, requirements]
      - id: implement_tasks
        doc: docs/commands/implement-tasks/implement-tasks.md
        artifacts: [final_verification]
        order_artifact: final_verification
        requires: [tasks]
    artifacts:
      spec_dir:
        locations: ["{artifact}/{SPEC}"]
        kind: dir
        source:
          - {path: docs/core-workflow.md, lines: [43, 44], quote: "shape-spec creates the spec folder once, as `/tmp/agent-os/specs/<YYYY-MM-DD>-<name>/`: today's date and a short kebab-case name you choose for the change."}
      initialization:
        locations: ["{artifact}/{SPEC}/planning/initialization.md"]
        source:
          - {path: docs/commands/shape-spec/shape-spec.md, lines: [61, 61], quote: "Write the issue text from `<issue_description>` to `$SPEC_PATH/planning/initialization.md` exactly as given, without modification."}
      visuals_dir:
        locations: ["{artifact}/{SPEC}/planning/visuals"]
        kind: dir
        source:
          - {path: docs/commands/shape-spec/shape-spec.md, lines: [46, 46], quote: "mkdir -p $SPEC_PATH/planning/visuals"}
      implementation_dir:
        locations: ["{artifact}/{SPEC}/implementation"]
        kind: dir
        source:
          - {path: docs/commands/shape-spec/shape-spec.md, lines: [53, 55], quote: "Create 2 folders: - `$SPEC_PATH/implementation/` - `$SPEC_PATH/verifications/`"}
      verifications_dir:
        locations: ["{artifact}/{SPEC}/verifications"]
        kind: dir
        source:
          - {path: docs/commands/shape-spec/shape-spec.md, lines: [53, 55], quote: "Create 2 folders: - `$SPEC_PATH/implementation/` - `$SPEC_PATH/verifications/`"}
      requirements:
        locations: ["{artifact}/{SPEC}/planning/requirements.md"]
        template: docs/commands/shape-spec/shape-spec.md
        source:
          - {path: docs/commands/shape-spec/shape-spec.md, lines: [208, 208], quote: "After all questions are answered, record ALL gathered information to ONE FILE at this location with this name: `[spec-path]/planning/requirements.md`"}
      spec:
        locations: ["{artifact}/{SPEC}/spec.md"]
        template: docs/commands/write-spec/write-spec.md
        source:
          - {path: docs/commands/write-spec/write-spec.md, lines: [51, 51], quote: "Write the main specification to `/tmp/agent-os/specs/[current-spec]/spec.md`."}
      tasks:
        locations: ["{artifact}/{SPEC}/tasks.md"]
        template: docs/commands/create-tasks/create-tasks.md
        source:
          - {path: docs/commands/create-tasks/create-tasks.md, lines: [40, 40], quote: "Generate `/tmp/agent-os/specs/[current-spec]/tasks.md`."}
      final_verification:
        locations: ["{artifact}/{SPEC}/verifications/final-verification.md"]
        template: docs/commands/implement-tasks/implement-tasks.md
        source:
          - {path: docs/commands/implement-tasks/implement-tasks.md, lines: [247, 247], quote: "Create your final verification report in `/tmp/agent-os/specs/[this-spec]/verifications/final-verification.md`."}

# Stage windows by the command documents' reads, in order (CW:14 "Open each command document when you reach it"): a
# stage runs from its document's first read after the previous stage began to where the next stage begins. Each
# document is read once (no rounds), so this is the plain document-read window; next_read keeps a document read ahead
# (all four at the start) from opening a later stage early -- the order item judges the read-ahead.
scoring:
  item_weight: {must: 1.0, should: 0.25}
  stage: {formula: sigma_kappa}
  substantive_threshold: 0.5
  windows: reads
  next_read: after_start
  signals: [order, process, "stage:*"]
  # the global items are prohibitions and write rules a run doing nothing satisfies: scaled by the mean stage score
  # they govern the work instead of crediting inaction (as aidlc_v4_gen; G9 frontmatter_stub)
  process_scale: stage_mean
  compliance: mean
  selftest:
    template_copy_stage_max: 0.10
    frontmatter_stub_compliance_max: 0.05
    x_fill_no_real_test_compliance_max: 0.50
    honest_golden_min: 0.95

gates:
  # a stage's own closing artifact missing at the end zeroes the stage; implement-tasks' result is the code change
  # (CW:81-83: only implement-tasks PHASE 2 changes /testbed): without one the stage did nothing
  agentos_v2.shape_spec.requirements.artifact_exists: {zero_stage: true}
  agentos_v2.write_spec.spec.artifact_exists: {zero_stage: true}
  agentos_v2.create_tasks.tasks.artifact_exists: {zero_stage: true}
  agentos_v2.implement_tasks.run.code_change: {zero_stage: true}
  # implement-tasks works from tasks.md (IT:19): without it the stage did not run
  agentos_v2.implement_tasks.tasks.artifact_exists: {zero_stage: true}
  # a tasks.md without a single task group is no task breakdown (CT:26 "broken into groups with sub-tasks")
  agentos_v2.create_tasks.tasks.item_format.groups: {zero_stage: true}
  # an artifact still holding its template's placeholders is the template, not the command's result; DESIGN §9
  # template_copy_stage_max 0.10
  "agentos_v2.*.no_template_residue": {cap_stage: 0.1}
  "agentos_v2.*.no_template_residue.*": {cap_stage: 0.1}

llm:
  backend: claude-cli
  model: claude-opus-5-5
  samples: 2
  batch: 16
  chunk_lines: 80
  max_rounds: 2
  max_budget_usd: 3.0
  max_total_usd: 22.0  # the run's cap (35 USD) less what the calls in flight (parallel x max per call) can add
  parallel: 4
  timeout: 900

# Extracted (G5) items dropped on review. Each names the G4 statement it came from (gen-work/statements.jsonl).
exclude:
  # -- the same requirement as a reviewed (manual) or stage-model item, in the same kind with other parameters
  - {statement: "*", kind: artifact_exists, reason: "every file's and folder's existence is a stage-model / manual item (zero_stage gates on the closing files); a second copy double-counts it"}
  - {statement: "*", kind: doc_read_first, reason: "duplicates the manual doc_read_first item (INS:4, SP:68)"}
  - {statement: "*", kind: doc_read, reason: "each command document's read is a manual doc_read item in its own stage window (CW:14); an extra read item with another window double-counts it"}
  - {statement: "*", kind: agentos_v2.spec_folder, reason: "duplicates the manual single-spec-folder item (CW:43)"}
  - {statement: "*", kind: agentos_v2.requirements, reason: "duplicates the manual answers / initial_description items (CW:70-72, SS:216-223)"}
  - {statement: "*", kind: agentos_v2.tasks, reason: "duplicates the manual tasks.md items (group parts, test first, total, ticks, group order, later edits), whose requirement levels are reviewed (CT:42 makes the example format should)"}
  - {statement: "*", kind: agentos_v2.repo_read, reason: "duplicates the manual README / packaging / docs-index reads (SS:94-111); a read of any repository file is no search for reusable code (the manual reuse_search items, WS:32)"}
  - {statement: "*", kind: agentos_v2.blocks, reason: "duplicates the manual Specific Requirements / Existing Code to Leverage block items (WS:71-89)"}
  - {statement: "*", kind: agentos_v2.read, reason: "duplicates the manual artifact reads, whose windows and requirement levels are reviewed (SS:90, WS:15-18, CT:32-34 vs CT:13, IT:19, IT:29)"}
  - {statement: "*", kind: agentos_v2.checks, reason: "duplicates the manual check-script items (written, before the first code change, passing last)"}
  - {statement: "*", kind: agentos_v2.verify, reason: "duplicates the manual PHASE 3 items (code frozen, suite run, whole suite)"}
  - {statement: "*", kind: agentos_v2.report, reason: "duplicates the manual report items (test counts, failed tests, statuses, incomplete tasks, spec name)"}
  - {statement: "*", kind: agentos_v2.created_files, reason: "duplicates the manual global created-files items (CW:84-87), which cover every stage"}
  - {statement: ct-028, kind: prohibited_action, reason: "duplicates the manual global test_file_write item (CW:84-85)"}
  - {statement: "ws-020", kind: item_format, reason: "duplicates the manual User Stories / Out of Scope maximum items (WS:67, WS:92)"}
  - {statement: ss-053, kind: item_format, reason: "duplicates the compiled Reusability Opportunities shape item (SS:271) and the manual Existing Code to Reference item (SS:177)"}
  - {statement: cw-023, kind: item_format, reason: "covered per question by the manual answers item (CW:70-72)"}
  - {statement: ss-078, kind: item_format, reason: "follow-ups are '**Follow-up n:**' lines (SS:244), not a numbered list; the manual followups item counts them (SS:297)"}
  - {statement: ws-015, kind: no_template_residue, reason: "duplicates the manual code_free item (WS:53, WS:99)"}
  - {statement: ct-002, kind: agentos_v2.holds, reason: "spec.md / requirements.md existing is the earlier stages' own zero_stage gate; create-tasks' PHASE 1 fallback (CT:13) is not a requirement on create-tasks' result"}
  - {statement: ws-028, kind: order, reason: "duplicates a pair of the manual command order chain (write:spec before read:CT)"}
  - {statement: ss-016, kind: agentos_v2.paths_written, reason: "duplicates the manual global empty_folders item (CW:57, SS:67), which covers the whole run"}
  - {statement: ss-067, kind: path_match, reason: "the artifact's location fixes the name: the item cannot fail when requirements.md is found"}
  - {statement: it-134, kind: field_literal, reason: "its section 'Roadmap Updates' never matches the report's '## 2. Roadmap Updates'; the manual roadmap_status item reads that section"}
  - {statement: ws-026, kind: cross_ref, reason: "duplicates the manual no_extra_sections item (WS:101)"}
  - {statement: ss-081, kind: cross_ref, reason: "every backticked path with a slash anywhere in requirements.md -- paths the change will create and the spec folder's own included -- is no repository path claim; the manual existing_code_paths item checks the found features' paths (SS:175-177)"}

# Contradictions and gaps the documents leave, and how the rubric reads them (P3: both readings where expressible;
# the workflow over the system prompt's generic sections, CW:6-7).
conflicts:
  - description: "create-tasks PHASE 1 reads spec.md / requirements.md only when they are not in the conversation context (CT:13), while its Step 1 says to read each of them (CT:32-34); implement-tasks 'Analyze the provided spec.md, requirements.md' (IT:29) likewise"
    sources:
      - {path: docs/commands/create-tasks/create-tasks.md, lines: [13, 13], quote: "IF you don't have ONE OR BOTH of those files in your current conversation context, then find the spec folder under `/tmp/agent-os/specs/` (this run creates one) and read the files there."}
      - {path: docs/commands/create-tasks/create-tasks.md, lines: [32, 32], quote: "Read each of these files (whichever are available) and analyze them to understand the requirements for this feature implementation:"}
    resolution: "the reads of spec.md / requirements.md in create-tasks and implement-tasks are should; the run's own write of them is in its context"
  - description: "The create-tasks skeleton is 'an example format' to adapt (CT:42), while the test sub-tasks and acceptance criteria are stated as rules (CT:214-216)"
    sources:
      - {path: docs/commands/create-tasks/create-tasks.md, lines: [42, 42], quote: "The following is an example format - adapt the content of the tasks list to match what THIS feature actually needs."}
      - {path: docs/commands/create-tasks/create-tasks.md, lines: [214, 216], quote: "- **Use a focused test-driven approach** where each task group starts with writing 2-8 tests (x.1 sub-task) and ends with running ONLY those tests (final sub-task)"}
    resolution: "the example's headings, Overview, Dependencies lines and Execution Order are should; task groups with checkbox sub-tasks, acceptance criteria and test-first / run-last sub-tasks are must; the example's web-app groups (Database / API / UI) are never required"
  - description: "Run the entire test suite (IT:239) on repositories whose whole suite may be slow or fail to collect; the verification only reports and never fixes (IT:243)"
    sources:
      - {path: docs/commands/implement-tasks/implement-tasks.md, lines: [239, 239], quote: "Run the entire tests suite for the application so that ALL tests run."}
      - {path: docs/commands/implement-tasks/implement-tasks.md, lines: [243, 243], quote: "DO NOT attempt to fix any failing tests.  Just note their failures in your final verification report."}
    resolution: "a valid test run (>= 1 test reported) after every task is ticked and before the report is must, and so is one of them being the whole suite (a bare runner at the repository root, or only its top-level test directory); a run that only fails to collect is no valid run, so such a repository costs the PHASE 3 items; repository edits after PHASE 3 began fail code_frozen"
  - description: "IT:39 'Running ONLY the tests you've written' after each task group: whether a later group re-runs an earlier group's checks is not said"
    sources:
      - {path: docs/commands/implement-tasks/implement-tasks.md, lines: [39, 39], quote: "- Running ONLY the tests you've written (if any; they are check scripts under `/tmp/agent-os/specs/[this-spec]/checks/`, not repository test files) and ensuring those tests pass."}
    resolution: "read as every check script written so far: each one's last run must pass after the last code change of implement-tasks (pass_last); upstream states no fail-first step, so a check failing before the change is not required"
  - description: "The report's structure 'should' be followed (IT:249), while section 2's status and its reason are imperative (IT:235) and the counts and failed tests must be included (IT:241)"
    sources:
      - {path: docs/commands/implement-tasks/implement-tasks.md, lines: [249, 249], quote: "The content of this report should follow this structure:"}
      - {path: docs/commands/implement-tasks/implement-tasks.md, lines: [235, 235], quote: "In section 2 of the report (Roadmap Updates), record Status `⚠️ No Updates Needed` with that reason in its Notes."}
    resolution: "the report's headings, labels and status value sets are should; its existence, section 2's status and reason, the Test Summary counts (against a PHASE 3 run), the failed tests and a Test Suite status the run does not refute are must"
  - description: "shape-spec's questions are 4-8 numbered ones plus the reusability question at the end (SS:121-123), which requirements.md may record as one more **Qn:**"
    sources:
      - {path: docs/commands/shape-spec/shape-spec.md, lines: [121, 123], quote: "Based on the initial idea, generate 4-8 targeted, NUMBERED questions that explore requirements while suggesting reasonable defaults. **CRITICAL: Always include the reusability question at the END of your questions.**"}
    resolution: "4 to 9 **Qn:** lines numbered from 1; the reuse answer itself is judged in Existing Code to Reference"
  - description: "The generic system prompt asks to ask the user for clarification and to keep AGENTS.md in the repository (SP:11, SP:175); the workflow has no one to ask and keeps everything of its own out of /testbed (CW:67-74, CW:86-87)"
    sources:
      - {path: system-prompt.j2, lines: [11, 11], quote: "* Use `AGENTS.md` under the repository root as your persistent memory for repository-specific knowledge and context."}
      - {path: docs/core-workflow.md, lines: [86, 87], quote: "Nothing that belongs to the workflow goes into `/testbed`: no spec files, notes, summaries or temporary scripts."}
    resolution: "the workflow wins (CW:6-7 'it replaces any procedure you would otherwise follow'): spec files, notes and scratch scripts created in the repository fail their item; AGENTS.md is not itemized; no item rewards asking"
  - description: "The report has four **Status:** lines (IT:257, 269, 285, 297), each with its own value set (G7 critic: a whole-report Status enum would demand the header's values everywhere)"
    sources:
      - {path: docs/commands/implement-tasks/implement-tasks.md, lines: [257, 257], quote: "**Status:** ✅ Passed | ⚠️ Passed with Issues | ❌ Failed"}
      - {path: docs/commands/implement-tasks/implement-tasks.md, lines: [285, 285], quote: "**Status:** ✅ Updated | ⚠️ No Updates Needed | ❌ Issues Found"}
    resolution: "the header enum reads the document's first Status line only (a section-less field read stops at the first match, the header under the title); sections 1, 2 and 3 are read in their own sections; all four items stand"

# Items the skeletons do not yield (or yield too weakly): every rule about the run -- the reads, the spec folder, the
# repository, the check scripts, tasks.md's groups and ticks, PHASE 3's test run -- and the fields the skeletons cannot
# state (the numbered questions and their assumed answers, the alternatives of a conditional section, the report's
# status lines against the run). Each replaces compiled or extracted items on the same subject.
manual:
  # ============================================================== global
  - id: agentos_v2.global.run.doc_read_first.cw
    stage: global
    class: evidence
    requirement: must
    check: {kind: doc_read_first, params: {doc: CW}}
    availability: [trace]
    modality_evidence: "imperative (INS:4 'open /agent-os/core-workflow.md; that is your first action'; SP:68 'The first thing you do is open /agent-os/core-workflow.md')"
    sources:
      - {path: instruction.md, lines: [4, 4], quote: "Before you look at the repository, open /agent-os/core-workflow.md; that is your first action."}
      - {path: system-prompt.j2, lines: [68, 68], quote: "1. The first thing you do is open /agent-os/core-workflow.md."}
  - id: agentos_v2.global.run.order.commands
    stage: global
    class: evidence
    requirement: must
    check: {kind: order, params: {chain: ["read:SS", "write:initialization", "write:requirements", "read:WS", "write:spec", "read:CT", "write:tasks", "read:IT", "first_repo_write", "write:final_verification"], invalidate: [read_ahead]}}
    availability: [trace]
    modality_evidence: "CW:14 'Open each command document when you reach it'; CW:27 'Each command runs once, in this order'; SS:3 PHASEs in order; CW:81 only implement-tasks PHASE 2 changes /testbed"
    sources:
      - {path: docs/core-workflow.md, lines: [14, 14], quote: "Open each command document when you reach it, and work from that document rather than from memory:"}
      - {path: docs/core-workflow.md, lines: [27, 28], quote: "Each command runs once, in this order, and its document ends by naming the next one; implement-tasks ends with its report."}
      - {path: docs/commands/shape-spec/shape-spec.md, lines: [3, 3], quote: "Carefully carry out the PHASE sections below in order, finishing one before the next."}
      - {path: docs/core-workflow.md, lines: [81, 81], quote: "Only implement-tasks PHASE 2 changes `/testbed`."}
      - {path: system-prompt.j2, lines: [70, 71], quote: "2. Carry out the four command documents under /agent-os/commands/ one after another, opening each one when you reach it and doing its PHASEs in order."}
    note: "each command document read when its command begins, then its files written: initialization.md (PHASE 1), requirements.md, spec.md, tasks.md, the first repository edit, final-verification.md; a document first seen before the previous file was written (read ahead, e.g. all four at once) voids its pair; a write counts only when its file is substantive"
  - id: agentos_v2.global.run.agentos_v2_spec_folder.single
    stage: global
    class: evidence
    requirement: must
    check: {kind: agentos_v2.spec_folder, params: {}}
    availability: [sandbox_file]
    modality_evidence: "CW:43 'shape-spec creates the spec folder once'; CW:44-45 'each of these means that one folder, and every later command works in it'"
    sources:
      - {path: docs/core-workflow.md, lines: [43, 45], quote: "shape-spec creates the spec folder once, as `/tmp/agent-os/specs/<YYYY-MM-DD>-<name>/`: today's date and a short kebab-case name you choose for the change. The documents call it `[this-spec]`, `[current-spec]`, `[spec-path]` or `$SPEC_PATH`; each of these means that one folder, and every later command works in it."}
    note: "exactly one directory under /tmp/agent-os/specs/ at the end"
  - id: agentos_v2.global.run.prohibited_action.test_file_write
    stage: global
    class: evidence
    requirement: must
    check: {kind: prohibited_action, params: {action: test_file_write}}
    availability: [trace]
    modality_evidence: "CW:84-85 'No test file in the repository is added or edited'; CT:215 'do not add or change test files in the repository'"
    sources:
      - {path: docs/core-workflow.md, lines: [84, 85], quote: "No test file in the repository is added or edited."}
      - {path: docs/commands/create-tasks/create-tasks.md, lines: [215, 215], quote: "do not add or change test files in the repository."}
    note: "no edit of a test file that existed at BASE_SHA"
  - id: agentos_v2.global.run.agentos_v2_created_files.tests
    stage: global
    class: evidence
    requirement: must
    check: {kind: agentos_v2.created_files, params: {test_paths: true}}
    availability: [trace]
    modality_evidence: "CW:84-85 'No test file in the repository is added'; CT:215 every test a task group writes is a script under checks/"
    sources:
      - {path: docs/core-workflow.md, lines: [84, 85], quote: "The tests the task groups call for are scripts in `S/checks/`. No test file in the repository is added or edited."}
      - {path: docs/commands/create-tasks/create-tasks.md, lines: [215, 215], quote: "every test a task group writes (the x.1 sub-task, and the additional tests of a test-review group) is a script under `/tmp/agent-os/specs/[this-spec]/checks/`, run on its own"}
    note: "no new test file created in the repository (even when removed again)"
  - id: agentos_v2.global.run.agentos_v2_created_files.workflow_files
    stage: global
    class: evidence
    requirement: must
    check: {kind: agentos_v2.created_files, params: {pattern: '(?i)(?:^|/)(?:repro|reproduce|reproduction|debug|scratch|tmp|temp|check|verify)[^/]*\.(?:py|sh|txt|md|log)$|(?:^|/)(?:spec|tasks|requirements|initialization|final-verification)\.md$|(?:^|/)[^/]*(?:SUMMARY|NOTES)[^/]*\.(?:md|txt)$'}}
    availability: [trace]
    modality_evidence: "CW:86-87 'Nothing that belongs to the workflow goes into /testbed'"
    sources:
      - {path: docs/core-workflow.md, lines: [86, 87], quote: "Nothing that belongs to the workflow goes into `/testbed`: no spec files, notes, summaries or temporary scripts. They go to `S/`, scratch files to `S/checks/`."}
    note: "no spec file, note, summary or scratch / check script created in the repository (even when removed again)"
  - id: agentos_v2.global.run.agentos_v2_paths_written.scratch_outside_checks
    stage: global
    class: evidence
    requirement: should
    check: {kind: agentos_v2.paths_written, params: {pattern: '^/tmp/(?!agent-os/specs/[^/]+/checks/)\S*\.(?:py|sh|bash|js|ts|rb|pl)$'}}
    availability: [trace]
    modality_evidence: "CW:87 'scratch files to S/checks/' (where, not a prohibition: should)"
    sources:
      - {path: docs/core-workflow.md, lines: [86, 87], quote: "They go to `S/`, scratch files to `S/checks/`."}
      - {path: docs/core-workflow.md, lines: [56, 56], quote: "the tests the task groups call for, as scripts; any scratch file"}
    note: "no script written under /tmp outside the spec folder's checks/"
  - id: agentos_v2.global.run.agentos_v2_paths_written.empty_folders
    stage: global
    class: evidence
    requirement: must
    check: {kind: agentos_v2.paths_written, params: {pattern: '^/tmp/agent-os/specs/[^/]+/(?:implementation|planning/visuals)/'}}
    availability: [trace]
    modality_evidence: "CW:53, CW:57 'stays empty'; SS:67 'Implementation folder should be empty, for now'"
    sources:
      - {path: docs/core-workflow.md, lines: [53, 53], quote: "made by shape-spec PHASE 1; stays empty, nobody adds mockups"}
      - {path: docs/core-workflow.md, lines: [57, 57], quote: "made by shape-spec PHASE 1; stays empty"}
      - {path: docs/commands/shape-spec/shape-spec.md, lines: [67, 67], quote: "- Implementation folder should be empty, for now"}
    note: "nothing written into planning/visuals/ or implementation/"
  - id: agentos_v2.global.run.agentos_v2_paths_written.no_roadmap
    stage: global
    class: evidence
    requirement: must
    check: {kind: agentos_v2.paths_written, params: {pattern: '(?:^|/)agent-os/product/roadmap\.md$'}}
    availability: [trace]
    modality_evidence: "IT:235 'do not create it'"
    sources:
      - {path: docs/commands/implement-tasks/implement-tasks.md, lines: [235, 235], quote: "This project has no `agent-os/product/roadmap.md` (plan-product is not part of this workflow): do not create it."}
  - id: agentos_v2.global.run.agentos_v2_holds.shape_files_left_alone
    stage: global
    class: evidence
    requirement: must
    check: {kind: agentos_v2.holds, params: {predicate: {all: [{absent: {fact: artifact_write, artifact: initialization, window: ["stage_end:shape_spec", "end"]}}, {absent: {fact: artifact_write, artifact: requirements, window: ["stage_end:shape_spec", "end"]}}]}}}
    availability: [trace]
    modality_evidence: "CW:62-63 'leave a file alone once its command is over'"
    sources:
      - {path: docs/core-workflow.md, lines: [62, 63], quote: "Write each file in the structure its document gives, and leave a file alone once its command is over, except for the checkboxes in `tasks.md`."}
    note: "initialization.md and requirements.md not written after shape-spec"
  - id: agentos_v2.global.run.agentos_v2_holds.spec_left_alone
    stage: global
    class: evidence
    requirement: must
    check: {kind: agentos_v2.holds, params: {predicate: {absent: {fact: artifact_write, artifact: spec, window: ["stage_end:write_spec", "end"]}}}}
    availability: [trace]
    modality_evidence: "CW:62-63 'leave a file alone once its command is over'"
    sources:
      - {path: docs/core-workflow.md, lines: [62, 63], quote: "leave a file alone once its command is over, except for the checkboxes in `tasks.md`."}
    note: "spec.md not written after write-spec"
  - id: agentos_v2.global.tasks.agentos_v2_tasks.later_edits
    stage: global
    class: evidence
    requirement: must
    target: {type: artifact, ref: tasks}
    check: {kind: agentos_v2.tasks, params: {rule: later_edits, window: ["stage_end:create_tasks", "end"]}}
    availability: [trace]
    modality_evidence: "CW:62-63 'except for the checkboxes in tasks.md'; IT:32, IT:227-229 tick or mark ⚠️"
    sources:
      - {path: docs/core-workflow.md, lines: [62, 63], quote: "leave a file alone once its command is over, except for the checkboxes in `tasks.md`."}
      - {path: docs/commands/implement-tasks/implement-tasks.md, lines: [229, 229], quote: "IF you have concluded that this task has NOT been completed, then mark this checkbox with ⚠️ and note it's incompleteness in your verification report."}
    note: "after create-tasks, every write of tasks.md only ticks boxes or marks them ⚠️"

