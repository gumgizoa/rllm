roots:
  artifact: /tmp/agent-os/specs
  code: '{WORKDIR}'
vars:
  SPEC:
    under: '{artifact}'
    regex: '[^./][^/]*'
    bind: single
stages:
- id: shape_spec
  doc: SS
  artifacts:
  - spec_dir
  - initialization
  - visuals_dir
  - implementation_dir
  - verifications_dir
  - requirements
  order_artifact: requirements
- id: write_spec
  doc: WS
  artifacts:
  - spec
  order_artifact: spec
  requires:
  - requirements
- id: create_tasks
  doc: CT
  artifacts:
  - tasks
  order_artifact: tasks
  requires:
  - spec
  - requirements
- id: implement_tasks
  doc: IT
  artifacts:
  - final_verification
  order_artifact: final_verification
  requires:
  - tasks
artifacts:
  spec_dir:
    locations:
    - '{artifact}/{SPEC}'
    exclusive: false
    write_event: last_in_window
    optional: false
    kind: dir
  initialization:
    locations:
    - '{artifact}/{SPEC}/planning/initialization.md'
    exclusive: false
    write_event: last_in_window
    optional: false
    kind: markdown
  visuals_dir:
    locations:
    - '{artifact}/{SPEC}/planning/visuals'
    exclusive: false
    write_event: last_in_window
    optional: false
    kind: dir
  implementation_dir:
    locations:
    - '{artifact}/{SPEC}/implementation'
    exclusive: false
    write_event: last_in_window
    optional: false
    kind: dir
  verifications_dir:
    locations:
    - '{artifact}/{SPEC}/verifications'
    exclusive: false
    write_event: last_in_window
    optional: false
    kind: dir
  requirements:
    locations:
    - '{artifact}/{SPEC}/planning/requirements.md'
    exclusive: false
    template: SS
    write_event: last_in_window
    optional: false
    kind: markdown
  spec:
    locations:
    - '{artifact}/{SPEC}/spec.md'
    exclusive: false
    template: WS
    write_event: last_in_window
    optional: false
    kind: markdown
  tasks:
    locations:
    - '{artifact}/{SPEC}/tasks.md'
    exclusive: false
    template: CT
    write_event: last_in_window
    optional: false
    kind: markdown
  final_verification:
    locations:
    - '{artifact}/{SPEC}/verifications/final-verification.md'
    exclusive: false
    template: IT
    write_event: last_in_window
    optional: false
    kind: markdown
