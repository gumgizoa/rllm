  sections:
    SOUL: harness_generic
    ROLE: harness_generic
    MEMORY: harness_generic
    EFFICIENCY: harness_generic
    FILE_SYSTEM_GUIDELINES: harness_generic
    CODE_QUALITY: harness_generic
    VERSION_CONTROL: harness_generic
    PULL_REQUESTS: harness_generic
    PROBLEM_SOLVING_WORKFLOW: workflow
    SELF_DOCUMENTATION: harness_generic
